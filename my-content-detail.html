<!DOCTYPE html>
<html lang="ko"><head>
<link rel="stylesheet" href="login/styles/fonts.css">
<link rel="stylesheet" href="dashboard-common.css">
<script>
  window.__SHORTFLOW_DETAIL_ENTRY_ROLE__ = 'producer';
</script>
<script src="utility-remote.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 상세보기</title>

  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body { font-family: 'Geist', 'Pretendard', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    .my-content-actionbar {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 118px;
      padding: 10px;
      border: 1px solid rgba(17,17,17,0.1);
      border-radius: 16px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 6px 16px rgba(15,23,42,0.08);
      backdrop-filter: blur(12px);
      z-index: 1000;
    }
    .my-content-actionbar::before {
      content: "";
      width: 28px;
      height: 4px;
      margin: 0 auto 1px;
      border-radius: 999px;
      background: #dedbd3;
    }
    .my-content-remote-title {
      color: #8b8f98;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-align: center;
    }
    .my-content-remote-status {
      color: #9b9da3;
      display: block;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
    }
    .my-content-floating-btn {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid #e4e2dc;
      border-radius: 10px;
      background: #fff;
      color: #333;
      font-family: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }
    .my-content-floating-btn:hover {
      background: #f7f6f2;
    }
    @media (max-width: 720px) {
      .my-content-actionbar {
        width: 104px;
        padding: 6px;
      }
      .my-content-floating-btn {
        height: 32px;
        padding: 0 10px;
      }
    }
  </style>

  <script src="login/vendor/react.development.js"></script>
  <script src="login/vendor/react-dom.development.js"></script>

  <script src="assets/js/unbundled/shared/tokens.js"></script>
  <script src="assets/js/unbundled/shared/primitives.js"></script>
  <script src="assets/js/unbundled/detail/content-library-data.js"></script>
  <script src="assets/js/unbundled/detail/content-search.js"></script>
  <script src="assets/js/unbundled/detail/cart-data.js"></script>
  <script src="assets/js/unbundled/detail/cart-primitives.js"></script>
  <script src="assets/js/unbundled/detail/cart-cards.js"></script>
  <script src="assets/js/unbundled/detail/platform-detail.js"></script>
</head>
<body>
<div data-shortflow-nav="my-content"></div>
<div id="contentManageSubNav"></div>
<script>
  document.getElementById('contentManageSubNav').outerHTML = window.ShortflowNav.renderContentManageSubNav('contents');
</script>
  <div id="root"></div>

  <script src="assets/js/unbundled/detail/platform-detail-entry.js"></script>

<script src="assets/js/unbundled/detail/platform-detail-runtime.js"></script>
<script>
  function installMyContentActions() {
    var observer = null;
    var renderActionbar = function () {
      var root = document.getElementById('root');
      if (!root || document.querySelector('.my-content-actionbar')) return;
      if (!root.children.length) return;
      var actionbar = document.createElement('div');
      actionbar.className = 'my-content-actionbar';
      actionbar.style.visibility = 'hidden';
      actionbar.innerHTML = [
        '<div class="my-content-remote-title">MY CONTENT</div>',
        '<span class="my-content-remote-status">관리 도구</span>',
        '<button class="my-content-floating-btn my-content-edit-btn" type="button">수정하기</button>',
        '<button class="my-content-floating-btn my-content-review-btn" type="button">검토 요청</button>',
        '<button class="my-content-floating-btn my-content-workflow-btn" type="button">워크플로우</button>'
      ].join('');
      actionbar.querySelector('.my-content-edit-btn').addEventListener('click', function () {
        alert('콘텐츠 수정 화면으로 이동합니다.');
      });
      actionbar.querySelector('.my-content-review-btn').addEventListener('click', function () {
        alert('검토 요청을 보냈습니다.');
      });
      actionbar.querySelector('.my-content-workflow-btn').addEventListener('click', function () {
        window.location.href = 'producer-dashboard.html?tab=workflow';
      });
      document.body.appendChild(actionbar);
      var positionActionbar = function () {
        var rootRect = root.getBoundingClientRect();
        var backTarget = Array.from(root.querySelectorAll('button, a, div, span')).find(function (node) {
          var text = node.textContent.replace(/\s+/g, ' ').trim();
          return text === '뒤로가기' || text === '뒤로 가기' || text === '목록으로' || /^Back$/i.test(text);
        });
        var backControl = backTarget ? backTarget.closest('button, a') || backTarget : null;
        var backRect = backControl ? backControl.getBoundingClientRect() : rootRect;
        var gap = 14;
        var panelWidth = actionbar.offsetWidth || 112;
        var outsideLeft = rootRect.right + gap;
        var insideLeft = rootRect.right - panelWidth - gap;
        var hasOutsideRoom = outsideLeft + panelWidth <= window.innerWidth - 12;
        actionbar.style.top = Math.max(64, backRect.top) + 'px';
        actionbar.style.left = Math.max(12, hasOutsideRoom ? outsideLeft : insideLeft) + 'px';
      };
      if (observer) observer.disconnect();
      requestAnimationFrame(function () {
        positionActionbar();
        actionbar.style.visibility = 'visible';
      });
      window.addEventListener('resize', positionActionbar);
      window.addEventListener('scroll', positionActionbar, { passive: true });
    };
    renderActionbar();
    if (!document.querySelector('.my-content-actionbar')) {
      var root = document.getElementById('root');
      if (!root) return;
      observer = new MutationObserver(renderActionbar);
      observer.observe(root, { childList: true, subtree: true });
    }
  }

  function removeDetailBackButton() {
    var root = document.getElementById('root');
    if (!root) return;
    Array.from(root.querySelectorAll('button')).forEach(function (button) {
      var label = button.textContent.replace(/\s+/g, ' ').trim();
      if (label === '뒤로가기' || label === '뒤로 가기' || /^Back$/i.test(label)) {
        button.remove();
      }
    });
  }

  function installBackButtonRemoval() {
    var root = document.getElementById('root');
    if (!root) return;
    removeDetailBackButton();
    var observer = new MutationObserver(removeDetailBackButton);
    observer.observe(root, { childList: true, subtree: true });
  }

  document.addEventListener('DOMContentLoaded', installMyContentActions);
  document.addEventListener('DOMContentLoaded', installBackButtonRemoval);

  document.addEventListener('click', function (event) {
    var control = event.target.closest('button, a');
    if (!control) return;
    var label = control.textContent.replace(/\s+/g, ' ').trim();
    if (label !== '뒤로가기' && label !== '뒤로 가기' && label !== '목록으로' && !/^Back$/i.test(label)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    window.location.href = 'contentlist-prod.html';
  }, true);
</script>
</body></html>
