<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flobi Widget · Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="flobi-widget.css">
<style>html,body{margin:0;height:100%;background:#f7f7f8;font-family:Pretendard,sans-serif}a{color:#0a84ff}a:hover{color:#0a70e0}
.flobi-root{position:fixed;inset:0;pointer-events:none;z-index:9999}
main{padding:40px;color:#71717a;font-size:14px}</style>
</head>
<body>
<main>관리자 페이지 콘텐츠 영역 (데모). 우측 하단 플로비를 눌러보세요.</main>
<div class="flobi-root" id="flobi-root"></div>
<script src="flobi-widget.js"></script>
<script>window.flobi=new FlobiWidget(document.getElementById('flobi-root'),{live:true});</script>
</body>
</html>
