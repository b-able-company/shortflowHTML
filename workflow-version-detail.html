<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>워크플로우버전 상세 — 제작사</title>
  <link rel="stylesheet" href="dashboard-common.css">
  <script src="dashboard-nav.js"></script>
  <script src="distribution-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    :root {
      --dist-line: #e7e5df;
      --dist-soft: #f7f7f5;
      --dist-text: #151515;
      --dist-muted: #737780;
    }

    html,
    body {
      margin: 0;
      background: #fff;
    }

    body {
      color: var(--dist-text);
      font-family: "Pretendard Variable", "Pretendard", "Geist", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    .distribution-detail-wrap {
      width: min(var(--max), calc(100vw - 48px));
      margin: 0 auto;
      padding: 24px 0 140px;
    }

    .detail-back {
      width: fit-content;
      margin-bottom: 12px;
      border: 0;
      background: #fff;
      color: #666a72;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 520;
      text-decoration: none;
      transform: translateY(-6px);
    }

    .detail-back-mark {
      font-size: 17px;
      font-weight: 520;
      line-height: 1;
      transform: translateY(-0.5px);
    }

    .detail-back:hover {
      color: #181818;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 176px minmax(0, 1fr);
      gap: 22px;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .detail-poster-original {
      width: 176px;
      height: auto;
      border-radius: 7px;
      background: var(--dist-soft);
      display: block;
    }

    .detail-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 249px;
    }

    .detail-title {
      margin: 6px 0 0;
      overflow: hidden;
      color: #171717;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      min-height: 30px;
    }

    .detail-title-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .detail-title-main .detail-external-actions {
      margin-top: 10px;
    }

    .detail-view-actions {
      display: inline-flex;
      align-items: stretch;
      gap: 0;
      flex: 0 0 auto;
      isolation: isolate;
    }

    .detail-view-button {
      position: relative;
      min-width: 110px;
      height: 38px;
      padding: 0 18px;
      border: 1px solid #f2f2f2;
      border-radius: 0;
      background: #f2f2f2;
      color: #181818;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 550;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .detail-view-button + .detail-view-button {
      margin-left: -1px;
      border-left-color: #e5e5e5;
    }

    .detail-view-button:first-child {
      border-radius: 14px 0 0 14px;
    }

    .detail-view-button:last-child {
      border-radius: 0 14px 14px 0;
    }

    .detail-view-button:hover {
      z-index: 1;
      background: rgb(221, 221, 221);
      border-color: rgb(221, 221, 221);
    }

    .detail-view-button.is-active {
      z-index: 2;
      background: rgb(215, 215, 215);
      border-color: rgb(215, 215, 215);
      color: #181818;
    }

    .hero-summary {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-eyebrow {
      color: var(--dist-muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.6px;
      line-height: 12px;
    }

    .hero-metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .hero-metric-grid.is-three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .hero-metric-item {
      min-width: 0;
      padding: 17px 18px;
      border: 0.5px solid var(--dist-line);
      border-radius: 12px;
      background: #fff;
    }

    .hero-metric-item span {
      margin-bottom: 10px;
      color: var(--dist-muted);
      display: block;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .hero-metric-item strong {
      color: #171717;
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .platform-panel {
      margin-top: 0;
    }

    .panel-head {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid var(--dist-line);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      margin: 6px 0 0;
      color: #181818;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.15;
    }

    .panel-title-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .panel-info {
      position: relative;
      width: 18px;
      height: 18px;
      border: 0.5px solid #d9d9d4;
      border-radius: 50%;
      background: #fff;
      color: #8a8e96;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 650;
      line-height: 1;
      cursor: help;
      transform: translateY(2px);
    }

    .panel-info::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 9px);
      width: 300px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #1d1d1f;
      color: #fff;
      font-family: "Pretendard Variable", "Pretendard", "Geist", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
      white-space: normal;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 20;
    }

    .panel-info::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      width: 9px;
      height: 9px;
      background: #1d1d1f;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px) rotate(45deg);
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 19;
    }

    .panel-info:hover::after,
    .panel-info:hover::before,
    .panel-info:focus-visible::after,
    .panel-info:focus-visible::before {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .platform-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .workflow-detail-split {
      display: grid;
      grid-template-columns: 400px minmax(0, 1fr);
      gap: 22px;
      align-items: flex-start;
    }

    .workflow-detail-split .workflow-material-panel {
      margin: 0;
      padding: 32px 26px 16px;
      border: 0.5px solid var(--dist-line);
      background: #fff;
      border-radius: 14px;
    }

    .workflow-section {
      position: relative;
      padding-top: 8px;
    }

    .workflow-section-title {
      position: absolute;
      top: 0;
      left: 18px;
      z-index: 1;
      margin: 0;
      padding: 0 8px;
      background: #fff;
      color: #181818;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .workflow-detail-split .workflow-section > .workflow-card {
      padding: 32px 26px 22px;
      border: 0.5px solid var(--dist-line);
      background: #fff;
      border-radius: 14px;
    }

    .workflow-detail-split .workflow-card-head {
      margin-bottom: 20px;
    }

    .workflow-detail-split .workflow-material-panel > .workflow-card-head {
      margin-bottom: 20px;
    }

    .workflow-detail-split .workflow-timeline,
    .workflow-detail-split .workflow-material-group {
      margin-left: 0;
    }

    .workflow-platform-overview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      padding-top: 8px;
      margin-bottom: 18px;
    }

    .workflow-platform-box {
      position: relative;
      min-width: 0;
      padding: 22px 26px 20px;
      border: 0.5px solid var(--dist-line);
      border-radius: 14px;
      background: #fff;
    }

    .workflow-platform-box-head {
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 10px;
    }

    .workflow-platform-box-title {
      position: absolute;
      top: -8px;
      left: 18px;
      margin: 0;
      padding: 0 8px;
      background: #fff;
      color: #181818;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .workflow-platform-box-count {
      height: 22px;
      padding: 0 8px;
      border: 0.5px solid #ececec;
      border-radius: 999px;
      background: #fafafa;
      color: #737780;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .workflow-contract-list,
    .workflow-negotiation-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .workflow-contract-item,
    .workflow-negotiation-item {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 0.5px solid #f0f0f0;
    }

    .workflow-contract-item:first-child,
    .workflow-negotiation-item:first-child {
      padding-top: 0;
    }

    .workflow-contract-item:last-child,
    .workflow-negotiation-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .workflow-contract-name,
    .workflow-negotiation-name {
      min-width: 0;
      overflow: hidden;
      color: #181818;
      flex: 0 1 auto;
      font-size: 13px;
      font-weight: 450;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workflow-contract-status,
    .workflow-negotiation-status {
      height: 24px;
      padding: 0 9px 0 8px;
      border: 0.5px solid #e9e9e9;
      border-radius: 999px;
      color: #4f535a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 570;
      line-height: 1;
      white-space: nowrap;
    }

    .workflow-contract-status {
      width: 65px;
      position: relative;
      justify-content: center;
      padding: 0 8px 0 20px;
    }

    .workflow-negotiation-status {
      min-width: 52px;
      border-color: transparent;
      font-weight: 620;
    }

    .workflow-contract-status::before,
    .workflow-negotiation-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .workflow-contract-status::before {
      position: absolute;
      top: 50%;
      left: 8px;
      transform: translateY(-50%);
    }

    .workflow-contract-status.is-active {
      color: #2f8f52;
    }

    .workflow-contract-status.is-active::before {
      animation: livePulse 2s ease-in-out infinite;
    }

    .workflow-contract-status.is-scheduled {
      color: #3d7db8;
    }

    .workflow-contract-status.is-closed {
      color: #7d828a;
    }

    .workflow-negotiation-status.is-negotiating {
      background: #eaf3ff;
      color: #2f6fb4;
    }

    .workflow-negotiation-status::before {
      display: none;
    }

    .workflow-negotiation-status.is-hold {
      background: #f0f1f3;
      color: #666d78;
    }

    .workflow-negotiation-meta {
      margin-top: 4px;
      color: #8a8e96;
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.25;
    }

    .workflow-material-group h4 span {
      width: 5px;
      height: 5px;
      background: #181818;
    }

    .workflow-material-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    .workflow-material-table td:nth-child(odd) {
      width: 20%;
      background: #fafafa;
      font-size: 12px;
    }

    .workflow-material-table td:nth-child(even) {
      width: 30%;
    }

    .workflow-material-table .count-current,
    .workflow-material-table .count-number {
      color: #181818;
      font-size: 14px;
      font-weight: 620;
      line-height: 1;
    }

    .workflow-material-table .count-total,
    .workflow-material-table .count-unit {
      font-size: inherit;
      font-weight: inherit;
    }

    .drive-loading-state {
      min-height: 426px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #737780;
      text-align: center;
    }

    .drive-loading-cat {
      width: 220px;
      height: 100px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drive-loading-stars {
      position: relative;
      width: min(100%, 360px);
      height: 180px;
      border-radius: 14px;
      background: transparent;
      overflow: hidden;
    }

    .drive-loading-stars canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .floppy-cat {
      width: 100%;
      height: auto;
      overflow: visible;
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }

    .cat-body {
      transform-box: fill-box;
      transform-origin: center;
      animation: bodyBounce 760ms steps(1, end) infinite;
    }

    .cat-head {
      transform-box: fill-box;
      transform-origin: center;
      animation: headBounce 760ms steps(1, end) infinite;
    }

    .front-legs {
      transform-box: fill-box;
      transform-origin: center;
      animation: frontLegRun 760ms steps(1, end) infinite;
    }

    .rear-legs {
      transform-box: fill-box;
      transform-origin: center;
      animation: rearLegRun 760ms steps(1, end) infinite;
    }

    .trail-wave {
      transform-box: fill-box;
      transform-origin: right center;
    }

    .trail-wave-1 {
      fill: #9ba3ad;
      animation: trail1 760ms steps(1, end) infinite;
    }

    .trail-wave-2 {
      fill: #cdd2d8;
      animation: trail2 760ms steps(1, end) infinite;
    }

    .trail-wave-3 {
      fill: #f2f2f2;
      animation: trail3 760ms steps(1, end) infinite;
    }

    @keyframes bodyBounce {
      0% { transform: translateY(0); }
      12.5% { transform: translateY(-1px); }
      25% { transform: translateY(-2px); }
      37.5% { transform: translateY(-1px); }
      50% { transform: translateY(0); }
      62.5% { transform: translateY(1px); }
      75% { transform: translateY(0); }
      87.5% { transform: translateY(-1px); }
      100% { transform: translateY(0); }
    }

    @keyframes headBounce {
      0% { transform: translateY(0); }
      12.5% { transform: translateY(-1px); }
      25% { transform: translateY(-2px); }
      37.5% { transform: translateY(-1px); }
      50% { transform: translateY(0); }
      62.5% { transform: translateY(1px); }
      75% { transform: translateY(0); }
      87.5% { transform: translateY(-1px); }
      100% { transform: translateY(0); }
    }

    @keyframes frontLegRun {
      0% { transform: translateX(2px); }
      12.5% { transform: translateX(1px) translateY(-1px); }
      25% { transform: translateX(0) translateY(-2px); }
      37.5% { transform: translateX(-1px); }
      50% { transform: translateX(-2px); }
      62.5% { transform: translateX(-1px) translateY(-1px); }
      75% { transform: translateX(0) translateY(-2px); }
      87.5% { transform: translateX(1px); }
      100% { transform: translateX(2px); }
    }

    @keyframes rearLegRun {
      0% { transform: translateX(-2px); }
      12.5% { transform: translateX(-1px) translateY(-1px); }
      25% { transform: translateX(0) translateY(-2px); }
      37.5% { transform: translateX(1px); }
      50% { transform: translateX(2px); }
      62.5% { transform: translateX(1px) translateY(-1px); }
      75% { transform: translateX(0) translateY(-2px); }
      87.5% { transform: translateX(-1px); }
      100% { transform: translateX(-2px); }
    }

    @keyframes trail1 {
      0% { transform: translateY(0); }
      12.5% { transform: translateY(-2px); }
      25% { transform: translateY(-3px); }
      37.5% { transform: translateY(-1px); }
      50% { transform: translateY(1px); }
      62.5% { transform: translateY(2px); }
      75% { transform: translateY(1px); }
      87.5% { transform: translateY(0); }
      100% { transform: translateY(0); }
    }

    @keyframes trail2 {
      0% { transform: translateY(2px); }
      12.5% { transform: translateY(1px); }
      25% { transform: translateY(0); }
      37.5% { transform: translateY(-2px); }
      50% { transform: translateY(-3px); }
      62.5% { transform: translateY(-1px); }
      75% { transform: translateY(1px); }
      87.5% { transform: translateY(2px); }
      100% { transform: translateY(2px); }
    }

    @keyframes trail3 {
      0% { transform: translateY(-1px); }
      12.5% { transform: translateY(1px); }
      25% { transform: translateY(2px); }
      37.5% { transform: translateY(1px); }
      50% { transform: translateY(0); }
      62.5% { transform: translateY(-2px); }
      75% { transform: translateY(-3px); }
      87.5% { transform: translateY(-2px); }
      100% { transform: translateY(-1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-body,
      .cat-head,
      .front-legs,
      .rear-legs,
      .trail-wave {
        animation: none;
      }
    }

    .drive-loading-copy {
      margin: 0;
      color: #181818;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.4;
    }

    .drive-loading-stars .drive-loading-copy {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .drive-loading-copy span {
      display: inline-block;
      width: 3px;
      height: 3px;
      margin: 0 1px;
      border-radius: 50%;
      background: currentColor;
      color: inherit;
      line-height: 1;
      vertical-align: middle;
      text-indent: -999px;
      overflow: hidden;
      animation: driveLoadingDot 0.9s ease-in-out infinite;
    }

    .drive-loading-copy span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .drive-loading-copy span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes driveLoadingDot {
      0%,
      100% {
        opacity: 0.36;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .platform-card {
      min-width: 0;
      border: 0.5px solid #f2f2f2;
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
    }

    .platform-card-head {
      min-height: 86px;
      padding: 19px 20px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .platform-head-copy {
      min-width: 0;
    }

    .platform-name {
      overflow: hidden;
      color: #181818;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .platform-name-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .platform-state-badge {
      height: 25px;
      padding: 0 11px 0 9px;
      border: 1px solid #e6e6e6;
      border-radius: 999px;
      background: transparent;
      color: #181818;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 520;
      line-height: 25px;
      white-space: nowrap;
    }

    .platform-state-badge::before {
      content: "";
      width: 6.5px;
      height: 6.5px;
      border-radius: 999px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .platform-state-badge.is-active::before {
      background: #49a963;
      animation: livePulse 2s ease-in-out infinite;
    }

    .platform-state-badge.is-scheduled::before {
      background: #4f94d1;
    }

    .platform-state-badge.is-closed::before {
      background: #858585;
    }

        rows: [
          ['자막O & 음악O', '2 개'],
          ['자막X & 음악O', '1 개']

      },
      {

        rows: [
          ['심의필증', '1 개'],
          ['작품소개서', '1 개'],
          ['포스터', '1 개'],
          ['홍보자료', '2 개']
        ]
      }
    ];
    const negotiatingPlatforms = [
      { name: 'ShortReel', status: 'negotiating' },
      { name: 'WeTV', status: 'negotiating' },
      { name: 'Mango TV Global', status: 'hold' }
    ];
    const rsMonthlyTemplate = [
      ['2024-10', 210], ['2024-11', 290], ['2024-12', 340],
      ['2025-01', 380], ['2025-02', 310], ['2025-03', 280],
      ['2025-04', 360], ['2025-05', 370], ['2025-06', 390],
      ['2025-07', 420], ['2025-08', 450], ['2025-09', 430],
      ['2025-10', 470], ['2025-11', 500], ['2025-12', 520],
      ['2026-01', 540], ['2026-02', 560], ['2026-03', 590],
      ['2026-04', 610], ['2026-05', 630], ['2026-06', 650]
    ];

    function makeSettlementRecord(period, seed, options = {}) {
      const platformPay = options.platformPay ?? 5600 + seed * 620;
      const whtRate = options.whtRate ?? (seed % 2 ? 16.5 : 10);
      const wht = Math.round(platformPay * (whtRate / 100) * 100) / 100;
      const wireFee = 35;
      const fxRate = options.fxRate ?? (1380 + seed * 11);
      const fxFee = options.fxFee ?? (6000 + seed * 1000);
      const krwIn = Math.round((platformPay - wht - wireFee) * fxRate - fxFee);
      const bableRate = 20;
      const bableFee = Math.round(krwIn * (bableRate / 100));
      return {
        period,
        platformPay,
        contractAmount: options.contractAmount ?? null,
        whtRate,
        wht,
        wireFee,
        fxRate,
        fxFee,
        krwIn,
        bableRate,
        bableFee,
        producerPay: krwIn - bableFee,
        settleMonth: options.settleMonth || '2025-05',
        status: options.status || 'paid'
      };
    }

    function makeDramaBoxRsRows() {
      const periods = [
        '2023-Q3', '2023-Q4',
        '2024-Q1', '2024-Q2', '2024-Q3', '2024-Q4',
        '2025-Q1', '2025-Q2', '2025-Q3', '2025-Q4',
        '2026-Q1', '2026-Q2'
      ];
      return periods.map((period, rowIndex) => makeSettlementRecord(period, rowIndex + 20, {
        platformPay: 760 + rowIndex * 95,
        settleMonth: `${Number(period.slice(0, 4))}-${String(((Number(period.slice(-1)) - 1) * 3 + 2)).padStart(2, '0')}`,
        status: rowIndex === periods.length - 1 ? 'upcoming' : 'paid'
      }));
    }

    const settlementPlatforms = row.platformDetails.map((platform, index) => {
      const type = settlementTypes[index % settlementTypes.length];
      const base = {
        ...platform,
        id: `settlement-${index}`,
        type,
        exclusive: platform.contractType === '독점',
        region: platform.rightsRegion,
        releaseDate: String(platform.periodStart).replace(/\./g, '-'),
        expiryDate: String(platform.periodEnd).replace(/\./g, '-'),
        rsRate: type === 'flat' ? null : 22 + index * 2
      };

      if (type === 'flat') {
        return {
          ...base,
          rows: [
            makeSettlementRecord('2025-04', index + 1, { contractAmount: 9200 + index * 500, platformPay: 9200 + index * 500 })
          ]
        };
      }

      if (type === 'mgrs') {
        return {
          ...base,
          rsMonthly: rsMonthlyTemplate.map(([month, amount]) => ({ month, amount: amount + index * 35 })),
          mgRows: [
            makeSettlementRecord('2025-04', index + 2, { contractAmount: 7600 + index * 600, platformPay: 7600 + index * 600 })
          ],
          rsRows: platform.name === 'DramaBox'
            ? makeDramaBoxRsRows()
            : [
              makeSettlementRecord('2024-Q4', index + 3, { platformPay: 840 + index * 80, settleMonth: '2025-02' }),
              makeSettlementRecord('2025-Q1', index + 4, { platformPay: 970 + index * 90, settleMonth: '2025-05' }),
              makeSettlementRecord('2025-Q2', index + 5, { platformPay: 1120 + index * 100, settleMonth: '2025-08', status: 'upcoming' })
            ]
        };
      }

      return {
        ...base,
        rsMonthly: rsMonthlyTemplate.map(([month, amount]) => ({ month, amount: amount + index * 28 })),
        rsRows: [
          makeSettlementRecord('2024-Q4', index + 6, { platformPay: 320 + index * 70, settleMonth: '2025-02' }),
          makeSettlementRecord('2025-Q1', index + 7, { platformPay: 480 + index * 75, settleMonth: '2025-05' }),
          makeSettlementRecord('2025-Q2', index + 8, { platformPay: 540 + index * 85, settleMonth: '2025-08', status: 'upcoming' })
        ]
      };
    });

    function formatSettlementMoney(value) {
      if (value == null) return '—';
      return `₩${Number(value || 0).toLocaleString('ko-KR')}`;
    }

    function settlementContractAmount(platform) {
      if (platform.type === 'flat') return platform.rows?.[0]?.contractAmount ?? null;
      if (platform.type === 'mgrs') return platform.mgRows?.[0]?.contractAmount ?? null;
      return null;
    }

    function settlementTotals() {
      return settlementPlatforms.reduce((totals, platform) => {
        const records = settlementRecordsFor(platform);
        records.forEach(record => {
          totals.platformPay += record.platformPay || 0;
          totals.krwIn += record.krwIn || 0;
          totals.bableFee += record.bableFee || 0;
          totals.producerPay += record.producerPay || 0;
        });
        return totals;
      }, { platformPay: 0, krwIn: 0, bableFee: 0, producerPay: 0 });
    }

    function settlementTypeTotals() {
      return settlementPlatforms.reduce((totals, platform) => {
        if (platform.type === 'flat') {
          (platform.rows || []).forEach(record => {
            totals.fixed += record.platformPay || 0;
          });
        } else if (platform.type === 'mgrs') {
          (platform.mgRows || []).forEach(record => {
            totals.fixed += record.platformPay || 0;
          });
          (platform.rsRows || []).forEach(record => {
            totals.rs += record.platformPay || 0;
          });
        } else {
          (platform.rsRows || []).forEach(record => {
            totals.rs += record.platformPay || 0;
          });
        }
        return totals;
      }, { fixed: 0, rs: 0 });
    }

    function renderHeroMetric(label, value) {
      return `
        <div class="hero-metric-item">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
        </div>
      `;

          <button class="detail-view-button ${detailViewMode === 'settlement' ? 'is-active' : ''}" type="button" data-detail-view="settlement">정산</button>
          <button class="detail-view-button ${detailViewMode === 'performance' ? 'is-active' : ''}" type="button" data-detail-view="performance">퍼포먼스</button>

      return `

          <div class="hero-eyebrow">플랫폼 합산 누적</div>
          <div class="hero-metric-grid" aria-label="배급 성과 요약">
            ${renderHeroMetric('계약 플랫폼', `${formatNumber(row.platforms.length)}개`)}
            ${renderHeroMetric('조회수', formatNumber(totalViews))}
            ${renderHeroMetric('팔로우수', formatNumber(totalFollows))}
            ${renderHeroMetric('좋아요수', formatNumber(totalLikes))}
          </div>
        </div>
      `;

    function renderPlatformContract(label, value) {

    function renderPlatformMetric(label, value) {

    const platformStateMeta = {
      scheduled: { label: '방영 예정', className: 'is-scheduled' },
      active: { label: '유통중', className: 'is-active' },

    function renderPlatformStateBadge(stage) {

      return `<span class="platform-state-badge ${meta.className}">${escapeHtml(meta.label)}</span>`;

    function performanceUpdateDateFor(platform, index) {

    function isPlatformCardCollapsed(mode, index) {

    function renderPlatformCards() {
      return row.platformDetails.map((platform, index) => {
        const settlementPlatform = settlementPlatforms[index] || platform;
        const contractAmount = settlementContractAmount(settlementPlatform);
        const collapsed = isPlatformCardCollapsed('performance', index);
        return `
        <article class="platform-card">
          <div class="platform-card-head" data-platform-card-toggle="performance" data-platform-index="${index}" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}">

              </div>
              <div class="platform-contract-grid">
                ${renderPlatformContract('계약구분', settlementPlatform.exclusive ? '독점' : '비독점')}
                ${renderPlatformContract('유통권역', settlementPlatform.region)}
                ${renderPlatformContract('기간', `${settlementPlatform.releaseDate} - ${settlementPlatform.expiryDate}`)}
                ${renderPlatformContract('계약형태', contractLabel[settlementPlatform.type])}
                ${settlementPlatform.rsRate ? renderPlatformContract('RS 비율', `${settlementPlatform.rsRate}%`) : ''}
                ${contractAmount == null ? '' : renderPlatformContract('계약금액', formatUsd(contractAmount))}
              </div>
            </div>
            ${renderPlatformCollapseButton('performance', index)}
          </div>
          ${collapsed ? '' : `<div class="platform-metric-grid">
            ${renderPlatformMetric('조회수', formatNumber(platform.views))}
            ${renderPlatformMetric('팔로우수', formatNumber(platform.follows))}
            ${renderPlatformMetric('좋아요', formatNumber(platform.likes))}
            ${renderPlatformMetric('업데이트 날짜', performanceUpdateDateFor(settlementPlatform, index))}
          </div>`}
        </article>
      `;
      }).join('');
    }

    const contractLabel = {
      flat: 'Flat Fee',
      rs: 'RS',
      mgrs: 'MG + RS'
    };

    const settlementColumns = [
      { key: 'period', label: '발생월', group: 'platform' },
      { key: 'platformPay', label: '플랫폼 지급액', group: 'platform', type: 'usd' },
      { key: 'contractAmount', label: '계약 금액', group: 'platform', type: 'usd' },
      { key: 'whtRate', label: '원천세 비율', group: 'deduct', type: 'pct' },
      { key: 'wht', label: '원천세 금액', group: 'deduct', type: 'usd' },
      { key: 'wireFee', label: '송금 수수료', group: 'deduct', type: 'usd' },
      { key: 'fxRate', label: '환율', group: 'deduct', type: 'fx' },
      { key: 'fxFee', label: '환전 수수료', group: 'deduct', type: 'krw' },
      { key: 'krwIn', label: '실제 입금액', group: 'deduct', type: 'krw' },
      { key: 'bableRate', label: 'Bable 수수료율', group: 'settle', type: 'pct' },
      { key: 'bableFee', label: 'Bable 수수료 금액', group: 'settle', type: 'krw' },
      { key: 'producerPay', label: '제작사 정산액', group: 'settle', type: 'krw', emphasis: true },
      { key: 'settleMonth', label: '정산 월', group: 'settle' },
      { key: 'status', label: '정산 상태', group: 'settle' }
    ];

    function settlementRecordsFor(platform) {
      if (platform.type === 'flat') return platform.rows || [];
      if (platform.type === 'mgrs') return [...(platform.mgRows || []), ...(platform.rsRows || [])];
      return platform.rsRows || [];
    }

    function formatUsd(value) {
      if (value == null || value === '') return '—';
      return `$${Number(value).toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
    }

    function formatPct(value) {
      return value == null || value === '' ? '—' : `${value}%`;
    }

    function formatFx(value) {
      return value == null || value === '' ? '—' : `₩${Number(value).toLocaleString('ko-KR')}`;
    }

    function formatSettlementCell(column, value) {
      if (value == null || value === '') return '—';
      if (column.type === 'usd') return formatUsd(value);
      if (column.type === 'krw') return formatSettlementMoney(value);
      if (column.type === 'pct') return formatPct(value);
      if (column.type === 'fx') return formatFx(value);
      return escapeHtml(value);
    }

    function renderSettlementStatus(status) {
      const statusMap = {
        review: { label: '검토', className: 'is-review' },
        pending: { label: '대기', className: 'is-pending' },
        paid: { label: '완료', className: '' },
        upcoming: { label: '검토', className: 'is-review' }
      };
      const config = statusMap[status] || statusMap.paid;
      return `<span class="settlement-status ${config.className}">${config.label}</span>`;
    }

    function settlementStatusForRow(index) {
      if (index === 0) return 'review';
      if (index === 1) return 'pending';
      return 'paid';
    }

    function periodSortValue(period) {
      const quarter = String(period).match(/^(\d{4})-Q([1-4])$/);
      if (quarter) return Number(quarter[1]) * 12 + Number(quarter[2]) * 3;
      const month = String(period).match(/^(\d{4})-(\d{2})$/);
      if (month) return Number(month[1]) * 12 + Number(month[2]);
      return 0;
    }

    function renderSettlementPagination(pageKey, currentPage, totalPages) {
      if (!pageKey || totalPages <= 1) return '';
      return `
        <div class="settlement-pagination" aria-label="정산 거래 페이지">
          ${Array.from({ length: totalPages }, (_, index) => {
            const page = index + 1;
            return `<button class="settlement-page-button ${page === currentPage ? 'is-active' : ''}" type="button" data-settlement-page-key="${escapeHtml(pageKey)}" data-settlement-page="${page}">${page}</button>`;
          }).join('')}
        </div>
      `;
    }

    function renderSettlementTable(records, periodLabel = '발생월', pageKey = '', options = {}) {
      const columns = options.omitContractAmount
        ? settlementColumns.filter(column => column.key !== 'contractAmount')
        : settlementColumns;
      const platformColumnCount = columns.filter(column => column.group === 'platform').length;
      const deductColumnCount = columns.filter(column => column.group === 'deduct').length;
      const settleColumnCount = columns.filter(column => column.group === 'settle').length;
      const rows = [...records].sort((a, b) => periodSortValue(b.period) - periodSortValue(a.period));
      const totalPages = Math.ceil(rows.length / settlementPageSize);
      const currentPage = pageKey
        ? Math.min(Math.max(Number(settlementPageState[pageKey] || 1), 1), Math.max(totalPages, 1))
        : 1;
      const visibleRows = pageKey && totalPages > 1
        ? rows.slice((currentPage - 1) * settlementPageSize, currentPage * settlementPageSize)
        : rows;
      return `
        <div class="settlement-table-wrap">
          <table class="settlement-record-table">
            <thead>
              <tr class="group-row">
                <th colspan="${platformColumnCount}"><span class="table-group-label platform">플랫폼 지급</span></th>
                <th colspan="${deductColumnCount}"><span class="table-group-label deduct">공제내역</span></th>
                <th colspan="${settleColumnCount}"><span class="table-group-label settle">정산</span></th>
              </tr>
              <tr>
                ${columns.map(column => `<th>${escapeHtml(column.key === 'period' ? periodLabel : column.label)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${visibleRows.map((record, visibleIndex) => {
                const rowIndex = pageKey && totalPages > 1
                  ? (currentPage - 1) * settlementPageSize + visibleIndex
                  : visibleIndex;
                return `
                <tr>
                  ${columns.map(column => `
                    <td class="${column.emphasis ? 'producer-pay' : ''}">
                      ${column.key === 'status' ? renderSettlementStatus(settlementStatusForRow(rowIndex)) : formatSettlementCell(column, record[column.key])}
                    </td>
                  `).join('')}
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        </div>
        ${renderSettlementPagination(pageKey, currentPage, totalPages)}
      `;
    }

    function renderRecordTypeTabs(platformIndex, recordType) {
      return `
        <div class="settlement-record-tabs" role="tablist" aria-label="정산 상세 유형">
          <button class="settlement-record-tab ${recordType === 'mg' ? 'is-active' : ''}" type="button" data-settlement-record-type="mg" data-platform-index="${platformIndex}"><span>MG 상세</span></button>
          <button class="settlement-record-tab ${recordType === 'rs' ? 'is-active' : ''}" type="button" data-settlement-record-type="rs" data-platform-index="${platformIndex}"><span>RS 상세</span></button>
        </div>
      `;
    }

    function renderPaneHeader(platform, pane, recordType = 'mg') {
      const hasRsTrend = platform.type === 'rs' || platform.type === 'mgrs';
      const showRecordTabs = platform.type === 'mgrs' && pane === 'records';
      return `
        <div class="settlement-pane-head">
          ${showRecordTabs
            ? renderRecordTypeTabs(platform.index, recordType)
            : '<div class="settlement-pane-title"></div>'}
          ${hasRsTrend ? `
            <div class="settlement-pane-actions ${pane === 'rs' ? 'is-rs' : 'is-records'}">
              <button class="settlement-pane-button ${pane === 'records' ? 'is-active' : ''}" type="button" data-settlement-pane="records" data-platform-index="${platform.index}">거래 기록</button>
              <button class="settlement-pane-button ${pane === 'rs' ? 'is-active' : ''}" type="button" data-settlement-pane="rs" data-platform-index="${platform.index}">RS 추이</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderRSTrendPanel(platform) {
      const rows = platform.rsMonthly || [];
      const years = Array.from(new Set(rows.map(item => item.month.slice(0, 4)))).sort().reverse();
      const months = Array.from({ length: 12 }, (_, index) => ({
        key: String(index + 1).padStart(2, '0'),
        label: `${index + 1}월`
      }));
      const amountByMonth = new Map(rows.map(item => [item.month, item.amount]));
      const selectedYear = years.includes(rsTrendYearState[platform.index])
        ? rsTrendYearState[platform.index]
        : (years[0] || '2025');
      const yearlyTotal = year => months.reduce((sum, month) => {
        const amount = amountByMonth.get(`${year}-${month.key}`);
        return amount == null ? sum : sum + amount;
      }, 0);
      const grandTotal = years.reduce((sum, year) => sum + yearlyTotal(year), 0);
      const formatRsAmount = value => value ? `$${Math.round(value).toLocaleString('en-US')}` : '-';

      return `
        <div class="rs-trend-panel">
          <div class="rs-chart-box">
            ${years.length ? `
              <span class="rs-year-select-wrap">
                <select class="rs-year-select" data-rs-trend-year="${platform.index}" aria-label="RS 추이 연도 선택">
                  ${years.map(year => `<option value="${escapeHtml(year)}" ${year === selectedYear ? 'selected' : ''}>${escapeHtml(year)}</option>`).join('')}
                </select>
                <svg width="9" height="6" viewBox="0 0 9 6" aria-hidden="true">
                  <path d="M1 1.25L4.5 4.75L8 1.25" stroke="#8f9297" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
            ` : ''}
            <div class="rs-chart-target" data-rs-chart-platform="${platform.index}" data-rs-chart-year="${escapeHtml(selectedYear)}">
              <div class="rs-chart-loading">그래프를 불러오는 중입니다.</div>
            </div>
          </div>
          <div class="rs-trend-box">
            <table class="rs-trend-table">
              <thead>
                <tr>
                  <th>연도</th>
                  ${months.map(month => `<th>${escapeHtml(month.label)}</th>`).join('')}
                  <th>총액</th>
                </tr>
              </thead>
              <tbody>
                ${years.map(year => `
                  <tr class="${year === selectedYear ? 'is-selected' : ''}" data-rs-trend-year-row="${platform.index}" data-rs-trend-year-value="${escapeHtml(year)}">
                    <th>${escapeHtml(year)}</th>
                    ${months.map(month => `<td>${formatRsAmount(amountByMonth.get(`${year}-${month.key}`))}</td>`).join('')}
                    <td><strong>${formatRsAmount(yearlyTotal(year))}</strong></td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr>
                  <th>총액</th>
                  ${months.map(() => '<td></td>').join('')}
                  <td><strong>${formatRsAmount(grandTotal)}</strong></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      `;
    }

    function renderSettlementCards() {
      return settlementPlatforms.map((platform, index) => {
        const pane = settlementPaneState[index] || 'records';
        const recordType = settlementRecordTypeState[index] || 'mg';
        const platformWithIndex = { ...platform, index };
        const hasRsTrend = platform.type === 'rs' || platform.type === 'mgrs';
        const contractAmount = settlementContractAmount(platform);
        const recordsPageKey = `platform-${index}-${platform.type === 'mgrs' ? recordType : platform.type}`;
        const omitContractAmount = platform.type === 'rs' || (platform.type === 'mgrs' && recordType === 'rs');
        const recordsBody = platform.type === 'mgrs'
          ? renderSettlementTable(recordType === 'rs' ? (platform.rsRows || []) : (platform.mgRows || []), recordType === 'rs' ? '분기' : '발생월', recordsPageKey, { omitContractAmount })
          : renderSettlementTable(platform.type === 'flat' ? (platform.rows || []) : (platform.rsRows || []), platform.type === 'rs' ? '분기' : '발생월', recordsPageKey, { omitContractAmount });

        const collapsed = isPlatformCardCollapsed('settlement', index);
        const showPaneHeader = platform.type === 'mgrs' || platform.type === 'rs';
        return `
        <article class="platform-card">
          <div class="platform-card-head" data-platform-card-toggle="settlement" data-platform-index="${index}" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}">
            <div class="platform-head-copy">
              <div class="platform-name-row">
                <div class="platform-name">${escapeHtml(platform.name)}</div>
                ${renderPlatformStateBadge(platform.stage)}
              </div>
              <div class="platform-contract-grid">
                ${renderPlatformContract('계약구분', platform.exclusive ? '독점' : '비독점')}
                ${renderPlatformContract('유통권역', platform.region)}
                ${renderPlatformContract('기간', `${platform.releaseDate} - ${platform.expiryDate}`)}
                ${renderPlatformContract('계약형태', contractLabel[platform.type])}
                ${platform.rsRate ? renderPlatformContract('RS 비율', `${platform.rsRate}%`) : ''}
                ${contractAmount == null ? '' : renderPlatformContract('계약금액', formatUsd(contractAmount))}
              </div>
            </div>
            ${renderPlatformCollapseButton('settlement', index)}
          </div>
          ${collapsed ? '' : `
            ${showPaneHeader ? renderPaneHeader(platformWithIndex, pane, recordType) : ''}
            ${hasRsTrend && pane === 'rs' ? renderRSTrendPanel(platformWithIndex) : recordsBody}
          `}
        </article>
      `;
      }).join('');
    }

    function renderWorkflowTimeline() {
      return `
        <div class="workflow-section">
          <h3 class="workflow-section-title">타임라인</h3>
          <article class="workflow-card">
            <ol class="workflow-timeline">
              ${workflowDetail.timeline.map(step => `
                <li class="workflow-timeline-item ${step.active ? 'is-active' : ''}">
                  <span class="workflow-timeline-dot" aria-hidden="true"></span>
                  <strong class="workflow-timeline-title">${escapeHtml(step.title)}</strong>
                  <span class="workflow-timeline-date">${escapeHtml(step.date)}</span>
                </li>
              `).join('')}
            </ol>
          </article>
        </div>
      `;
    }

    function renderWorkflowMaterials() {
      return `
        <article class="workflow-card">
          <div class="workflow-card-head">
            <h3 class="workflow-card-title">자료 및 연결</h3>
            <span class="workflow-card-meta">콘텐츠 단위 관리</span>
          </div>
          <div class="workflow-material-grid">
            <div class="workflow-material-item">
              <span>구글 드라이브</span>
              <a href="${escapeHtml(workflowDetail.driveUrl)}" target="_blank" rel="noopener noreferrer">바로가기 <span aria-hidden="true">↗</span></a>
            </div>
            <div class="workflow-material-item">
              <span>콘텐츠 상세</span>
              <a href="${escapeHtml(workflowDetail.detailUrl)}">상세보기 <span aria-hidden="true">→</span></a>
            </div>
          </div>
        </article>
      `;
    }

    function renderWorkflowContent() {
      return `
        ${renderWorkflowTimeline()}
      `;
    }

    const contractPeriodMeta = {
      scheduled: { label: '방영예정', className: 'is-scheduled' },
      active: { label: '유통중', className: 'is-active' },
      closed: { label: '계약종료', className: 'is-closed' }
    };
    const negotiationStatusMeta = {
      negotiating: { label: '협의중', className: 'is-negotiating' },
      hold: { label: '보류', className: 'is-hold' }
    };

    function workflowContractPeriodStatus(platform) {
      if (contractPeriodMeta[platform.stage]) return contractPeriodMeta[platform.stage];
      const startDate = new Date(`${platform.releaseDate || platform.periodStart}T00:00:00`);
      const endDate = new Date(`${platform.expiryDate || platform.periodEnd}T23:59:59`);
      const today = new Date();
      if (!Number.isNaN(startDate.getTime()) && today < startDate) return contractPeriodMeta.scheduled;
      if (!Number.isNaN(endDate.getTime()) && today > endDate) return contractPeriodMeta.closed;
      return contractPeriodMeta.active;
    }

    function renderWorkflowPlatformOverview() {
      return `
        <div class="workflow-platform-overview" aria-label="플랫폼 계약 및 협의 현황">
          <article class="workflow-platform-box">
            <div class="workflow-platform-box-head">
              <h3 class="workflow-platform-box-title">계약 플랫폼</h3>
            </div>
            <ul class="workflow-contract-list">
              ${settlementPlatforms.map(platform => {
                const periodStatus = workflowContractPeriodStatus(platform);
                return `
                  <li class="workflow-contract-item">
                    <strong class="workflow-contract-name">${escapeHtml(platform.name)}</strong>
                    <span class="workflow-contract-status ${periodStatus.className}">${escapeHtml(periodStatus.label)}</span>
                  </li>
                `;
              }).join('')}
            </ul>
          </article>
          <article class="workflow-platform-box">
            <div class="workflow-platform-box-head">
              <h3 class="workflow-platform-box-title">협의중 플랫폼</h3>
            </div>
            <ul class="workflow-negotiation-list">
              ${negotiatingPlatforms.map(platform => {
                const status = negotiationStatusMeta[platform.status] || negotiationStatusMeta.negotiating;
                return `
                  <li class="workflow-negotiation-item">
                    <strong class="workflow-negotiation-name">${escapeHtml(platform.name)}</strong>
                    <span class="workflow-negotiation-status ${status.className}">${escapeHtml(status.label)}</span>
                  </li>
                `;
              }).join('')}
            </ul>
          </article>
        </div>
      `;
    }

    function renderDriveMaterialCell(entry) {
      if (!entry) return '<td></td><td></td>';
      const [label, count] = entry;
      const isEmpty = count === '0개' || count === '0 개' || count.startsWith('0/');
      const countHtml = count.includes('/')
        ? count.replace(/^([^/]+)(\/\d+)$/, '<span class="count-current">$1</span><span class="count-total">$2</span>')
        : count.replace(/^(\d+)(\s*개)$/, '<span class="count-number">$1</span><span class="count-unit">$2</span>');
      return `
        <td class="${isEmpty ? 'is-empty' : ''}">${escapeHtml(label)}</td>
        <td class="count ${isEmpty ? 'is-empty' : ''}">${countHtml}</td>
      `;
    }

    function renderDriveGroupRows(rows) {
      const pairedRows = [];
      for (let index = 0; index < rows.length; index += 2) {
        pairedRows.push([rows[index], rows[index + 1]]);
      }

      return pairedRows.map(([left, right]) => `
        <tr>
          ${renderDriveMaterialCell(left)}
          ${renderDriveMaterialCell(right)}
        </tr>
      `).join('');
    }

    function renderDriveLoadingContent() {
      return `
        <div class="drive-loading-state" aria-live="polite">
          <div class="drive-loading-stars">
            <canvas data-drive-loading-stars aria-hidden="true"></canvas>
            <p class="drive-loading-copy">데이터 가져오는중 <span>.</span> <span>.</span> <span>.</span></p>
          </div>
        </div>
      `;
    }

    function initDriveLoadingAnimation() {
      const canvas = document.querySelector('[data-drive-loading-stars]');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const colors = ['#e8a4b8', '#c89fd4', '#f4c97a', '#a8c8e8', '#e8c4a4'];
      const star = [[0,-5],[0,-4],[0,-3],[0,-2],[0,2],[0,3],[0,4],[0,5],[-5,0],[-4,0],[-3,0],[-2,0],[2,0],[3,0],[4,0],[5,0],[-1,-1],[1,-1],[-1,1],[1,1]];
      let width = 0;
      let height = 0;
      let tick = 0;
      let animationFrame = null;
      let stopped = false;

      function rgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function createPart(index, total) {
        return {
          x: Math.random(),
          y: Math.random(),
          size: 0.6 + Math.random() * 0.8,
          phase: Math.random() * Math.PI * 2,
          speed: 0.4 + Math.random() * 0.7,
          color: Math.floor(Math.random() * colors.length),
          orbitRadius: 0.1 + Math.random() * 0.35,
          orbitAngle: (index / total) * Math.PI * 2,
          orbitSpeed: (0.0002 + Math.random() * 0.0004) * (Math.random() < 0.5 ? 1 : -1)
        };
      }

      const partCount = 30;
      const parts = Array.from({ length: partCount }, (_, index) => createPart(index, partCount));

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        width = Math.max(1, Math.round(rect.width * dpr));
        height = Math.max(1, Math.round(rect.height * dpr));
        canvas.width = width;
        canvas.height = height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawPart(part, time) {
        const rect = canvas.getBoundingClientRect();
        part.orbitAngle += part.orbitSpeed * 0.6 * 8;
        part.x = 0.5 + Math.cos(part.orbitAngle) * part.orbitRadius * 1.2;
        part.y = 0.5 + Math.sin(part.orbitAngle) * part.orbitRadius * 0.8;

        const cx = part.x * rect.width;
        const cy = part.y * rect.height;
        const px = Math.max(1, Math.round(part.size * 2 * (rect.width / 360)));
        const pulse = 0.5 + 0.5 * Math.abs(Math.sin(time * 0.0018 * part.speed + part.phase));
        const alpha = 0.25 + 0.62 * pulse;
        const color = colors[part.color % colors.length];

        for (const point of star) {
          ctx.fillStyle = rgba(color, alpha);
          ctx.fillRect(Math.round(cx + point[0] * px), Math.round(cy + point[1] * px), px, px);
        }

        ctx.fillStyle = rgba(color, Math.min(1, alpha * 1.3));
        ctx.fillRect(Math.round(cx), Math.round(cy), px, px);
      }

      function loop() {
        if (stopped) return;
        tick += 1;
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        parts.forEach(part => drawPart(part, tick * 16));
        animationFrame = requestAnimationFrame(loop);
      }

      resize();
      loop();

      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(canvas);

      driveLoadingAnimationCleanup = () => {
        stopped = true;
        resizeObserver.disconnect();
        if (animationFrame) cancelAnimationFrame(animationFrame);
        driveLoadingAnimationCleanup = null;
      };
    }

    function renderDriveContent() {
      return `
        ${renderWorkflowPlatformOverview()}
        <div class="workflow-section">
          <h3 class="workflow-section-title">구글 드라이브 현황</h3>
          <div class="workflow-material-panel">
            ${driveMaterialStatus === 'loaded' ? `
              ${driveMaterialGroups.map(group => `
                <section class="workflow-material-group">
                  <h4><span></span>${escapeHtml(group.title)}</h4>
                  <table class="workflow-material-table">
                    <tbody>
                      ${renderDriveGroupRows(group.rows)}
                    </tbody>
                  </table>
                </section>
              `).join('')}
              <div class="workflow-material-submit">
                <p>자료 업로드를 모두 마쳤다면 완료 상태로 알려주세요.</p>
                <button type="button" data-material-upload-complete="distribution-detail">
                  업로드 완료
                </button>
              </div>
            ` : renderDriveLoadingContent()}
          </div>
        </div>
      `;
    }

    function renderDetailContent() {
      const isSettlement = detailViewMode === 'settlement';
      const isWorkflow = detailViewMode === 'workflow';
      const panelTitle = isWorkflow
        ? '워크플로우'
        : '플랫폼별 상세';
      const performanceTooltip = '모든 수치는 출시 이후 누적값이며 시점별 추이는 제공되지 않습니다. 입력되지 않은 항목은 -로 나타냅니다.';
      const panelBody = isWorkflow
        ? `
          <div class="workflow-detail-split">
            <div>${renderWorkflowContent()}</div>
            <div>${renderDriveContent()}</div>
          </div>
        `
        : `<div class="platform-card-grid">${isSettlement ? renderSettlementCards() : renderPlatformCards()}</div>`;
      return `
        <a class="detail-back" href="distribution-version.html" aria-label="뒤로가기"><span class="detail-back-mark">‹</span> 뒤로가기</a>

        <section class="detail-hero">
          <img class="detail-poster-original" src="${escapeHtml(row.poster)}" alt="">
          <div class="detail-copy">
            <div class="detail-title-row">
              <div class="detail-title-main">
                <h1 class="detail-title">${escapeHtml(row.title)}</h1>
                ${renderExternalActions()}
              </div>
              ${renderViewActions()}
            </div>
            ${renderHeroSummary()}
          </div>
        </section>

        <section class="platform-panel">
            ${isWorkflow ? '' : `
              <div class="panel-head">
                <div class="panel-title-row">
                  <h2 class="panel-title">${panelTitle}</h2>
                  ${isSettlement ? '' : `<span class="panel-info" tabindex="0" role="tooltip" data-tooltip="${escapeHtml(performanceTooltip)}" aria-label="${escapeHtml(performanceTooltip)}">i</span>`}
                </div>
              </div>
            `}
            ${panelBody}
        </section>
      `;
    }

    function rsTrendChartRows(platform, selectedYear) {
      const amountByMonth = new Map((platform.rsMonthly || []).map(item => [item.month, item.amount]));
      return Array.from({ length: 12 }, (_, index) => {
        const month = String(index + 1).padStart(2, '0');
        const key = `${selectedYear}-${month}`;
        return {
          key,
          label: `${index + 1}월`,
          amount: amountByMonth.has(key) ? amountByMonth.get(key) : null,
        };
      });
    }

    function destroyRsTrendCharts() {
      rsTrendCharts.forEach(chart => chart.destroy());
      rsTrendCharts = [];
    }

    function renderRsTrendCharts() {
      destroyRsTrendCharts();
      document.querySelectorAll('[data-rs-chart-platform]').forEach(target => {
        const platformIndex = Number(target.dataset.rsChartPlatform);
        const selectedYear = target.dataset.rsChartYear;
        const platform = settlementPlatforms[platformIndex];
        if (!platform || !selectedYear || !window.ApexCharts) return;

        target.innerHTML = '';
        const yearRows = rsTrendChartRows(platform, selectedYear);
        const chart = new ApexCharts(target, {
          series: [{
            name: 'RS 수익',
            data: yearRows.map(item => item.amount),
          }],
          chart: {
            type: 'area',
            height: 246,
            toolbar: { show: false },
            zoom: { enabled: false },
            animations: { enabled: true, speed: 500 },
            fontFamily: '"Pretendard Variable", "Pretendard", "Geist", system-ui, sans-serif',
            background: '#fff',
            offsetY: 12,
          },
          colors: ['#4fa987'],
          stroke: { curve: 'straight', width: 2.5 },
          fill: {
            type: 'gradient',
            gradient: {
              shadeIntensity: 1,
              opacityFrom: 0.2,
              opacityTo: 0.02,
              stops: [0, 100],
            },
          },
          markers: {
            size: 4,
            strokeWidth: 2,
            strokeColors: ['#4fa987'],
            fillColor: '#fff',
            hover: { size: 6 },
          },
          xaxis: {
            categories: yearRows.map(item => item.label),
            labels: { style: { fontSize: '10px', colors: '#9fa1a5' }, rotate: 0 },
            axisBorder: { show: false },
            axisTicks: { show: false },
            tooltip: { enabled: false },
          },
          yaxis: {
            labels: {
              style: { fontSize: '10px', colors: '#b2b4b8' },
              formatter: value => value == null ? '' : `$${Math.round(value).toLocaleString('en-US')}`,
            },
          },
          grid: {
            borderColor: '#f0efe9',
            padding: { left: 4, right: 12, top: 0, bottom: -4 },
          },
          tooltip: {
            theme: 'dark',
            x: {
              formatter: (_value, opts) => yearRows[opts.dataPointIndex]?.key || '',
            },
            y: {
              formatter: value => value == null ? '데이터 없음' : `$${Math.round(value).toLocaleString('en-US')}`,
              title: { formatter: () => 'RS 수익' },
            },
          },
          dataLabels: { enabled: false },
          legend: { show: false },
        });
        chart.render();
        rsTrendCharts.push(chart);
      });
    }

    function scheduleDriveMaterialLoad() {
      if (driveMaterialStatus !== 'loading' || driveMaterialTimer) return;
      driveMaterialTimer = setTimeout(() => {
        driveMaterialStatus = 'loaded';
        driveMaterialTimer = null;
        if (detailViewMode === 'workflow') renderPage();
      }, 1400);
    }

    function renderPage() {
      if (driveLoadingAnimationCleanup) driveLoadingAnimationCleanup();
      destroyRsTrendCharts();
      document.getElementById('distributionDetailRoot').innerHTML = renderDetailContent();
      if (detailViewMode === 'workflow' && driveMaterialStatus === 'loading') initDriveLoadingAnimation();
      if (detailViewMode === 'workflow') scheduleDriveMaterialLoad();
      renderRsTrendCharts();
    }

    document.addEventListener('click', event => {
      const collapseButton = event.target.closest('[data-platform-card-toggle]');
      if (collapseButton) {
        const mode = collapseButton.dataset.platformCardToggle;
        const index = collapseButton.dataset.platformIndex;
        if (platformCollapseState[mode]) {
          platformCollapseState[mode][index] = !platformCollapseState[mode][index];
          renderPage();
        }
        return;
      }

      const recordTypeButton = event.target.closest('[data-settlement-record-type]');
      if (recordTypeButton) {
        const platformIndex = recordTypeButton.dataset.platformIndex;
        const nextType = recordTypeButton.dataset.settlementRecordType === 'rs' ? 'rs' : 'mg';
        if ((settlementRecordTypeState[platformIndex] || 'mg') === nextType) return;
        settlementRecordTypeState[platformIndex] = nextType;
        settlementPageState[`platform-${platformIndex}-${nextType}`] = 1;
        renderPage();
        return;
      }

      const pageButton = event.target.closest('[data-settlement-page-key]');
      if (pageButton) {
        settlementPageState[pageButton.dataset.settlementPageKey] = Number(pageButton.dataset.settlementPage || 1);
        renderPage();
        return;
      }

      const paneButton = event.target.closest('[data-settlement-pane]');
      if (paneButton) {
        const nextPane = paneButton.dataset.settlementPane === 'rs' ? 'rs' : 'records';
        const platformIndex = paneButton.dataset.platformIndex;
        const currentPane = settlementPaneState[platformIndex] || 'records';
        if (currentPane === nextPane) return;
        settlementPaneState[platformIndex] = nextPane;

        const actions = paneButton.closest('.settlement-pane-actions');
        if (actions) {
          actions.classList.toggle('is-rs', nextPane === 'rs');
          actions.classList.toggle('is-records', nextPane === 'records');
          actions.querySelectorAll('[data-settlement-pane]').forEach(button => {
            const active = button.dataset.settlementPane === nextPane;
            button.classList.toggle('is-active', active);
          });
        }

        clearTimeout(settlementPaneRenderTimer);
        settlementPaneRenderTimer = setTimeout(renderPage, 320);
        return;
      }

      const yearRow = event.target.closest('[data-rs-trend-year-row]');
      if (yearRow) {
        rsTrendYearState[yearRow.dataset.rsTrendYearRow] = yearRow.dataset.rsTrendYearValue;
        renderPage();
        return;
      }

      const button = event.target.closest('[data-detail-view]');
      if (!button) return;
      detailViewMode = ['performance', 'settlement', 'workflow'].includes(button.dataset.detailView)
        ? button.dataset.detailView
        : 'performance';
      renderPage();
    });

    document.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const target = event.target.closest('.platform-card-head[data-platform-card-toggle]');
      if (!target) return;
      event.preventDefault();
      target.click();
    });

    document.addEventListener('change', event => {
      const yearSelect = event.target.closest('[data-rs-trend-year]');
      if (!yearSelect) return;
      rsTrendYearState[yearSelect.dataset.rsTrendYear] = yearSelect.value;
      renderPage();
    });

    renderPage();
  </script>
</body>
</html>
