<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 | shortflow</title>
  <link rel="stylesheet" href="dashboard-common.css">
  <script src="dashboard-nav.js"></script>
  <style>
    :root {
      --prod-bg: #fff;
      --prod-surface: #fff;
      --prod-soft: #fafaf7;
      --prod-line: #e7e5df;
      --prod-line-strong: #d7d4cc;
      --prod-ink: #151515;
      --prod-muted: #686b73;
      --prod-faint: #a2a6ae;
      --prod-orange: #e85d2c;
    }

    body {
      background: var(--prod-bg);
    }

    @view-transition {
      navigation: auto;
    }

    .prod-main {
      padding-top: 18px;
      padding-bottom: 64px;
      view-transition-name: producer-content-main;
    }

    .prod-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .prod-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-width: 0;
    }

    .prod-tab {
      position: relative;
      height: 32px;
      padding: 0 14px;
      border: 1.5px solid #dfe3ea;
      border-radius: 999px;
      background: #fff;
      color: #3f4650;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    .prod-tab:hover {
      border-color: #cfd5df;
      background: #fafbfc;
      color: var(--prod-ink);
    }

    .prod-tab-count {
      margin-left: 5px;
      color: #8f96a3;
      font-size: 11px;
      font-weight: 750;
    }

    .prod-tab.active {
      border-color: rgba(232,93,44,0.42);
      background: #fff4ee;
      color: var(--prod-orange);
      box-shadow: 0 1px 4px rgba(232,93,44,0.08);
    }

    .prod-tab.active .prod-tab-count {
      color: inherit;
    }

    .prod-primary {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 18px 0 16px;
      border-radius: 9px;
      border: 0.5px solid rgba(232, 93, 44, 0.72);
      background: var(--prod-orange);
      color: #fff;
      font-size: 12.5px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.18);
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .prod-primary::before {
      content: "+";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
      margin-top: -1px;
    }

    .prod-primary:hover {
      border-color: rgba(232, 93, 44, 0.86);
      background: #d94f25;
      color: #fff;
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.2), 0 4px 12px rgba(232, 93, 44, 0.16);
    }

    .prod-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 36px 14px;
      overflow: visible;
    }

    .prod-card {
      position: relative;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--prod-line);
      border-radius: 13px;
      background: var(--prod-surface);
      transition: border-color 0.16s ease, transform 0.16s ease;
      z-index: 1;
    }

    .prod-card:hover {
      border-color: var(--prod-line-strong);
      transform: translateY(-1px);
    }

    .prod-card.menu-open {
      z-index: 40;
    }

    .prod-poster {
      position: relative;
      aspect-ratio: 1 / 1.3;
      overflow: hidden;
      border-radius: 9px;
      background: linear-gradient(155deg, #f2c3ae 0%, #dfe4f5 100%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }

    .prod-poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 42%);
    }

    .prod-poster img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .prod-poster.has-image::before {
      z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 46%);
      pointer-events: none;
    }

    .prod-badge {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.94);
      color: var(--prod-ink);
      font-size: 11px;
      font-weight: 750;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }

    .prod-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--prod-faint);
    }

    .prod-card-title {
      margin-top: 10px;
      color: var(--prod-ink);
      font-size: 13.5px;
      font-weight: 550;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .prod-card-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 11px;
    }

    .prod-detail {
      flex: 1;
      height: 30px;
      padding: 0 9px;
      border: 1px solid var(--prod-line);
      border-radius: 8px;
      background: #fff;
      color: var(--prod-ink);
      font-size: 11.5px;
      font-weight: 700;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .prod-detail:hover {
      border-color: var(--prod-line-strong);
      background: #fafaf7;
      color: #111;
    }

    .prod-more {
      width: 30px;
      height: 30px;
      border: 1px solid var(--prod-line);
      border-radius: 8px;
      background: #fff;
      color: #676b73;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .prod-more:hover {
      border-color: var(--prod-line-strong);
      background: #fafaf7;
      color: var(--prod-ink);
    }

    .prod-more svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.1;
    }

    .prod-menu {
      position: absolute;
      right: 10px;
      top: calc(100% - 8px);
      z-index: 80;
      width: 202px;
      padding: 8px;
      border: 1px solid var(--prod-line);
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 14px 32px rgba(17,24,39,0.13);
      display: none;
    }

    .prod-card.menu-open .prod-menu {
      display: block;
    }

    .prod-menu-item {
      width: 100%;
      min-height: 36px;
      padding: 0 11px;
      border-radius: 8px;
      color: var(--prod-ink);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
    }

    .prod-menu-item:hover {
      background: #f7f7f5;
    }

    .prod-menu-item.danger {
      color: #b23b2e;
    }

    .tone-rose { background: #f4dfe1; }
    .tone-indigo { background: #dfe3f6; }
    .tone-teal { background: #d7eeea; }
    .tone-amber { background: #f5e6c2; }
    .tone-violet { background: #e4dff3; }
    .tone-slate { background: #dfe4eb; }

    .status-review .prod-dot { background: #d38c1c; }
    .status-approved .prod-dot { background: #24824e; }
    .status-draft .prod-dot { background: #8b9098; }
    .status-approved .prod-badge { color: #176935; }
    .status-review .prod-badge { color: #9a6a0f; }
    .status-draft .prod-badge { color: #6f7680; }

    .empty {
      display: none;
      padding: 56px 20px;
      border: 1px dashed var(--prod-line-strong);
      border-radius: 16px;
      color: var(--prod-faint);
      text-align: center;
      font-size: 13px;
    }

    .prod-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 34px;
      margin-top: 52px;
    }

    .prod-page-btn {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--prod-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .prod-page-btn:hover:not(:disabled) {
      background: #f1f0ec;
      color: var(--prod-ink);
    }

    .prod-page-btn.active {
      background: rgba(26, 26, 24, 0.09);
      color: var(--prod-ink);
    }

    .prod-page-btn:disabled {
      color: var(--prod-faint);
      cursor: default;
    }

    @media (max-width: 1280px) {
      .prod-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (max-width: 1120px) {
      .prod-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .prod-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .prod-toolbar {
        align-items: stretch;
        flex-direction: column-reverse;
        gap: 12px;
      }

      .prod-primary {
        align-self: flex-end;
      }

      .prod-tabs {
        gap: 8px;
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .prod-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px 14px;
      }
    }
  </style>
</head>
<body>
  <div data-shortflow-nav="my-content"></div>
  <div id="contentManageSubNav"></div>
  <script>
    document.getElementById('contentManageSubNav').outerHTML = window.ShortflowNav.renderContentManageSubNav('contents');
  </script>

  <main class="main prod-main">
    <div class="prod-toolbar">
      <nav class="prod-tabs" aria-label="내 콘텐츠 상태">
        <button class="prod-tab active" type="button" data-filter="all">전체<span class="prod-tab-count" data-count="all">0</span></button>
        <button class="prod-tab" type="button" data-filter="draft">임시저장<span class="prod-tab-count" data-count="draft">0</span></button>
        <button class="prod-tab" type="button" data-filter="review">검토중<span class="prod-tab-count" data-count="review">0</span></button>
        <button class="prod-tab" type="button" data-filter="approved">승인됨<span class="prod-tab-count" data-count="approved">0</span></button>
      </nav>
      <a class="prod-primary" href="content-create2.html">새 콘텐츠</a>
    </div>

    <section class="prod-grid" id="contentGrid" aria-label="내 콘텐츠 목록"></section>
    <div class="empty" id="emptyState">이 상태의 콘텐츠가 없어요.</div>
    <nav class="prod-pagination" id="prodPagination" aria-label="내 콘텐츠 페이지"></nav>
  </main>

  <script>
    const myContents = [
      { title: '우주 택배 기사님', type: '숏애니', status: 'approved', statusLabel: '승인됨', tone: 'indigo', image: 'images/posters/우주택배기사님.png', note: '관리자 승인 완료. 콘텐츠 상세에서 노출 정보를 확인할 수 있어요.' },
      { title: '재벌집 막내 비서', type: '숏드라마', status: 'review', statusLabel: '검토중', tone: 'indigo', image: 'images/posters/재벌집막내비서.png', note: '관리자 검토가 진행 중이에요. 검토 완료 전까지 일부 수정이 제한됩니다.' },
      { title: '우리 반 전학생은 아이돌', type: '숏드라마', status: 'draft', statusLabel: '임시저장', tone: 'teal', image: 'images/posters/우리반전학생은아이돌.png', note: '아직 제출 전이에요. 필수 정보를 입력한 뒤 검토 요청해주세요.' },
      { title: '비밀 사내 결혼', type: '숏드라마', status: 'approved', statusLabel: '승인됨', tone: 'teal', image: 'images/posters/비밀사내결혼.png', workflowId: 'prod-secret-marriage', note: '관리자 승인 완료. 콘텐츠 상세에서 노출 정보를 확인할 수 있어요.' },
      { title: '왕자님의 퇴근길', type: '숏드라마', status: 'draft', statusLabel: '임시저장', tone: 'violet', image: 'images/posters/왕자님의퇴근길.png', note: '아직 제출 전이에요. 필수 정보를 입력한 뒤 검토 요청해주세요.' },
      { title: '남편이 AI입니다', type: 'AI', status: 'approved', statusLabel: '승인됨', tone: 'amber', image: 'images/posters/남편이AI.png', note: '관리자 승인 완료. 콘텐츠 상세에서 노출 정보를 확인할 수 있어요.' },
      { title: '오늘부터 악녀 대행합니다', type: '숏드라마', status: 'draft', statusLabel: '임시저장', tone: 'teal', image: 'images/posters/오늘부터악녀대행.png', note: '아직 제출 전이에요. 필수 정보를 입력한 뒤 검토 요청해주세요.' },
      { title: '퇴사했더니 황제가 됐다', type: '숏드라마', status: 'review', statusLabel: '검토중', tone: 'rose', image: 'images/posters/퇴사했더니황제.png', note: '관리자 검토가 진행 중이에요. 검토 완료 전까지 일부 수정이 제한됩니다.' },
      { title: '나의 위험한 파트너', type: '숏드라마', status: 'review', statusLabel: '검토중', tone: 'violet', image: 'images/posters/나의위험한파트너.png', note: '관리자 검토가 진행 중이에요. 검토 완료 전까지 일부 수정이 제한됩니다.' },
      { title: '그녀의 두 번째 엔딩', type: '숏드라마', status: 'draft', statusLabel: '임시저장', tone: 'indigo', image: 'images/posters/그녀의두번째엔딩.png', note: '회차 정보가 임시 저장되어 있어요.' },
      { title: '대표님, 계약 연애는 처음이라서요', type: '숏드라마', status: 'approved', statusLabel: '승인됨', tone: 'violet', image: 'images/posters/대표님이내전남친입니다.png', note: '관리자 승인 완료. 콘텐츠 상세에서 노출 정보를 확인할 수 있어요.' },
      { title: '달빛 아래 편의점', type: '숏드라마', status: 'review', statusLabel: '검토중', tone: 'slate', image: 'images/posters/달빛아래편의점.png', note: '관리자 검토가 진행 중이에요. 검토 완료 전까지 일부 수정이 제한됩니다.' },
      { title: '살인범과 룸메이트가 되었다', type: '숏드라마', status: 'approved', statusLabel: '승인됨', tone: 'slate', image: 'images/posters/살인범과룸메이트.png', note: '관리자 승인 완료. 콘텐츠 상세에서 노출 정보를 확인할 수 있어요.' },
      { title: '새벽 배송 로맨스', type: '숏드라마', status: 'draft', statusLabel: '임시저장', tone: 'rose', image: 'images/posters/새벽배송로맨스.png', note: '아직 제출 전이에요. 필수 정보를 입력한 뒤 검토 요청해주세요.' },
      { title: '내 매니저는 구미호', type: '숏드라마', status: 'review', statusLabel: '검토중', tone: 'amber', image: 'images/posters/내매니저는구미호.png', note: '관리자 검토가 진행 중이에요. 검토 완료 전까지 일부 수정이 제한됩니다.' },
      { title: '첫사랑 리셋 버튼', type: '숏드라마', status: 'review', statusLabel: '검토중', tone: 'slate', image: 'images/posters/첫사랑리셋버튼.png', note: '관리자 검토가 진행 중이에요. 검토 완료 전까지 일부 수정이 제한됩니다.' },
      { title: '계약 종료 3일 전', type: '숏드라마', status: 'approved', statusLabel: '승인됨', tone: 'indigo', image: 'images/posters/계약종료3일전.png', note: '관리자 승인 완료. 콘텐츠 상세에서 노출 정보를 확인할 수 있어요.' }
    ];

    const grid = document.getElementById('contentGrid');
    const empty = document.getElementById('emptyState');
    const pagination = document.getElementById('prodPagination');
    let activeFilter = 'all';
    let activePage = 1;
    const pageSize = 18;

    function filteredContents() {
      if (activeFilter === 'all') return myContents;
      return myContents.filter(item => item.status === activeFilter);
    }

    function updateTabCounts() {
      const counts = {
        all: myContents.length,
        draft: myContents.filter(item => item.status === 'draft').length,
        review: myContents.filter(item => item.status === 'review').length,
        approved: myContents.filter(item => item.status === 'approved').length,
      };
      document.querySelectorAll('[data-count]').forEach(node => {
        node.textContent = counts[node.dataset.count] || 0;
      });
    }

    function menuItemsFor(item) {
      const workflowId = item.workflowId || '';
      const workflowItem = { label: '워크플로우 보기', action: 'workflow', workflowId };
      if (item.status === 'approved') return [{ label: '수정하기' }, { label: '검토 요청 보내기' }, workflowItem];
      if (item.status === 'review') return [workflowItem];
      if (item.status === 'draft') return [{ label: '이어서 작성' }, { label: '검토 요청 보내기' }, { label: '삭제', danger: true }];
      return [workflowItem];
    }

    function escapeAttr(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderContents() {
      const rows = filteredContents();
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      activePage = Math.min(activePage, totalPages);
      const start = (activePage - 1) * pageSize;
      const pageRows = rows.slice(start, start + pageSize);

      empty.style.display = rows.length ? 'none' : 'block';
      grid.style.display = rows.length ? 'grid' : 'none';
      grid.innerHTML = pageRows.map(item => `
        <article class="prod-card status-${item.status}">
          <div class="prod-poster ${item.image ? 'has-image' : `tone-${item.tone}`}">
            ${item.image ? `<img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.title)} 포스터">` : ''}
            <span class="prod-badge">
              <span class="prod-dot"></span>${item.statusLabel}
            </span>
          </div>
          <div class="prod-card-title">${item.title}</div>
          <div class="prod-card-foot">
            <button class="prod-detail" type="button" data-title="${escapeAttr(item.title)}">상세 보기</button>
            <button class="prod-more" type="button" aria-label="${item.title} 더보기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
            </button>
          </div>
          <div class="prod-menu" role="menu">
            ${menuItemsFor(item).map(menuItem => `
              <button class="prod-menu-item ${menuItem.danger ? 'danger' : ''}" type="button" role="menuitem" data-menu-action="${escapeAttr(menuItem.action || '')}" data-workflow-id="${escapeAttr(menuItem.workflowId || '')}">
                <span>${menuItem.label}</span>
              </button>
            `).join('')}
          </div>
        </article>
      `).join('');
      renderPagination(rows.length ? totalPages : 0);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }
      const pages = Array.from({ length: totalPages }, (_, index) => index + 1).map(page => `
        <button class="prod-page-btn ${page === activePage ? 'active' : ''}" type="button" data-page="${page}" aria-label="${page}페이지" ${page === activePage ? 'aria-current="page"' : ''}>${page}</button>
      `).join('');
      pagination.innerHTML = `
        <button class="prod-page-btn" type="button" data-page="${activePage - 1}" aria-label="이전 페이지" ${activePage === 1 ? 'disabled' : ''}>‹</button>
        ${pages}
        <button class="prod-page-btn" type="button" data-page="${activePage + 1}" aria-label="다음 페이지" ${activePage === totalPages ? 'disabled' : ''}>›</button>
      `;
    }

    document.querySelectorAll('.prod-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeFilter = tab.dataset.filter;
        activePage = 1;
        document.querySelectorAll('.prod-tab').forEach(item => item.classList.toggle('active', item === tab));
        renderContents();
      });
    });

    pagination.addEventListener('click', event => {
      const button = event.target.closest('button[data-page]');
      if (!button || button.disabled) return;
      activePage = Number(button.dataset.page);
      renderContents();
      document.querySelector('.prod-toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.addEventListener('click', event => {
      const detailButton = event.target.closest('.prod-detail');
      if (detailButton) {
        const title = detailButton.dataset.title || '';
        window.location.href = `my-content-detail.html?title=${encodeURIComponent(title)}`;
        return;
      }

      const moreButton = event.target.closest('.prod-more');
      if (moreButton) {
        const card = moreButton.closest('.prod-card');
        const willOpen = !card.classList.contains('menu-open');
        document.querySelectorAll('.prod-card.menu-open').forEach(item => item.classList.remove('menu-open'));
        card.classList.toggle('menu-open', willOpen);
        event.stopPropagation();
        return;
      }

      if (!event.target.closest('.prod-menu')) {
        document.querySelectorAll('.prod-card.menu-open').forEach(item => item.classList.remove('menu-open'));
      }

      const workflowMenuButton = event.target.closest('.prod-menu-item[data-menu-action="workflow"]');
      if (workflowMenuButton) {
        window.location.href = 'workflow-version-detail.html?id=0&from=distribution-version';
      }
    });

    document.addEventListener('pointerover', event => {
      const detailButton = event.target.closest('.prod-detail');
      if (!detailButton) return;
      const title = detailButton.dataset.title || '';
      window.ShortflowNav?.prefetchPage(`my-content-detail.html?title=${encodeURIComponent(title)}`);
    }, { passive: true });

    updateTabCounts();
    renderContents();
  </script>
</body>
</html>
