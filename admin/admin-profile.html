.topbar { height: 46px; background: #fff; border-bottom: 0.5px solid rgb(242, 242, 242); display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }

.profile-body { flex: 1; overflow-y: auto; padding: 20px; }
.profile-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.profile-card-head { padding: 15px 18px; border-bottom: 0.5px solid #e8e6e0; display: flex; align-items: center; justify-content: space-between; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-field { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.form-field.full { grid-column: 1 / -1; }
.form-label { font-size: 11.5px; font-weight: 600; color: #555; }
.form-input { width: 100%; height: 36px; padding: 0 11px; border: 0.5px solid #d8d6cf; border-radius: 7px; background: #fff; color: #1a1a18; font-family: inherit; font-size: 13px; outline: none; }
.form-input:focus { border-color: #1a1a18; }
.form-input[readonly] { background: rgb(242, 242, 242); color: #777; cursor: default; }
.form-input[readonly]:focus { border-color: #d8d6cf; }
.form-help { color: #aaa; font-size: 11px; line-height: 1.5; }
.section-divider { height: 1px; background: rgb(242, 242, 242); margin: 2px 0; }
.savebar { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 0.5px solid rgb(242, 242, 242); background: #fff; }
.btn { height: 36px; padding: 0 16px; border: 0.5px solid #d8d6cf; border-radius: 8px; background: #fff; color: #444; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn.primary { background: #1a1a18; border-color: #1a1a18; color: #fff; }
.toast { position: fixed; right: 18px; bottom: 18px; min-width: 180px; padding: 11px 13px; border-radius: 9px; background: #1a1a18; color: #fff; font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 160ms ease, transform 160ms ease; }
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 760px) {

<div class="main">
  <div class="topbar">
    <span class="topbar-title">관리자 정보</span>
  </div>

  <div class="profile-body">
    <div class="profile-wrap">
      <section class="profile-card">
        <div class="profile-card-head">
          <div>
            <div class="profile-card-title">회원정보 수정</div>
            <div class="profile-card-sub">현재는 비밀번호만 변경 가능합니다.</div>
          </div>
        </div>

        <div class="profile-card-body">
          <div class="form-grid">
            <label class="form-field">
              <span class="form-label">이름</span>
              <input class="form-input" id="adminName" value="김관리자" readonly>
            </label>

            <label class="form-field">
              <span class="form-label">이메일</span>
              <input class="form-input" id="adminEmail" type="email" value="ops@shortflow.io" readonly>
            </label>
          </div>

          <div class="section-divider"></div>

          <div class="form-grid">
            <label class="form-field">
              <span class="form-label">현재 비밀번호</span>
              <input class="form-input" id="currentPassword" type="password" placeholder="현재 비밀번호" autocomplete="current-password">
            </label>
            <div></div>
            <label class="form-field">
              <span class="form-label">새 비밀번호</span>
              <input class="form-input" id="newPassword" type="password" placeholder="새 비밀번호" autocomplete="new-password">
              <span class="form-help">영문, 숫자를 포함해 8자 이상으로 만들어주세요.</span>
            </label>
            <label class="form-field">
              <span class="form-label">새 비밀번호 확인</span>
              <input class="form-input" id="newPasswordConfirm" type="password" placeholder="한 번 더 입력해주세요" autocomplete="new-password">
            </label>
          </div>
        </div>

        <div class="savebar">
          <button class="btn primary" type="button" id="changePassword">비밀번호 변경</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="profileToast">비밀번호가 변경되었습니다.</div>

<script>
const profileToast = document.getElementById('profileToast');
const currentPassword = document.getElementById('currentPassword');
const newPassword = document.getElementById('newPassword');
const newPasswordConfirm = document.getElementById('newPasswordConfirm');

function showToast(message) {
  profileToast.textContent = message;
  profileToast.classList.add('show');
  setTimeout(() => profileToast.classList.remove('show'), 1600);
}

document.getElementById('changePassword').addEventListener('click', () => {
  if (!currentPassword.value.trim()) {
    showToast('현재 비밀번호를 입력해주세요.');
    currentPassword.focus();
    return;
  }

  if (newPassword.value.length < 8) {
    showToast('새 비밀번호는 8자 이상 입력해주세요.');
    newPassword.focus();
    return;
  }

  if (newPassword.value !== newPasswordConfirm.value) {
    showToast('새 비밀번호가 일치하지 않습니다.');
    newPasswordConfirm.focus();
    return;
  }

  currentPassword.value = '';
  newPassword.value = '';
  newPasswordConfirm.value = '';
  showToast('비밀번호가 변경되었습니다.');
});
</script>
