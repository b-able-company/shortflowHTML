    const marker = 'shortflow-production-inquiries-cleared-20260709';
    if (localStorage.getItem(marker) === '1') return;
    localStorage.removeItem('shortflow-production-inquiries');
    localStorage.setItem(marker, '1');
  } catch (error) {
    // localStorage may be unavailable in restricted previews.
  }
}

function storedProductionInquiries() {
  try {
    const saved = JSON.parse(localStorage.getItem('shortflow-production-inquiries') || '[]');
    if (!Array.isArray(saved)) return [];
    return saved.map((item, index) => {
      const date = item.date && item.time ? `${item.date} · ${item.time}` : '2026.05.13 · 12:00';
      return {
        id: item.id || `production-saved-${index}`,
        type: normalizeIntentType(item.inquiryType || '제작협업'),
        name: item.platformName || item.platform || 'Reelio',
        sub: item.contentTitle || item.title || '제작협업 문의',
        producerName: item.producerName || '-',
        contentTitle: item.contentTitle || item.title || '-',
        date,
        shortDate: date.slice(5, 10),
        message: item.full || item.message || '제작협업 문의가 접수되었습니다.',
        status: normalizeIntentStatus(item.status || 'pending'),
      };
    });
  } catch (error) {
    return [];
  }
}

clearLegacyProductionInquiriesOnce();

function normalizeIntentStatus(status) {
  if (status === '검토 완료' || status === 'reviewed') return 'reviewed';
  return 'pending';
}

function normalizeIntentType(type) {
  if (type === '턴키 판매 의사' || type === '턴키판매') return '턴키판매';
  return '제작협업';
}

function intentStatusLabel(status) {
  return normalizeIntentStatus(status).toUpperCase();
}

let inquiryItems = [...storedProductionInquiries(), ...baseInquiries].map(item => ({
  ...item,
  type: normalizeIntentType(item.type),
  status: normalizeIntentStatus(item.status),
}));
let activeTypeFilter = '전체';
let activePlatformFilter = '전체';
let activeStatusFilter = '전체';
const INTENT_PAGE_SIZE = 10;
let intentPage = 1;

const commentsByIntent = {
  'turnkey-wetv': [
    { author: 'Lee Admin', date: '2026.05.12 13:40', text: '로맨스/스릴러 혼합 라인업으로 1차 후보를 추려보고 메일 발송 여부 확인 필요.' },
  ],
  'turnkey-iqiyi': [
    { author: 'Lee Admin', date: '2026.05.10 10:15', text: '중화권 서비스 기준에 맞는 작품 3개 확인 완료. 다음 미팅에서 패키지 조건 공유 예정.' },
  ],
  'production-office-wife': [
    { author: 'Lee Admin', date: '2026.05.08 15:05', text: '제작비 범위와 심의 가능성 먼저 확인 필요.' },
  ],
};
let selectedInquiryId = '';
let pendingReviewInquiryId = '';
let adminConfirmHandler = null;

function setTypeFilter(el) {
  activeTypeFilter = el.value || '전체';
  intentPage = 1;
  renderInquiryList();
}

function setStatusFilter(el) {
  activeStatusFilter = el.value || '전체';
  intentPage = 1;
  renderInquiryList();
}

function closeIntentFilterDropdowns() {
  document.querySelectorAll('.intent-filter-dropdown.open').forEach(dropdown => {
    dropdown.classList.remove('open');
    dropdown.querySelector('.intent-filter-control')?.setAttribute('aria-expanded', 'false');
  });
}

function resetIntentDropdownSearch(dropdown) {
  const search = dropdown?.querySelector('.intent-filter-search');
  if (search) {
    search.value = '';
    filterIntentDropdownOptions(search);
  }
}

function toggleIntentFilterPanel() {
  const panel = document.getElementById('intent-filter-panel');
  const toggle = document.getElementById('intent-filter-toggle');
  if (!panel || !toggle) return;
  const isOpen = panel.classList.toggle('show');
  toggle.classList.toggle('open', isOpen);
  toggle.setAttribute('aria-expanded', String(isOpen));
  if (!isOpen) closeIntentFilterDropdowns();
}

function toggleIntentFilterDropdown(id) {
  const dropdown = document.getElementById(id);
  if (!dropdown) return;
  const wasOpen = dropdown.classList.contains('open');
  closeIntentFilterDropdowns();
  dropdown.classList.toggle('open', !wasOpen);
  dropdown.querySelector('.intent-filter-control')?.setAttribute('aria-expanded', String(!wasOpen));
  if (!wasOpen) {
    setTimeout(() => dropdown.querySelector('.intent-filter-search')?.focus(), 0);
  }
}

function filterIntentDropdownOptions(input) {
  const query = (input.value || '').trim().toLowerCase();
  const menu = input.closest('.intent-filter-menu');
  let visibleCount = 0;
  menu?.querySelectorAll('.intent-filter-menu-item').forEach(item => {
    const text = (item.dataset.value || item.textContent || '').toLowerCase();
    const isVisible = !query || text.includes(query);
    item.style.display = isVisible ? '' : 'none';
    if (isVisible) visibleCount += 1;
  });
  menu?.querySelector('.intent-filter-menu-empty')?.classList.toggle('show', visibleCount === 0);
}

function selectIntentFilter(type, value, label) {
  if (type === 'type') {
    activeTypeFilter = value || '전체';
    document.getElementById('intent-type-filter-button').textContent = label;
  }
  if (type === 'platform') {
    activePlatformFilter = value || '전체';
    document.getElementById('intent-platform-filter-button').textContent = label;
  }
  if (type === 'status') {
    activeStatusFilter = value || '전체';
    document.getElementById('intent-status-filter-button').textContent = label;
  }
  const dropdown = document.getElementById(`intent-${type}-filter-dropdown`);
  dropdown?.querySelectorAll('.intent-filter-menu-item').forEach(item => {
    item.classList.toggle('active', item.dataset.value === value);
  });
  resetIntentDropdownSearch(dropdown);
  closeIntentFilterDropdowns();
  intentPage = 1;
  renderInquiryList();
}

function statusClass(status) {
  return normalizeIntentStatus(status) === 'reviewed' ? 'b-done' : 'b-received';
}

function filteredInquiries() {
  return inquiryItems.filter(item => {
    if (activeTypeFilter !== '전체' && item.type !== activeTypeFilter) return false;
    if (activePlatformFilter !== '전체' && item.name !== activePlatformFilter) return false;
    if (activeStatusFilter !== '전체' && item.status !== activeStatusFilter) return false;
    return true;
  });
}

function renderInquiryList() {
  const list = document.getElementById('inquiry-list');
  const items = filteredInquiries();
  const totalPages = Math.max(1, Math.ceil(items.length / INTENT_PAGE_SIZE));
  if (intentPage > totalPages) intentPage = totalPages;
  const pageItems = items.slice((intentPage - 1) * INTENT_PAGE_SIZE, intentPage * INTENT_PAGE_SIZE);
  const shouldCloseDetail = selectedInquiryId && !items.some(item => item.id === selectedInquiryId);
  if (shouldCloseDetail) {
    selectedInquiryId = '';
    setIntentDetailExpanded(false);
    document.getElementById('pane-intents')?.classList.remove('has-detail', 'is-expanded');
    document.querySelector('.main')?.classList.remove('intent-detail-open', 'intent-detail-expanded');
  }
  list.innerHTML = pageItems.length ? pageItems.map((item, index) => `
    <tr class="${item.id === selectedInquiryId ? 'sel' : ''}" data-inquiry-id="${escapeHtml(item.id)}" onclick="selectInquiry('${escapeHtml(item.id)}')">
      <td><span class="intent-no">${items.length - ((intentPage - 1) * INTENT_PAGE_SIZE + index)}</span></td>
      <td class="td-type"><span class="type-text">${escapeHtml(item.type)}</span></td>
      <td class="td-company">
        <div class="tname">${escapeHtml(item.name)}</div>
      </td>
      <td class="td-status"><span class="bdg ${statusClass(item.status)}">${escapeHtml(intentStatusLabel(item.status))}</span></td>
      <td class="tcount" data-comment-count-for="${escapeHtml(item.id)}"></td>
      <td class="tmeta">${escapeHtml(formatIntentListDate(item.date))}</td>
    </tr>
  `).join('') : '<tr class="intent-filter-empty"><td colspan="6">조건에 맞는 문의가 없습니다.</td></tr>';
  if (selectedInquiryId) {
    renderDetail();
  } else {
    renderEmptyDetail();
  }
  renderIntentPagination(totalPages);
  updateIntentFilterButtonStates();
  updateIntentCommentCounts();
}

function renderIntentPagination(totalPages) {
  const pagebar = document.getElementById('intent-pagebar');
  if (!pagebar) return;
  pagebar.innerHTML = totalPages > 1
    ? Array.from({ length: totalPages }).map((_, index) => {
      const page = index + 1;
      return `<button class="list-page-btn ${page === intentPage ? 'active' : ''}" onclick="setIntentPage(${page})">${page}</button>`;
    }).join('')
    : '<button class="list-page-btn active" disabled>1</button>';
}

function formatIntentListDate(value) {
  return String(value || '').split(' · ')[0] || '-';
}

function setIntentPage(page) {
  intentPage = page;
  renderInquiryList();
}

function updateIntentFilterButtonStates() {
  document.getElementById('intent-type-filter-button')?.classList.toggle('active', activeTypeFilter !== '전체');
  document.getElementById('intent-platform-filter-button')?.classList.toggle('active', activePlatformFilter !== '전체');
  document.getElementById('intent-status-filter-button')?.classList.toggle('active', activeStatusFilter !== '전체');
}

function selectInquiry(id) {
  selectedInquiryId = id;
  openIntentDetailPane();
  renderInquiryList();
}

function selectedInquiry() {
  return inquiryItems.find(item => item.id === selectedInquiryId);
}

function renderDetail() {
  const item = selectedInquiry();
  if (!item) return renderEmptyDetail();
  document.getElementById('intent-empty').style.display = 'none';
  document.getElementById('intent-detail').style.display = 'flex';
  document.getElementById('intent-platform').textContent = item.name;
  document.getElementById('intent-type-label').textContent = item.type;
  setOptionalText('intent-type', item.type);
  setOptionalText('intent-producer', item.producerName || '-');
  setOptionalText('intent-content', item.contentTitle || item.sub || '-');
  document.querySelectorAll('.production-meta').forEach(row => {
    row.style.display = item.type === '제작협업' ? '' : 'none';
  });
  const badge = document.getElementById('intent-status');
  badge.textContent = intentStatusLabel(item.status);
  badge.className = `bdg ${statusClass(item.status)}`;
  document.getElementById('comment-input').value = '';
  renderComments();
}

function renderEmptyDetail() {
  document.getElementById('intent-empty').style.display = '';
  document.getElementById('intent-detail').style.display = 'none';
  document.getElementById('intent-platform').textContent = '문의 없음';
  document.getElementById('intent-type-label').textContent = '-';
  setOptionalText('intent-type', '-');
  setOptionalText('intent-producer', '-');
  setOptionalText('intent-content', '-');
  document.querySelectorAll('.production-meta').forEach(row => {
    row.style.display = 'none';
  });
  document.getElementById('intent-status').textContent = '-';
  renderComments();
}

function setOptionalText(id, value) {
  const element = document.getElementById(id);
  if (element) element.textContent = value;
}

function openIntentDetailPane() {
  document.getElementById('pane-intents')?.classList.add('has-detail');
  document.querySelector('.main')?.classList.add('intent-detail-open');
}

function setIntentDetailExpanded(isExpanded) {
  const pane = document.getElementById('pane-intents');
  const main = document.querySelector('.main');
  pane?.classList.toggle('is-expanded', isExpanded);
  main?.classList.toggle('intent-detail-expanded', isExpanded);
  const toggle = document.getElementById('intent-expand-toggle');
  if (toggle) {
    toggle.setAttribute('aria-pressed', String(isExpanded));
    toggle.setAttribute('aria-label', isExpanded ? '상세 축소' : '상세 확장');
    toggle.innerHTML = `<i class="ti ${isExpanded ? 'ti-arrows-minimize' : 'ti-arrows-maximize'}"></i>`;
  }
}

function toggleIntentDetailExpanded() {
  const pane = document.getElementById('pane-intents');
  setIntentDetailExpanded(!pane?.classList.contains('is-expanded'));
}

function closeIntentDetailPane() {
  selectedInquiryId = '';
  setIntentDetailExpanded(false);
  document.getElementById('pane-intents')?.classList.remove('has-detail', 'is-expanded');
  document.querySelector('.main')?.classList.remove('intent-detail-open', 'intent-detail-expanded');
  document.querySelectorAll('#inquiry-list tr').forEach(row => row.classList.remove('sel'));
  renderEmptyDetail();
  renderInquiryList();
}

function completeReview(event) {
  event?.stopPropagation?.();
  const item = selectedInquiry();
  if (!item) return;
  pendingReviewInquiryId = item.id;
  openAdminConfirm({
    title: '검토 완료 처리할까요?',
    message: '이 메시지가 확인 완료 상태로 변경됩니다.',
    onConfirm: confirmReviewComplete,
  });
}

function openAdminConfirm({ title, message, onConfirm }) {
  document.getElementById('review-confirm-title').textContent = title || '처리할까요?';
  document.getElementById('admin-confirm-message').textContent = message || '';
  adminConfirmHandler = typeof onConfirm === 'function' ? onConfirm : null;
  document.getElementById('review-confirm-modal')?.classList.add('show');
}

function closeAdminConfirm(event) {
  event?.stopPropagation?.();
  pendingReviewInquiryId = '';
  adminConfirmHandler = null;
  document.getElementById('review-confirm-modal')?.classList.remove('show');
}

function closeReviewConfirm(event) {
  closeAdminConfirm(event);
}

function submitAdminConfirm() {
  if (typeof adminConfirmHandler === 'function') {
    adminConfirmHandler();
    return;
  }
  closeAdminConfirm();
}

function confirmReviewComplete() {
  const item = inquiryItems.find(inquiry => inquiry.id === pendingReviewInquiryId) || selectedInquiry();
  if (!item) {
    closeAdminConfirm();
    return;
  }
  item.status = 'reviewed';
  const badge = document.getElementById('intent-status');
  if (badge && item.id === selectedInquiryId) {
    badge.textContent = 'REVIEWED';
    badge.className = 'bdg b-done';
  }
  pendingReviewInquiryId = '';
  adminConfirmHandler = null;
  document.getElementById('review-confirm-modal')?.classList.remove('show');
  renderInquiryList();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[ch]));
}

function formatNow() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function formatDateTime(date) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())} · ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function chatTimeLabel(value) {
  return String(value || '').replace(' · ', ' ');
}

function reviewCheckControl(item) {
  if (normalizeIntentStatus(item.status) === 'reviewed') {
    return '<span class="message-review-check reviewed" aria-label="확인 완료"><i class="ti ti-check"></i></span>';
  }
  return '<button class="message-review-check" type="button" aria-label="메시지 확인" onclick="completeReview(event)"><i class="ti ti-check"></i></button>';
}

function renderComments() {
  const list = document.getElementById('comment-list');
  const item = selectedInquiry();
  const comments = commentsByIntent[selectedInquiryId] || [];
  updateIntentCommentCounts();
  if (!item) {
    list.innerHTML = '';
    return;
  }
  const isProductionInquiry = item.type === '제작협업';
  const userMessage = isProductionInquiry ? `
    <div class="comment-item sender-user production-user-message">
      <div class="comment-main">
        <div class="production-chat-summary">
          <div class="production-chat-label">콘텐츠명</div>
          <div class="production-chat-value">${escapeHtml(item.contentTitle || item.sub || '-')}</div>
          <div class="production-chat-label">제작사명</div>
          <div class="production-chat-value">${escapeHtml(item.producerName || '-')}</div>
        </div>
        <div class="comment-bubble-line">
          <div class="comment-avatar" style="background-image:url('../images/icon/플랫폼프로필.png')" aria-hidden="true"></div>
          <div class="comment-text">${escapeHtml(item.message)}</div>
          ${reviewCheckControl(item)}
        </div>
        <div class="comment-time production-chat-time">${escapeHtml(chatTimeLabel(item.date))}</div>
      </div>
    </div>
  ` : `
    <div class="comment-item sender-user">
      <div class="comment-main">
        <div class="comment-bubble-line">
          <div class="comment-avatar" style="background-image:url('../images/icon/플랫폼프로필.png')" aria-hidden="true"></div>
          <div class="comment-text">${escapeHtml(item.message)}</div>
          ${reviewCheckControl(item)}
        </div>
        <div class="comment-time">${escapeHtml(chatTimeLabel(item.date))}</div>
      </div>
    </div>
  `;
  const adminMessages = comments.map(comment => `
    <div class="comment-item sender-admin">
      <div class="comment-main">
        <div class="comment-text">${escapeHtml(comment.text)}</div>
        <div class="comment-time">${escapeHtml(chatTimeLabel(comment.date))}</div>
      </div>
    </div>
  `).join('');
  list.innerHTML = userMessage + adminMessages;
  list.scrollTop = list.scrollHeight;
}

function updateIntentCommentCounts() {
  document.querySelectorAll('[data-comment-count-for]').forEach(el => {
    const count = (commentsByIntent[el.dataset.commentCountFor] || []).length;
    el.textContent = String(count);
    el.classList.toggle('zero', count === 0);
  });
}

function addComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text || !selectedInquiryId) return;
  if (!commentsByIntent[selectedInquiryId]) commentsByIntent[selectedInquiryId] = [];
  commentsByIntent[selectedInquiryId].push({
    author: 'Lee Admin',
    date: formatNow(),
    text,
  });
  input.value = '';
  renderComments();
}

document.addEventListener('click', event => {
  if (!event.target.closest('.intent-filter-dropdown')) {
    closeIntentFilterDropdowns();
  }
});

renderInquiryList();
</script>
</body>
</html>
