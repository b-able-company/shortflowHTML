<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>대시보드 — Shortflow Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<link rel="stylesheet" href="admin-common.css"/>
<script src="admin-common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #f5f4f0; display: flex; height: 100vh; overflow: hidden; font-size: 13px; color: #1a1a18; }

/* SIDEBAR */
.sb { width: 210px; min-width: 210px; background: #13130f; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; }
.sb-logo { padding: 16px 16px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
.sb-logo-main { color: #fff; font-size: 14px; font-weight: 600; }
.sb-logo-sub { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.nav { flex: 1; overflow-y: auto; padding: 6px 0; }
.nav-label { font-size: 9px; color: rgba(255,255,255,0.22); letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 16px 3px; }
.ni { display: flex; align-items: center; gap: 7px; padding: 6px 16px; font-size: 12.5px; color: rgba(255,255,255,0.42); cursor: pointer; border-left: 2px solid transparent; }
.ni:hover { color: rgba(255,255,255,0.7); }
.ni.active { color: #fff; border-left-color: #fff; background: rgba(255,255,255,0.04); }
.ni i { font-size: 13px; flex-shrink: 0; }
.ni-badge { margin-left: auto; font-size: 10px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 1px 6px; border-radius: 10px; }
.ni-badge.hot { background: #fff; color: #13130f; }
.sub .ni { padding-left: 36px; font-size: 12px; color: rgba(255,255,255,0.32); }
.sub .ni:hover { color: rgba(255,255,255,0.6); }
.sb-foot { padding: 10px 16px; border-top: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 9px; }
.ava { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: 500; flex-shrink: 0; }
.uname { font-size: 11px; color: #fff; font-weight: 500; }
.uemail { font-size: 10px; color: rgba(255,255,255,0.28); margin-top: 1px; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { position: relative; height: 62px; background: #f5f4f0; display: flex; align-items: center; padding: 7px 32px 0; flex-shrink: 0; }
.topbar::after { content: ""; position: absolute; left: 30px; right: 30px; bottom: 0; height: 0.5px; background: #d6d4cd; }
.topbar-title { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 550; }
.topbar-separator { color: #bbb; font-weight: 400; }
.topbar-current { color: #777; font-size: 16px; font-weight: 500; }
.topbar-right { margin-left: auto; font-size: 12px; color: #aaa; }
.topbar-date { font-size: 12px; color: #888; }

/* BODY */
.body { flex: 1; overflow-y: auto; padding: 20px 30px 30px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 350px); grid-template-areas: "operations side"; gap: 22px; align-items: start; width: 100%; }
.operations-left { grid-area: operations; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.operations-right { grid-area: side; display: flex; flex-direction: column; gap: 22px; min-width: 0; }

/* CARDS */
.card { background: #fff; border: 0.5px solid #e8e6e0; border-radius: 10px; overflow: hidden; }
.card-head { min-height: 50px; padding: 0 22px; border-bottom: 0.5px solid #e8e6e0; display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 550; color: #777; letter-spacing: 0.02em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.card-title i { font-size: 16px; }
.card-action { font-size: 11.5px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 3px; }
.card-action:hover { color: #333; }

/* FOCUS */
.focus-card { order: 1; }
.focus-head-meta { display: flex; align-items: center; gap: 8px; }
.sort-sel { font-size: 11px; padding: 2px 7px; border: 0.5px solid #e0dfd9; border-radius: 5px; background: #fff; color: #666; outline: none; cursor: pointer; font-family: inherit; }
.focus-filters { min-height: 50px; padding: 8px 22px; background: #fff; border-bottom: 0.5px solid #f0efe9; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
.focus-filter-title { margin-right: auto; padding-right: 18px; display: flex; align-items: center; gap: 7px; color: #777; font-size: 14px; font-weight: 550; letter-spacing: .02em; white-space: nowrap; }
.focus-filter-title i { font-size: 16px; }
.focus-filter-title span { color: #bbb; font-size: 11.5px; font-weight: 400; letter-spacing: 0; }
.focus-filter { min-height: 32px; border: 0; border-radius: 12px; padding: 7px 12px; background: rgba(245,244,240,.82); color: #717171; font-family: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.72); transition: background .16s ease, color .16s ease, transform .16s ease; }
.focus-filter:hover { background: #efeee9; color: #333; }
.focus-filter:active { transform: scale(.98); }
.focus-filter.active { background: #e5e4df; color: #1d1d1f; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(0,0,0,.04); }
.focus-filter-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.focus-filter-count { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: rgba(255,255,255,.82); color: #6e6e73; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.04); }
.focus-list { min-height: 464px; display: flex; flex-direction: column; }
.focus-item { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 0.5px solid #f1f0ec; cursor: pointer; transition: background .15s ease; }
.focus-item:last-child { border-bottom: none; }
.focus-item:hover { background: #fafaf7; }
.focus-num { width: 22px; flex: 0 0 22px; font-size: 12px; color: #ccc; font-weight: 500; }
.focus-tag { width: 76px; min-height: 26px; padding: 5px 8px; border: 0; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; line-height: 1; white-space: nowrap; flex: 0 0 76px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
.ft-revision  { background: rgba(230,241,251,.78); color: #266a9f; }
.ft-content   { background: rgba(250,238,218,.82); color: #936016; }
.ft-inquiry   { background: rgba(237,233,254,.82); color: #6559b5; }
.ft-user      { background: rgba(234,243,222,.82); color: #4a781f; }
.focus-info { flex: 1; min-width: 0; }
.focus-title { font-size: 13.5px; font-weight: 500; color: #1a1a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.focus-age { font-size: 11.5px; color: #bbb; white-space: nowrap; flex-shrink: 0; }
.focus-btn { min-height: 32px; padding: 6px 14px; border-radius: 8px; border: 0; cursor: pointer; background: #1a1a18; color: #fff; font-family: inherit; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
.focus-empty { padding: 32px 16px; text-align: center; color: #ccc; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.focus-empty i { font-size: 24px; }
.focus-pagination { padding: 9px 22px; border-top: 0.5px solid #f0efe9; display: flex; align-items: center; justify-content: center; gap: 4px; }
.focus-page-btn { min-width: 27px; height: 27px; padding: 0 7px; border: 0.5px solid #e0dfd9; border-radius: 6px; background: #fff; color: #777; font-family: inherit; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.focus-page-btn:hover { border-color: #aaa; color: #333; }
.focus-page-btn.active { border-color: #1a1a18; background: #1a1a18; color: #fff; font-weight: 600; }
.focus-page-btn:disabled { color: #ccc; cursor: default; border-color: #ecebe7; }

/* SETTLEMENT STATUS */
.settlement-stage { padding: 24px 22px; display: flex; align-items: center; gap: 16px; cursor: pointer; text-decoration: none; border: none !important; transition: transform .15s ease, box-shadow .15s ease; }
.settlement-stage:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.settlement-stage > div:last-child { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.settlement-stage.scheduled { background: #fff; }
.settlement-stage.complete-wait { background: #fff; }
.settlement-stage-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,0.06); color: #555; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.settlement-stage.scheduled .settlement-stage-icon { background: rgba(232,93,44,0.12); color: #c0521c; }
.settlement-stage.complete-wait .settlement-stage-icon { background: rgba(59,109,17,0.1); color: #3B6D11; }
.settlement-stage-label { color: #888; font-size: 12px; font-weight: 500; letter-spacing: 0.01em; margin-bottom: 4px; }
.settlement-stage-value { color: #1a1a18; font-size: 24px; line-height: 1; font-weight: 600; white-space: nowrap; }
.settlement-stage-value small { margin-left: 3px; color: #aaa; font-size: 13px; font-weight: 400; }
.settlement-arrow { display: none; }
.settlement-stage.card { overflow: visible; }
.settlement-chevron { margin-left: auto; color: #bbb; font-size: 20px; flex-shrink: 0; }

/* DEAL PIPELINE */
.pipeline-overview { order: 3; }
.pipeline-body { padding: 16px 18px 18px; overflow-x: auto; }
.pipeline-content { min-width: 760px; }
.pipeline-stages { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1fr); align-items: center; margin-bottom: 16px; }
.pipeline-stage { min-height: 72px; padding: 13px 16px; border: 1px solid #e3e1db; border-radius: 14px; background: #fff; cursor: pointer; font-family: inherit; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pipeline-stage:hover { background: #f7f6f3; }
.pipeline-stage.active { background: #1a1a18; border-color: #1a1a18; }
.pipeline-stage.active .pipeline-stage-name { color: #fff; }
.pipeline-stage.active .pipeline-stage-value { color: #fff; }
.pipeline-stage.active .pipeline-stage-value small { color: rgba(255,255,255,0.6); }
.pipeline-stage-name { display: flex; align-items: center; gap: 6px; color: #555; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pipeline-stage-dot { display: none; }
.pipeline-stage-value { color: #111; font-size: 22px; line-height: 1; font-weight: 650; flex-shrink: 0; }
.pipeline-stage-value small { margin-left: 3px; color: #777; font-size: 11px; font-weight: 500; }
.pipeline-rate { display: flex; align-items: center; justify-content: center; color: #aaa; }
.pipeline-rate i { font-size: 12px; }
.pipeline-table-wrap { min-height: 223px; border: 1px solid #e3e1db; border-radius: 9px; overflow: hidden; }
.pipeline-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.pipeline-table th { height: 40px; padding: 0 28px; background: #f5f4f0; color: #999; font-size: 12px; font-weight: 500; text-align: left; }
.pipeline-table td { height: 48px; padding: 0 28px; border-top: 1px solid #eceae5; color: #555; font-size: 13px; }
.pipeline-table td:first-child { color: #222; font-weight: 550; }
.pipeline-table.deal-detail-table th:nth-child(1),
.pipeline-table.deal-detail-table td:nth-child(1) { width: 18%; }
.pipeline-table.deal-detail-table th:nth-child(2),
.pipeline-table.deal-detail-table td:nth-child(2) { width: 14%; white-space: nowrap; }
.pipeline-table.deal-detail-table th:nth-child(3),
.pipeline-table.deal-detail-table td:nth-child(3) { width: 30%; }
.pipeline-table.deal-detail-table th:nth-child(4),
.pipeline-table.deal-detail-table td:nth-child(4) { width: 20%; }
.pipeline-table.deal-detail-table th:nth-child(5),
.pipeline-table.deal-detail-table td:nth-child(5) { width: 18%; text-align: right; }
.pipeline-deal-type { color: #888; font-size: 12px; }
.pipeline-deal-content { color: #222; font-weight: 550; }
.pipeline-budget { color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pipeline-region { color: #666; white-space: normal; line-height: 1.4; }
.pipeline-pagination { min-height: 34px; display: flex; align-items: flex-end; justify-content: center; gap: 14px; }
.pipeline-page-number { padding: 4px 2px 1px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #aaa; font-family: inherit; font-size: 11px; cursor: pointer; }
.pipeline-page-number:hover { color: #444; }
.pipeline-page-number.active { border-bottom-color: #222; color: #222; font-weight: 650; }

/* RECENT */
.recent-list { display: flex; flex-direction: column; }
.recent-item { display: flex; align-items: center; gap: 9px; padding: 10px 18px; border-bottom: 0.5px solid #f5f4f0; }
.recent-item:last-child { border-bottom: none; }
.rt { font-size: 11px; width: 64px; text-align: center; padding: 3px 0; border-radius: 4px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: rgba(232,93,44,0.12); color: #c0521c; }
.rt-approve, .rt-reject, .rt-meta, .rt-confirm, .rt-credit, .rt-close { background: rgba(232,93,44,0.12); color: #c0521c; }
.recent-main { flex: 1; min-width: 0; font-size: 13px; color: #1a1a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.recent-who { font-size: 12px; color: #888; }
.recent-time { font-size: 12px; color: #bbb; white-space: nowrap; }

/* TURNKEY INTENT */
.turnkey-message-list { display: flex; flex-direction: column; padding: 8px 0; }
.turnkey-message { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; column-gap: 14px; row-gap: 5px; padding: 14px 14px 14px 14px; color: inherit; text-decoration: none; transition: background .15s ease; border-radius: 8px; margin: 2px 4px; }
.turnkey-message:hover { background: #f5f4f0; }
.turnkey-avatar { grid-row: 1 / 3; align-self: start; width: 42px; height: 42px; border-radius: 50%; background: #f5efe8; display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; }
.turnkey-avatar img { width: 65%; height: 65%; object-fit: contain; }
.turnkey-company { min-width: 0; color: #111; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.turnkey-date { color: #aaa; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.turnkey-summary { grid-column: 2 / 3; color: #888; font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* CONTENT VIEW RANKING */
.ranking-head { gap: 12px; }
.ranking-tabs { display: flex; align-items: center; gap: 3px; padding: 3px; border-radius: 7px; background: #f3f2ee; }
.ranking-tab { height: 24px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: #888; font-family: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
.ranking-tab.active { background: #fff; color: #222; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ranking-table-wrap { overflow: hidden; }
.ranking-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ranking-table th { height: 32px; padding: 0 10px; background: #f7f6f2; color: #999; font-size: 11px; font-weight: 500; text-align: left; white-space: nowrap; }
.ranking-table td { height: 38px; padding: 0 10px; border-top: 0.5px solid #efeee9; color: #555; font-size: 12px; }
.ranking-table th:nth-child(1), .ranking-table td:nth-child(1) { width: 58px; text-align: center; }
.ranking-table th:nth-child(2), .ranking-table td:nth-child(2) { width: auto; }
.ranking-table th:nth-child(3), .ranking-table td:nth-child(3) { width: 62px; }
.ranking-table th:nth-child(4), .ranking-table td:nth-child(4) { width: 82px; text-align: right; }
.ranking-table th:first-child, .ranking-table td:first-child { padding-left: 16px; }
.ranking-table th:last-child, .ranking-table td:last-child { padding-right: 16px; }
.ranking-rank { color: #999; font-weight: 600; }
.ranking-rank.top { font-size: 13px; font-weight: 600; }
.ranking-rank.gold { color: #C8963C; }
.ranking-rank.silver { color: #8A9099; }
.ranking-rank.bronze { color: #A0673A; }
.ranking-episode { color: #666; font-size: 11.5px; white-space: nowrap; }
.ranking-title { display: block; color: #222; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ranking-views { color: #222; font-variant-numeric: tabular-nums; font-weight: 550; white-space: nowrap; }
.ranking-pagination { min-height: 44px; padding: 8px 14px; border-top: 0.5px solid #efeee9; display: flex; align-items: center; justify-content: center; gap: 4px; }
.ranking-page-btn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #666; font-family: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ranking-page-btn:hover:not(:disabled) { background: #f3f2ee; color: #222; }
.ranking-page-btn:disabled { color: #ccc; cursor: default; }
.ranking-page-status { min-width: 70px; color: #aaa; font-size: 10.5px; text-align: center; }

@media (max-width: 1050px) {
  .body { grid-template-columns: 1fr; grid-template-areas: "operations" "side"; }
}

@media (max-width: 760px) {
  .settlement-flow { grid-template-columns: 1fr; gap: 8px; }
  .settlement-arrow { transform: rotate(90deg); }
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
</style>
</head>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title">
      <span>대시보드</span>
      <span class="topbar-separator">/</span>
      <span class="topbar-current">운영 현황</span>

function renderFocus() {
  const list = document.getElementById('focus-list');
  const filteredItems = activeFocusFilter === 'all'
    ? focusItems
    : focusItems.filter(item => item.type === activeFocusFilter);

  if (filteredItems.length === 0) {
    list.innerHTML = `<div class="focus-empty"><i class="ti ti-circle-check"></i><span>모든 항목이 처리됐습니다</span></div>`;
    document.getElementById('focus-pagination').innerHTML = '';
    return;
  }
  const totalPages = Math.ceil(filteredItems.length / focusPageSize);
  activeFocusPage = Math.min(activeFocusPage, totalPages);
  const pageStart = (activeFocusPage - 1) * focusPageSize;
  list.innerHTML = filteredItems.slice(pageStart, pageStart + focusPageSize).map((item, i) => `
    <div class="focus-item">
      <span class="focus-num">${String(pageStart + i + 1).padStart(2, '0')}</span>
      <span class="focus-tag ${item.tagClass}">${item.tag}</span>
      <div class="focus-info">
        <div class="focus-title">${item.title}</div>
      </div>
      <span class="focus-age">${item.age}</span>
      <button class="focus-btn">검토 →</button>
    </div>`).join('');
  renderFocusPagination(totalPages);
}

function renderFocusPagination(totalPages) {
  const pagination = document.getElementById('focus-pagination');
  pagination.innerHTML = `
    <button class="focus-page-btn" type="button" data-page="${activeFocusPage - 1}" ${activeFocusPage === 1 ? 'disabled' : ''} aria-label="이전 페이지"><i class="ti ti-chevron-left"></i></button>
    ${Array.from({ length: totalPages }, (_, index) => {
      const page = index + 1;
      return `<button class="focus-page-btn ${page === activeFocusPage ? 'active' : ''}" type="button" data-page="${page}" ${page === activeFocusPage ? 'aria-current="page"' : ''}>${page}</button>`;
    }).join('')}
    <button class="focus-page-btn" type="button" data-page="${activeFocusPage + 1}" ${activeFocusPage === totalPages ? 'disabled' : ''} aria-label="다음 페이지"><i class="ti ti-chevron-right"></i></button>
  `;
  pagination.querySelectorAll('[data-page]:not(:disabled)').forEach(button => {
    button.addEventListener('click', () => {
      activeFocusPage = Number(button.dataset.page);
      renderFocus();
    });
  });
}

function initQueueFilters() {
  const filters = document.querySelectorAll('.focus-filter[data-filter]');

  document.querySelectorAll('[data-count]').forEach(count => {
    const filter = count.dataset.count;
    count.textContent = filter === 'all'
      ? focusItems.length
      : focusItems.filter(item => item.type === filter).length;
  });

  filters.forEach(filter => {
    filter.addEventListener('click', () => {
      activeFocusFilter = filter.dataset.filter;
      activeFocusPage = 1;
      filters.forEach(item => {
        const active = item === filter;
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', String(active));
      });
      renderFocus();
    });
  });
}

  const rows = visibleDeals.map(deal => `
    <tr>
      <td>${deal.platform}</td>
      <td><span class="pipeline-deal-type ${deal.typeClass}">${deal.type}</span></td>
      <td><span class="pipeline-deal-content">${deal.typeClass === 'turnkey' && isProposal ? '-' : deal.dealContent}</span></td>
      <td><span class="pipeline-region">${deal.typeClass === 'turnkey' && isProposal ? '-' : deal.region}</span></td>
      <td>${deal.date}</td>
    </tr>`).join('');
  const regionLabel = isProposal ? '희망 지역' : isNegotiation ? '제안 지역' : '지역';
  const tableHead = `<tr><th>플랫폼</th><th>타입</th><th>콘텐츠</th><th>${regionLabel}</th><th>단계 진입일</th></tr>`;
  document.getElementById('pipeline-content').innerHTML = `
    <div class="pipeline-stages">${stageHtml}</div>
    <div class="pipeline-table-wrap">
      <table class="pipeline-table deal-detail-table">
        <thead>${tableHead}</thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="pipeline-pagination">
      ${Array.from({ length: totalPages }, (_, index) => {
        const page = index + 1;
        return `<button class="pipeline-page-number ${page === activePipelinePage ? 'active' : ''}" type="button" data-pipeline-page="${page}" ${page === activePipelinePage ? 'aria-current="page"' : ''}>${page}</button>`;
      }).join('')}
    </div>`;
  document.querySelectorAll('[data-pipeline-stage]').forEach(button => {
    button.addEventListener('click', () => {
      activePipelineStage = button.dataset.pipelineStage;
      activePipelinePage = 1;
      renderPipeline();
    });
  });
  document.querySelectorAll('[data-pipeline-page]').forEach(button => {
    button.addEventListener('click', () => {
      activePipelinePage = Number(button.dataset.pipelinePage);
      renderPipeline();
    });
  });
}

initQueueFilters();
renderFocus();
renderRecent();
renderPipeline();
initRankingTabs();
renderRanking();
</script>
</body>
</html>
