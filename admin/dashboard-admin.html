<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>대시보드 — Shortflow Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<link rel="stylesheet" href="admin-common.css"/>
<script src="admin-common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #f5f4f0; display: flex; height: 100vh; overflow: hidden; font-size: 13px; color: #1a1a18; }

/* SIDEBAR */
.sb { width: 210px; min-width: 210px; background: #13130f; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; }
.sb-logo { padding: 16px 16px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
.sb-logo-main { color: #fff; font-size: 14px; font-weight: 600; }
.sb-logo-sub { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.nav { flex: 1; overflow-y: auto; padding: 6px 0; }
.nav-label { font-size: 9px; color: rgba(255,255,255,0.22); letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 16px 3px; }
.ni { display: flex; align-items: center; gap: 7px; padding: 6px 16px; font-size: 12.5px; color: rgba(255,255,255,0.42); cursor: pointer; border-left: 2px solid transparent; }
.ni:hover { color: rgba(255,255,255,0.7); }
.ni.active { color: #fff; border-left-color: #fff; background: rgba(255,255,255,0.04); }
.ni i { font-size: 13px; flex-shrink: 0; }
.ni-badge { margin-left: auto; font-size: 10px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 1px 6px; border-radius: 10px; }
.ni-badge.hot { background: #fff; color: #13130f; }
.sub .ni { padding-left: 36px; font-size: 12px; color: rgba(255,255,255,0.32); }
.sub .ni:hover { color: rgba(255,255,255,0.6); }
.sb-foot { padding: 10px 16px; border-top: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 9px; }
.ava { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: 500; flex-shrink: 0; }
.uname { font-size: 11px; color: #fff; font-weight: 500; }
.uemail { font-size: 10px; color: rgba(255,255,255,0.28); margin-top: 1px; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { position: relative; height: 62px; background: #f5f4f0; display: flex; align-items: center; padding: 7px 32px 0; flex-shrink: 0; }
.topbar::after { content: ""; position: absolute; left: 30px; right: 30px; bottom: 0; height: 0.5px; background: #d6d4cd; }
.topbar-title { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 550; }
.topbar-separator { color: #bbb; font-weight: 400; }
.topbar-current { color: #777; font-size: 16px; font-weight: 500; }
.topbar-right { margin-left: auto; font-size: 12px; color: #aaa; }
.topbar-date { font-size: 12px; color: #888; }

/* BODY */
.body { flex: 1; overflow-y: auto; padding: 20px 30px 30px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); grid-template-areas: "focus recent" "settlement recent"; gap: 22px; align-items: stretch; width: 100%; }

/* CARDS */
.card { background: #fff; border: 0.5px solid #e8e6e0; border-radius: 10px; overflow: hidden; }
.card-head { padding: 10px 22px; border-bottom: 0.5px solid #e8e6e0; display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 11.5px; font-weight: 500; color: #888; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.card-title i { font-size: 13px; }
.card-action { font-size: 11px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 3px; }
.card-action:hover { color: #333; }

/* FOCUS */
.focus-card { grid-area: focus; }
.focus-head-meta { display: flex; align-items: center; gap: 8px; }
.sort-sel { font-size: 11px; padding: 2px 7px; border: 0.5px solid #e0dfd9; border-radius: 5px; background: #fff; color: #666; outline: none; cursor: pointer; font-family: inherit; }
.focus-filters { padding: 10px 22px; background: #fff; border-bottom: 0.5px solid #f0efe9; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
.focus-filter-title { margin-right: auto; padding-right: 18px; display: flex; align-items: center; gap: 6px; color: #888; font-size: 11.5px; font-weight: 500; letter-spacing: .03em; white-space: nowrap; }
.focus-filter-title i { font-size: 13px; }
.focus-filter-title span { color: #bbb; font-size: 11px; font-weight: 400; letter-spacing: 0; }
.focus-filter { border: 0; border-radius: 7px; padding: 6px 9px; background: #f5f4f0; color: #777; font-family: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.focus-filter:hover { background: #eeede8; color: #333; }
.focus-filter.active { background: #e2e0da; color: #1a1a18; font-weight: 600; }
.focus-filter-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.focus-filter-count { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: rgba(255,255,255,.72); color: #777; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600; }
.focus-list { display: flex; flex-direction: column; }
.focus-item { display: flex; align-items: center; gap: 10px; padding: 10px 22px; border-bottom: 0.5px solid #f5f4f0; cursor: pointer; }
.focus-item:last-child { border-bottom: none; }
.focus-item:hover { background: #fafaf7; }
.focus-num { font-size: 11px; color: #ccc; font-weight: 500; width: 18px; flex-shrink: 0; }
.focus-tag { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.ft-revision  { background: #E6F1FB; color: #185FA5; }
.ft-content   { background: #FAEEDA; color: #854F0B; }
.ft-inquiry   { background: #EDE9FE; color: #534AB7; }
.ft-user      { background: #EAF3DE; color: #3B6D11; }
.focus-info { flex: 1; min-width: 0; }
.focus-title { font-size: 12.5px; font-weight: 500; color: #1a1a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.focus-meta { font-size: 10.5px; color: #aaa; margin-top: 2px; }
.focus-age { font-size: 10.5px; color: #bbb; white-space: nowrap; flex-shrink: 0; }
.focus-btn { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 0.5px solid #e0dfd9; cursor: pointer; background: #1a1a18; color: #fff; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
.focus-empty { padding: 32px 16px; text-align: center; color: #ccc; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.focus-empty i { font-size: 24px; }
.focus-pagination { padding: 9px 22px; border-top: 0.5px solid #f0efe9; display: flex; align-items: center; justify-content: center; gap: 4px; }
.focus-page-btn { min-width: 27px; height: 27px; padding: 0 7px; border: 0.5px solid #e0dfd9; border-radius: 6px; background: #fff; color: #777; font-family: inherit; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.focus-page-btn:hover { border-color: #aaa; color: #333; }
.focus-page-btn.active { border-color: #1a1a18; background: #1a1a18; color: #fff; font-weight: 600; }
.focus-page-btn:disabled { color: #ccc; cursor: default; border-color: #ecebe7; }

/* SETTLEMENT STATUS */
.settlement-overview { grid-area: settlement; }
.settlement-flow { padding: 16px 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr) 42px minmax(0, 1fr); align-items: center; }
.settlement-stage { min-height: 88px; padding: 15px 18px; border-radius: 9px; background: #f7f6f2; display: flex; align-items: center; gap: 14px; }
.settlement-stage.scheduled { background: #FAEEDA; }
.settlement-stage-icon { width: 38px; height: 38px; border-radius: 10px; background: #eceae4; color: #777; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.settlement-stage.scheduled .settlement-stage-icon { background: #f3ddb7; color: #854F0B; }
.settlement-stage.complete-wait .settlement-stage-icon { background: #EAF3DE; color: #3B6D11; }
.settlement-stage-label { color: #777; font-size: 12px; font-weight: 550; }
.settlement-stage-value { margin-top: 6px; color: #1a1a18; font-size: 22px; line-height: 1; font-weight: 650; }
.settlement-stage-value small { margin-left: 3px; color: #777; font-size: 12px; font-weight: 500; }
.settlement-stage-meta { margin-top: 5px; color: #aaa; font-size: 10.5px; }
.settlement-arrow { color: #c8c6bf; font-size: 19px; text-align: center; }

/* RECENT */
.recent-card { grid-area: recent; display: flex; flex-direction: column; }
.recent-list { flex: 1; display: flex; flex-direction: column; }
.recent-item { display: flex; align-items: center; gap: 9px; padding: 10px 18px; border-bottom: 0.5px solid #f5f4f0; }
.recent-item:last-child { border-bottom: none; }
.rt { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.rt-approve  { background: #EAF3DE; color: #3B6D11; }
.rt-reject   { background: #FCEBEB; color: #A32D2D; }
.rt-meta     { background: #EDE9FE; color: #534AB7; }
.rt-confirm  { background: #FAEEDA; color: #854F0B; }
.rt-credit   { background: #E6F1FB; color: #185FA5; }
.rt-close    { background: #f0efe9; color: #888; }
.recent-main { flex: 1; min-width: 0; font-size: 12px; color: #1a1a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.recent-who { font-size: 11px; color: #888; }
.recent-time { font-size: 11px; color: #bbb; white-space: nowrap; }

@media (max-width: 1050px) {
  .body { grid-template-columns: 1fr; grid-template-areas: "focus" "settlement" "recent"; }
}

@media (max-width: 760px) {
  .settlement-flow { grid-template-columns: 1fr; gap: 8px; }
  .settlement-arrow { transform: rotate(90deg); }
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
</style>

<script>
const focusItems = [
  { type:'content', tag:'콘텐츠 승인', tagClass:'ft-content', title:'The Last Letter', meta:'NextWave Studios · 시놉시스 + 번역 완료', age:'48h 경과' },
  { type:'revision', tag:'수정 요청', tagClass:'ft-revision', title:'Reverse Cinderella', meta:'OneTake Media · 회차 수 변경', age:'28h 경과' },
  { type:'inquiry', tag:'구매의사', tagClass:'ft-inquiry', title:'Midnight Tokyo Drift', meta:'ShortReel (US) · PLATFORM', age:'4h 경과' },
  { type:'user', tag:'유저 승인', tagClass:'ft-user', title:'김은진 (NextWave Studios)', meta:'PRODUCTION · OWNER', age:'2h 경과' },
  { type:'content', tag:'콘텐츠 승인', tagClass:'ft-content', title:'Bloom Again', meta:'PaperLens · 번역 미완료', age:'1h 경과' },
  { type:'user', tag:'유저 승인', tagClass:'ft-user', title:'박소연 (Blueframe Studio)', meta:'PRODUCTION · MEMBER', age:'55m 경과' },
  { type:'revision', tag:'수정 요청', tagClass:'ft-revision', title:'Secret Contract', meta:'Studio M · 포스터 교체', age:'42m 경과' },
  { type:'inquiry', tag:'구매의사', tagClass:'ft-inquiry', title:'Love Reset', meta:'DramaBox · BUNDLE', age:'35m 경과' },
  { type:'content', tag:'콘텐츠 승인', tagClass:'ft-content', title:'After the Rain', meta:'Moonlight Pictures · 검토 요청', age:'22m 경과' },
  { type:'user', tag:'유저 승인', tagClass:'ft-user', title:'최민석 (PlayShort)', meta:'PLATFORM · OWNER', age:'18m 경과' },
  { type:'revision', tag:'수정 요청', tagClass:'ft-revision', title:'Seven Days', meta:'NextWave Studios · 러닝타임 변경', age:'12m 경과' },
  { type:'inquiry', tag:'구매의사', tagClass:'ft-inquiry', title:'My Boss Is a Vampire', meta:'ReelNow · TURNKEY', age:'8m 경과' },
];

let activeFocusFilter = 'all';
let activeFocusPage = 1;
const focusPageSize = 5;

const recentItems = [
  { type:'콘텐츠 승인', cls:'rt-approve', main:'Echo of Spring 승인 처리', who:'Lee Admin', time:'14:55' },
  { type:'유저 승인', cls:'rt-approve', main:'이준혁 (NextWave) 승인', who:'Lee Admin', time:'14:42' },
  { type:'거래 종료', cls:'rt-close', main:'Cinderella in Tokyo — ReelShort · $42,500', who:'Lee Admin', time:'12:18' },
  { type:'크레딧 충전', cls:'rt-credit', main:'BrightFrame +$12,000', who:'Lee Admin', time:'11:05' },
  { type:'컨펌 발송', cls:'rt-confirm', main:'Seven Suns → Viki 컨펌 메시지 발송', who:'Lee Admin', time:'10:30' },
  { type:'수정 거절', cls:'rt-reject', main:'The Last Letter 수정 요청 거절', who:'Lee Admin', time:'09:15' },
];

function renderFocus() {
  const list = document.getElementById('focus-list');
  const filteredItems = activeFocusFilter === 'all'
    ? focusItems
    : focusItems.filter(item => item.type === activeFocusFilter);

  if (filteredItems.length === 0) {
    list.innerHTML = `<div class="focus-empty"><i class="ti ti-circle-check"></i><span>모든 항목이 처리됐습니다</span></div>`;
    document.getElementById('focus-pagination').innerHTML = '';
    return;
  }
  const totalPages = Math.ceil(filteredItems.length / focusPageSize);
  activeFocusPage = Math.min(activeFocusPage, totalPages);
  const pageStart = (activeFocusPage - 1) * focusPageSize;
  list.innerHTML = filteredItems.slice(pageStart, pageStart + focusPageSize).map((item, i) => `
    <div class="focus-item">
      <span class="focus-num">${String(pageStart + i + 1).padStart(2, '0')}</span>
      <span class="focus-tag ${item.tagClass}">${item.tag}</span>
      <div class="focus-info">
        <div class="focus-title">${item.title}</div>
        <div class="focus-meta">${item.meta}</div>
      </div>
      <span class="focus-age">${item.age}</span>
      <button class="focus-btn">검토 →</button>
    </div>`).join('');
  renderFocusPagination(totalPages);
}

function renderFocusPagination(totalPages) {
  const pagination = document.getElementById('focus-pagination');
  pagination.innerHTML = `
    <button class="focus-page-btn" type="button" data-page="${activeFocusPage - 1}" ${activeFocusPage === 1 ? 'disabled' : ''} aria-label="이전 페이지"><i class="ti ti-chevron-left"></i></button>
    ${Array.from({ length: totalPages }, (_, index) => {
      const page = index + 1;
      return `<button class="focus-page-btn ${page === activeFocusPage ? 'active' : ''}" type="button" data-page="${page}" ${page === activeFocusPage ? 'aria-current="page"' : ''}>${page}</button>`;
    }).join('')}
    <button class="focus-page-btn" type="button" data-page="${activeFocusPage + 1}" ${activeFocusPage === totalPages ? 'disabled' : ''} aria-label="다음 페이지"><i class="ti ti-chevron-right"></i></button>
  `;
  pagination.querySelectorAll('[data-page]:not(:disabled)').forEach(button => {
    button.addEventListener('click', () => {
      activeFocusPage = Number(button.dataset.page);
      renderFocus();
    });
  });
}

function initQueueFilters() {
  const filters = document.querySelectorAll('.focus-filter[data-filter]');

  document.querySelectorAll('[data-count]').forEach(count => {
    const filter = count.dataset.count;
    count.textContent = filter === 'all'
      ? focusItems.length
      : focusItems.filter(item => item.type === filter).length;
  });

  filters.forEach(filter => {
    filter.addEventListener('click', () => {
      activeFocusFilter = filter.dataset.filter;
      activeFocusPage = 1;
      filters.forEach(item => {
        const active = item === filter;
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', String(active));
      });
      renderFocus();
    });
  });
}

function renderRecent() {
  const list = document.getElementById('recent-list');
  list.innerHTML = recentItems.map(r => `
    <div class="recent-item">
      <span class="rt ${r.cls}">${r.type}</span>
      <span class="recent-main">${r.main}</span>
      <div class="recent-right">
        <span class="recent-who">${r.who}</span>
        <span class="recent-time">${r.time}</span>
      </div>
    </div>`).join('');
}

initQueueFilters();
renderFocus();
renderRecent();
</script>
</body>
</html>
