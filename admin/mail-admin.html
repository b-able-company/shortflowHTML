<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>메일 발송 - Shortflow Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="stylesheet" href="admin-common.css?v=logo-left-20260715" />
<script src="admin-common.js?v=settlement-nav-unified-20260731"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #fff; display: flex; height: 100vh; overflow: hidden; font-size: 13px; color: #1a1a18; }

/* SIDEBAR */
.sb { width: 210px; min-width: 210px; background: #13130f; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; }
.sb-logo { padding: 16px 16px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
.sb-logo-main { color: #fff; font-size: 14px; font-weight: 600; }
.sb-logo-sub { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.nav { flex: 1; overflow-y: auto; padding: 6px 0; }
.nav-label { font-size: 9px; color: rgba(255,255,255,0.22); letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 16px 3px; }
.ni { display: flex; align-items: center; gap: 7px; padding: 6px 16px; font-size: 12.5px; color: rgba(255,255,255,0.42); cursor: pointer; border-left: 2px solid transparent; }
.ni:hover { color: rgba(255,255,255,0.7); }
.ni.active { color: #fff; border-left-color: #fff; background: rgba(255,255,255,0.04); }
.ni i { font-size: 13px; flex-shrink: 0; }
.sub .ni { padding-left: 36px; font-size: 12px; color: rgba(255,255,255,0.32); }
.sub .ni:hover { color: rgba(255,255,255,0.6); }
.sub .ni.active { color: #fff; }
.sb-foot { padding: 10px 16px; border-top: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 9px; }
.ava { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: 500; flex-shrink: 0; }
.uname { font-size: 11px; color: #fff; font-weight: 500; }
.uemail { font-size: 10px; color: rgba(255,255,255,0.28); margin-top: 1px; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: #fff; }
.topbar { height: 46px; background: #fff; border-bottom: 0; display: flex; align-items: center; padding: 0 18px; flex-shrink: 0; }
.topbar-title { font-size: 14px; font-weight: 600; }
.main > .body { padding: 0 !important; }
.body { --history-pane-width: 440px; flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) var(--history-pane-width); background: #fff; position: relative; }
.body::before { content: ""; position: absolute; top: 0; right: 0; left: 0; height: 1px; background: #e5e5e5; pointer-events: none; z-index: 3; }
.body::after { content: none; }
.compose-pane,
.history-pane { min-width: 0; height: 100%; overflow-y: auto; }
.compose-pane { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 0; align-items: start; padding: 38px 30px 54px 36px; background: #fff; }
.history-pane { padding: 0 0 24px; border-left: 1px solid #e5e5e5; background: #fff; scrollbar-width: none; }
.history-pane::-webkit-scrollbar { width: 0; height: 0; }
.page-head { min-height: 52px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.page-title { color: #1a1a18; font-size: 17px; font-weight: 600; }
.page-sub { margin-top: 4px; color: #999; font-size: 11.5px; line-height: 1.45; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-large { height: 40px; min-width: 148px; padding: 0 18px; border-radius: 9px; font-size: 12.5px; }

/* COMMON */
.section { margin-bottom: 24px; }
.section-title { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; color: #4f5965; font-size: 12px; font-weight: 600; }
.section-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #e85d2c; flex: 0 0 6px; }
.section-title .muted { margin-left: 2px; color: #aaa; font-size: 11px; font-weight: 400; }
.panel { border: 0.5px solid rgb(242, 242, 242); border-radius: 12px; background: #fff; overflow: hidden; }
.panel-body { padding: 14px; }
.muted-copy { color: #999; font-size: 11.5px; line-height: 1.5; }
.search-wrap { position: relative; min-width: 0; }
.search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #b8b8b8; font-size: 14px; pointer-events: none; }
.search-input { width: 100%; height: 34px; padding: 0 12px 0 32px; border: 0.5px solid #e5e5e5; border-radius: 8px; background: #fff; color: #1a1a18; outline: none; font-family: inherit; font-size: 12.5px; }
.search-input:focus { border-color: #aaa; }
.btn { height: 31px; padding: 0 12px; border: 0.5px solid #dedede; border-radius: 7px; background: #fff; color: #444; font-family: inherit; font-size: 11.5px; font-weight: 400; display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #fafafa; border-color: #cfcfcf; }
.btn-primary { background: #1a1a18; border-color: #1a1a18; color: #fff; }
.btn-primary:hover { background: #000; border-color: #000; }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-ghost { border-color: transparent; background: transparent; color: #777; }
.btn-ghost:hover { background: #f7f7f7; border-color: transparent; color: #333; }

/* MAIL STEPS */
.compose-step-tabs { display: grid; grid-template-columns: 1fr; align-content: start; align-self: start; gap: 4px; border: 0; border-radius: 0; overflow: visible; background: transparent; }
.compose-step-head { position: relative; width: 100%; min-height: 64px; padding: 12px 12px; border: 0; border-radius: 8px 0 0 8px; background: #fff; font-family: inherit; display: flex; align-items: center; gap: 9px; cursor: pointer; text-align: left; }
.compose-step-head:last-child { border-bottom: 0; }
.compose-step-head:hover { background: #fafafa; }
.compose-step-head.active { z-index: 1; background: #f3f3f3; }
.compose-step-head.locked { cursor: not-allowed; opacity: 0.42; }
.step-no { width: 20px; min-height: 17px; color: #aaa; display: inline-flex; align-self: center; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; line-height: 1.25; flex: 0 0 20px; }
.compose-step-head.done .step-no { color: #1a1a18; }
.compose-step-head.active .step-no { color: #1a1a18; font-weight: 500; }
.step-label { min-width: 0; flex: 1; display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, auto); align-items: center; gap: 12px; }
.step-name { min-width: 0; display: block; color: #333; font-size: 13px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: visible; text-overflow: clip; }
.step-desc { min-width: 0; display: block; color: #e85d2c; font-size: 11.5px; line-height: 1.25; text-align: right; white-space: normal; overflow: hidden; word-break: keep-all; }
.step-desc-main,
.step-desc-count { display: block; min-width: 0; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.compose-step-toggle { display: none; }
.compose-step-panel { display: none; grid-column: 2; grid-row: 1; align-self: start; min-height: 256px; margin: 0; border: 0.5px solid rgb(242, 242, 242); border-radius: 0 4px 4px 0; background: #fff; overflow: hidden; }
.compose-step-panel.active { display: block; }
.compose-step-panel.active[data-compose-step="2"] { position: relative; overflow: visible; margin-bottom: 58px; }
.compose-step-panel.active[data-compose-step="3"] { position: relative; overflow: visible; margin-bottom: 58px; }
.compose-step-panel.active[data-compose-step="4"] { position: relative; overflow: visible; margin-bottom: 58px; }
.compose-step-body { padding: 14px; }
.compose-nav { display: none; }
.compose-nav-copy { color: #999; font-size: 11.5px; }
.compose-nav-actions { display: flex; align-items: center; gap: 8px; }

/* MAIL TYPE */
.mail-type-step-body { min-height: 254px; display: flex; align-items: stretch; justify-content: center; }
.type-group { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); justify-content: center; gap: 14px; }
.type-btn { width: 100%; min-height: 100%; padding: 0 18px; border: 0.5px solid #e3e3e3; border-radius: 14px; background: #fff; color: #1a1a18; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; transition: background .14s ease, border-color .14s ease, color .14s ease; }
.type-btn:hover { background: #fafafa; border-color: #d7d7d7; }
.type-btn:active { background: #eeeeee; border-color: #d0d0d0; }
.type-btn.active { background: #eeeeee; border-color: #d7d7d7; color: #1a1a18; }
.type-name { color: inherit; font-size: 15.5px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-panel-actions { margin-top: auto; padding-top: 14px; display: flex; justify-content: flex-end; }
.compose-step-panel[data-compose-step="2"] .step-panel-actions,
.compose-step-panel[data-compose-step="3"] .step-panel-actions { position: absolute; right: 0; bottom: -56px; padding-top: 0; }
#source-next-btn,
#platform-next-btn { height: 42px; min-width: 122px; padding: 0 26px; border-radius: 999px; border-color: #1d1d1f; background: #1d1d1f; font-size: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); transition: background .16s ease, border-color .16s ease, transform .12s ease, box-shadow .16s ease; }
#source-next-btn:hover:not(:disabled),
#platform-next-btn:hover:not(:disabled) { background: #000; border-color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.12); }
#source-next-btn:active:not(:disabled),
#platform-next-btn:active:not(:disabled) { transform: scale(0.98); }

/* SOURCE LIST */
.source-tools,
.platform-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.source-list { max-height: 252px; overflow: auto; border: 0.5px solid rgb(242, 242, 242); border-radius: 10px; background: #fff; }
.compose-step-panel.active[data-compose-step="2"] .source-list.content-source-list { height: auto; max-height: none; overflow: visible; }
.source-table-head { display: grid; align-items: center; min-height: 34px; border-bottom: 0.5px solid rgb(242, 242, 242); color: #aaa; font-size: 10.5px; }
.source-head-cell { min-width: 0; padding: 8px 12px; border-right: 0.5px solid rgb(242, 242, 242); white-space: nowrap; }
.source-head-cell:last-child { border-right: 0; }
.source-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) 92px 112px; align-items: center; min-height: 66px; border-bottom: 0.5px solid rgb(242, 242, 242); cursor: pointer; }
.source-row:last-child { border-bottom: 0; }
.source-row:hover { background: #fcfcfc; }
.source-row.selected { background: #f7f7f7; }
.source-list.content-source-list .source-table-head,
.source-list.content-source-list .source-row { grid-template-columns: 42px minmax(230px, 1.25fr) minmax(130px, 0.85fr) 88px 108px; min-width: 692px; }
.source-list.content-source-list .source-row { min-height: 64px; }
.source-cell { min-width: 0; min-height: 100%; padding: 9px 12px; border-right: 0.5px solid rgb(242, 242, 242); display: flex; align-items: center; }
.source-cell:last-child { border-right: 0; }
.source-check-cell { justify-content: center; padding: 0 10px; }
.source-check { width: 18px; height: 18px; border: 1px solid #d2d2d2; border-radius: 8px; background: #fff; color: transparent; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
.source-row.selected .source-check { border-color: #1a1a18; background: #1a1a18; color: #fff; }
.source-check i { font-size: 12px; font-weight: 700; }
.source-content-cell { gap: 10px; }
.source-poster { width: 44px; height: 44px; border-radius: 7px; background: linear-gradient(145deg, #f1f1f1, #dadada); color: rgba(255,255,255,0.92); font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); overflow: hidden; }
.source-poster.p1 { background: linear-gradient(150deg, #30343f 0%, #6d8a93 52%, #e6c7a9 100%); }
.source-poster.p2 { background: linear-gradient(150deg, #503148 0%, #ba7280 54%, #f0cfc5 100%); }
.source-poster.p3 { background: linear-gradient(150deg, #181b24 0%, #405f7d 48%, #d95e38 100%); }
.source-poster.p4 { background: linear-gradient(150deg, #36543c 0%, #8aad7c 55%, #efe3bf 100%); }
.source-poster.p5 { background: linear-gradient(150deg, #413b5f 0%, #8978b7 55%, #f2c9d1 100%); }
.source-poster.p6 { background: linear-gradient(150deg, #24394f 0%, #4f97a3 52%, #eadb9d 100%); }
.source-poster.p7 { background: linear-gradient(150deg, #46312a 0%, #946a4d 52%, #ebc66d 100%); }
.source-poster.p8 { background: linear-gradient(150deg, #25272f 0%, #4f6f5f 50%, #d7dfcc 100%); }
.source-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.source-mark { width: 30px; height: 30px; border-radius: 6px; background: #f2f2f2; color: #999; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.source-title { color: #1a1a18; font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-sub { margin-top: 2px; color: #aaa; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-meta { color: #777; font-size: 11.5px; white-space: nowrap; }
.source-status { width: fit-content; min-height: 22px; padding: 0 8px; border-radius: 999px; background: #f7f7f7; border: 0.5px solid #e5e5e5; color: #666; display: inline-flex; align-items: center; font-size: 10.5px; white-space: nowrap; }
.source-pagination { min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
.source-pagination .page-btn { min-width: 22px; height: 24px; padding: 0 4px; border: 0; border-radius: 0; background: transparent; color: #aaa; font-size: 12px; line-height: 1; }
.source-pagination .page-btn:hover { background: transparent; border-color: transparent; color: #555; }
.source-pagination .page-btn.active { border-color: transparent; background: transparent; color: #1a1a18; font-weight: 500; }

/* PLATFORM TABLE */
.platform-summary { display: flex; align-items: center; gap: 8px; margin-left: auto; color: #888; font-size: 11.5px; }
.platform-table { border: 0.5px solid rgb(242, 242, 242); border-radius: 12px; overflow: hidden; background: #fff; }
.platform-table-scroll { width: 100%; overflow-x: auto; }
.platform-head,
.platform-row { display: grid; grid-template-columns: 42px minmax(200px, 1fr) 110px; align-items: center; min-width: 400px; border-bottom: 0.5px solid rgb(242, 242, 242); }
.platform-head { min-height: 32px; color: #a1a1a1; font-size: 10.5px; font-weight: 400; }
.platform-row { min-height: 38px; cursor: pointer; }
.platform-row:last-child { border-bottom: 0; }
.platform-row:hover { background: #fcfcfc; }
.platform-row.checked { background: #fafafa; }
.platform-cell { min-width: 0; min-height: 100%; padding: 6px 12px; border-right: 0.5px solid rgb(242, 242, 242); display: flex; align-items: center; }
.platform-cell:last-child { border-right: 0; }
.platform-check { width: 18px; height: 18px; border: 1px solid #d2d2d2; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.platform-row.checked .platform-check { background: #1a1a18; border-color: #1a1a18; }
.platform-check i { display: none; color: #fff; font-size: 12px; font-weight: 700; line-height: 1; }
.platform-row.checked .platform-check i { display: block; }
.platform-name { color: #1a1a18; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plain-text { color: #555; font-size: 11.5px; white-space: nowrap; }
.platform-pagination { min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
.platform-pagination .page-btn { min-width: 22px; height: 24px; padding: 0 4px; border: 0; border-radius: 0; background: transparent; color: #aaa; font-size: 12px; line-height: 1; }
.platform-pagination .page-btn:hover { background: transparent; border-color: transparent; color: #555; }
.platform-pagination .page-btn.active { border-color: transparent; background: transparent; color: #1a1a18; font-weight: 500; }
.empty-state { padding: 28px 12px; color: #bbb; font-size: 12px; text-align: center; }

/* PREVIEW */
.preview-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.mail-preview { min-height: 248px; border: 0.5px solid rgb(242, 242, 242); border-radius: 12px; overflow: hidden; background: #fff; }
.preview-body { padding: 20px 16px; background: #f5f5f5; color: #333; font-size: 12.5px; line-height: 1.7; }
.email-template-card { max-width: 520px; margin: 0 auto; padding: 38px 34px; background: #fff; }
.email-template-title { margin: 0 0 14px; color: #111; font-size: 18px; font-weight: 700; line-height: 1.3; }
.email-template-copy { margin: 0 0 28px; color: #333; font-size: 12.5px; line-height: 1.8; }
.email-template-copy strong { font-weight: 700; color: #111; }
.email-template-link { display: inline-block; margin-bottom: 34px; color: #ff773d; font-size: 12.5px; font-weight: 600; text-decoration: none; }
.email-template-foot { border-top: 1px solid #eee; padding-top: 18px; }
.email-template-note { margin: 0 0 8px; color: #aaa; font-size: 11px; line-height: 1.5; }
.email-template-brand { margin: 0; color: #555; font-size: 12px; font-weight: 700; }
.preview-side { min-width: 0; }
.review-row { min-height: 38px; padding: 9px 12px; border-bottom: 0.5px solid rgb(242, 242, 242); display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.review-row:last-child { border-bottom: 0; }
.review-key { color: #aaa; font-size: 11px; min-width: 0; white-space: nowrap; }
.review-val { color: #333; font-size: 12px; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-val.multiline { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.55; }
.send-bar { margin-top: 18px; min-height: 52px; padding: 0; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.compose-step-panel[data-compose-step="4"] .send-bar { position: absolute; right: 0; bottom: -56px; margin-top: 0; }
#send-btn { height: 42px; min-width: 126px; padding: 0 24px; border-radius: 999px; font-size: 11.5px; }
.send-success { display: none; margin-top: 10px; padding: 12px 14px; border-radius: 9px; background: #EAF3DE; color: #3B6D11; font-size: 12px; }
.send-success.show { display: block; }

/* CONFIRM */
.mail-confirm-backdrop { position: fixed; inset: 0; z-index: 420; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,0.08); }
.mail-confirm-backdrop.show { display: flex; }
.mail-confirm-dialog { width: min(322px, 100%); overflow: hidden; border: 0.5px solid rgba(0,0,0,0.08); border-radius: 18px; background: rgba(255,255,255,0.96); text-align: center; }
.mail-confirm-body { padding: 24px 22px 20px; }
.mail-confirm-icon { width: 54px; height: 54px; margin: 0 auto 15px; border-radius: 16px; background: #fff3ed; color: #e85d2c; display: flex; align-items: center; justify-content: center; font-size: 25px; }
.mail-confirm-icon.hidden { display: none; }
.mail-confirm-title { color: #1a1a18; font-size: 15px; font-weight: 600; line-height: 1.35; }
.mail-confirm-copy { margin-top: 8px; color: #777d86; font-size: 12px; line-height: 1.5; white-space: pre-line; }
.mail-confirm-list { max-height: 190px; margin-top: 14px; border: 0.5px solid #eeeeee; border-radius: 10px; background: #fff; overflow: auto; text-align: left; }
.mail-confirm-list-row { min-height: 34px; padding: 8px 11px; border-bottom: 0.5px solid #f1f1f1; color: #333; font-size: 12.5px; line-height: 1.35; }
.mail-confirm-list-row:last-child { border-bottom: 0; }
.mail-confirm-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 0.5px solid #e7e7e7; }
.mail-confirm-btn { height: 44px; border: 0; background: transparent; color: #4f5660; font-family: inherit; font-size: 13px; cursor: pointer; }
.mail-confirm-btn + .mail-confirm-btn { border-left: 0.5px solid #e7e7e7; }
.mail-confirm-btn:hover { background: rgba(0,0,0,0.035); }
.mail-confirm-btn.primary { color: #007aff; font-weight: 600; }

/* HISTORY */
.history-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding: 18px 0 0 18px; }
.history-title { display: flex; align-items: center; gap: 7px; color: #4f5965; font-size: 12px; font-weight: 600; }
.history-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #e85d2c; flex: 0 0 6px; }
.history-tools { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 7px; align-items: center; padding-right: 18px; }
.history-type-filter {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 34px;
  padding: 0 31px 0 10px;
  border: 0.5px solid #e5e5e5;
  border-radius: 8px;

let selectedMailType = null;
let selectedSourceId = null;
let selectedSourceIds = new Set();
let draftSourceIds = new Set();
let checkedPlatforms = new Set();
let sourceQuery = '';
let platformQuery = '';
let historyQuery = '';
let historyTypeFilter = '';
let selectedHistoryId = null;
let mailConfirmHandler = null;
let currentView = 'history';
let historyPage = 1;
let currentMailStep = 1;
let sourcePage = 1;
let platformPage = 1;
const historyPageSize = 15;
const sourcePageSize = 10;
const platformPageSize = 15;
const maxContentSelection = 10;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[char]));
}

function currentSources() {
  return selectedMailType ? sourceData[selectedMailType] : [];
}

function currentSource() {
  return currentSources().find(item => item.id === selectedSourceId);
}

function selectedSources() {
  const sources = currentSources();
  const ids = selectedSourceIds.size
    ? selectedSourceIds
    : (selectedSourceId ? new Set([selectedSourceId]) : new Set());
  return sources.filter(item => ids.has(item.id));
}

function hasSelectedSources() {
  return selectedSources().length > 0;
}

function draftSources() {
  const sources = currentSources();
  return sources.filter(item => draftSourceIds.has(item.id));
}

function hasDraftSources() {
  return draftSources().length > 0;
}

function summarizeSources(sources) {
  if (!sources.length) return '';
  return sources.length > 1 ? `${sources[0].title} 외 ${sources.length - 1}개` : sources[0].title;
}

function sourceUrl(source) {
  const path = selectedMailType === 'collaboration' ? 'collaboration' : 'content';
  return `https://shortflow.io/${path}/${source.id}`;
}

function selectedSourceSummary() {
  return summarizeSources(selectedSources());
}

function syncPrimarySourceId() {
  const ids = selectedSourceIds.size ? selectedSourceIds : new Set();
  selectedSourceId = currentSources().find(item => ids.has(item.id))?.id || null;
}

function commitDraftSourceSelection() {
  if (!hasDraftSources()) return false;
  selectedSourceIds = new Set(draftSourceIds);
  syncPrimarySourceId();
  checkedPlatforms.clear();
  platformQuery = '';
  platformPage = 1;
  document.getElementById('platform-search').value = '';
  return true;
}

function getSentPlatformIds() {
  if (!selectedMailType) return [];
  const ids = selectedSources().map(source => source.id);
  return [...new Set(ids.flatMap(id => sentHistory[selectedMailType]?.[id] || []))];
}

function renderView() {
  document.getElementById('history-view').classList.add('active');
  document.getElementById('compose-view').classList.add('active');
}

function openComposeView() {
  currentView = 'compose';
  currentMailStep = 1;
  selectedHistoryId = null;
  document.getElementById('send-success').classList.remove('show');
  renderView();
  renderHistory();
  renderComposeStep();
}

function openHistoryView() {
  currentView = 'history';
  renderView();
  renderHistory();
}

function setMailType(type) {
  selectedMailType = type;
  selectedSourceId = null;
  selectedSourceIds.clear();
  draftSourceIds.clear();
  checkedPlatforms.clear();
  sourceQuery = '';
  platformQuery = '';
  currentMailStep = 2;
  sourcePage = 1;
  platformPage = 1;
  document.getElementById('source-search').value = '';
  document.getElementById('platform-search').value = '';
  renderAll();
}

function filterSources(value) {
  sourceQuery = value.trim().toLowerCase();
  sourcePage = 1;
  renderSources();
  renderStepper();
  renderPreview();
}

function filterPlatforms(value) {
  platformQuery = value.trim().toLowerCase();
  platformPage = 1;
  renderPlatforms();
}

function filterHistory(value) {
  historyQuery = value.trim().toLowerCase();
  historyPage = 1;
  selectedHistoryId = null;
  renderHistory();
}

function changeHistoryTypeFilter(value) {
  historyTypeFilter = value;
  historyPage = 1;
  selectedHistoryId = null;
  renderHistory();
}

function selectSource(id) {
  if (selectedMailType === 'content') {
    if (draftSourceIds.has(id)) draftSourceIds.delete(id);
    else {
      if (draftSourceIds.size >= maxContentSelection) return;
      draftSourceIds.add(id);
    }
  } else {
    draftSourceIds = new Set([id]);
  }
  checkedPlatforms.clear();
  platformQuery = '';
  platformPage = 1;
  currentMailStep = 2;
  document.getElementById('platform-search').value = '';
  renderAll();
}

function clearSourceSelection() {
  selectedSourceId = null;
  selectedSourceIds.clear();
  draftSourceIds.clear();
  checkedPlatforms.clear();
  platformPage = 1;
  currentMailStep = 2;
  renderAll();
}

function isPlatformSent(platform) {
  const sent = getSentPlatformIds();
  return sent.includes(platform.id) || Boolean(getPlatformSentDate(platform));
}

function visiblePlatforms() {
  return platforms.filter(platform => {
    const keyword = platform.name.toLowerCase();
    return !platformQuery || keyword.includes(platformQuery);
  });
}

function togglePlatform(id) {
  if (!hasSelectedSources()) return;
  if (checkedPlatforms.has(id)) checkedPlatforms.delete(id);
  else checkedPlatforms.add(id);
  currentMailStep = 3;
  renderPlatforms();
  renderPreview();
}

function selectAllPlatforms() {
  if (!hasSelectedSources()) return;
  visiblePlatforms().forEach(platform => checkedPlatforms.add(platform.id));
  currentMailStep = 3;
  renderPlatforms();
  renderPreview();
}

function renderTypeButtons() {
  const group = document.getElementById('mail-type-group');
  group.innerHTML = Object.entries(mailTypes).map(([key, type]) => `
    <button class="type-btn ${currentMailStep !== 1 && selectedMailType === key ? 'active' : ''}" type="button" onclick="setMailType('${key}')">
      <span class="type-name">${type.label}</span>
    </button>
  `).join('');
}

function renderStepper() {
  renderComposeStep();
}

function getMaxMailStep() {
  if (!selectedMailType) return 1;
  if (!hasSelectedSources()) return 2;
  if (!checkedPlatforms.size) return 3;
  return 4;
}

function normalizeMailStep() {
  currentMailStep = Math.min(Math.max(1, currentMailStep), getMaxMailStep());
}

function canEnterMailStep(step) {
  if (step === 1) return true;
  if (step === 2) return Boolean(selectedMailType);
  if (step === 3) return hasSelectedSources();
  return Boolean(hasSelectedSources() && checkedPlatforms.size > 0);
}

function getMailStepNotice() {
  if (currentMailStep === 1) return '메일 유형을 선택한 뒤 다음으로 이동합니다.';
  if (currentMailStep === 2) return hasSelectedSources() ? '선택한 자료로 다음 단계 진행 가능' : '발송할 자료를 선택해주세요.';
  if (currentMailStep === 3) return checkedPlatforms.size ? `${checkedPlatforms.size}개 플랫폼사 선택됨` : '발송할 플랫폼사를 하나 이상 선택해주세요.';
  return '미리보기 확인 후 메일을 발송합니다.';
}

function truncateStepSummary(value, maxLength = 12) {
  const text = String(value || '').trim();
  return text.length > maxLength ? `${text.slice(0, maxLength)}...` : text;
}

function renderComposeStep() {
  normalizeMailStep();
  const sourceSummary = selectedSourceSummary();
  const selectedPlatformNames = [...checkedPlatforms]
    .map(id => platforms.find(platform => platform.id === id)?.name)
    .filter(Boolean);
  document.getElementById('mail-type-summary').textContent = selectedMailType ? mailTypes[selectedMailType].label : '';
  const sourceSummaryEl = document.getElementById('source-summary');
  const selectedSourceItems = selectedSources();
  sourceSummaryEl.innerHTML = selectedSourceItems.length > 1
    ? `<span class="step-desc-main">${escapeHtml(selectedSourceItems[0].title)}</span><span class="step-desc-count">외 ${selectedSourceItems.length - 1}개</span>`
    : escapeHtml(sourceSummary);
  document.getElementById('platform-summary').textContent = selectedPlatformNames.length ? `${selectedPlatformNames.length}개` : '';
  document.getElementById('preview-summary').textContent = '';
  const sourceNextBtn = document.getElementById('source-next-btn');
  const platformNextBtn = document.getElementById('platform-next-btn');
  if (sourceNextBtn) sourceNextBtn.disabled = !hasDraftSources();
  if (platformNextBtn) platformNextBtn.disabled = !checkedPlatforms.size;
  document.querySelectorAll('.compose-step-head').forEach(button => {
    const step = Number(button.dataset.composeStep);
    button.classList.toggle('active', step === currentMailStep);
    button.classList.toggle('done', isMailStepDone(step));
    button.classList.toggle('locked', !canEnterMailStep(step));
  });
  document.querySelectorAll('.compose-step-panel').forEach(panel => {
    const step = Number(panel.dataset.composeStep);
    panel.classList.toggle('active', step === currentMailStep);
  });
  document.getElementById('compose-nav').innerHTML = '';
}

function isMailStepDone(step) {
  if (step === 1) return Boolean(selectedMailType);
  if (step === 2) return hasSelectedSources();
  if (step === 3) return checkedPlatforms.size > 0;
  return checkedPlatforms.size > 0;
}

function setMailStep(step) {
  if (!canEnterMailStep(step)) return;
  currentMailStep = step;
  renderStepper();
  renderComposeStep();
  renderPreview();
}

function handleMailStepBack() {
  if (currentMailStep === 1) {
    openHistoryView();
    return;
  }
  setMailStep(currentMailStep - 1);
}

function handleMailStepNext() {
  if (currentMailStep === 2) {
    openSourceConfirm();
    return;
  }
  if (!canEnterMailStep(currentMailStep + 1)) return;
  setMailStep(currentMailStep + 1);
}

function openSourceConfirm() {
  const sources = draftSources();
  if (!sources.length) return;
  openMailConfirm({
    title: '선택한 콘텐츠를 확인해주세요',
    message: `${sources.length}개 콘텐츠를 선택했어요.`,
    confirmLabel: '다음',
    showIcon: false,
    extraHtml: `
      <div class="mail-confirm-list">
        ${sources.map(source => `<div class="mail-confirm-list-row">${escapeHtml(source.title)}</div>`).join('')}
      </div>
    `,
    onConfirm: () => {
      if (!commitDraftSourceSelection()) return;
      setMailStep(3);
      renderPlatforms();
    },
  });
}

function renderSources() {
  const type = mailTypes[selectedMailType];
  document.getElementById('source-section-title').textContent = type ? type.sourceLabel : '자료 선택';
  document.getElementById('source-search').placeholder = type ? type.searchPlaceholder : '검색';
  const list = document.getElementById('source-list');
  const pagination = document.getElementById('source-pagination');
  list.classList.toggle('content-source-list', selectedMailType === 'content');
  if (!type) {
    list.innerHTML = '<div class="empty-state">메일 유형을 먼저 선택해주세요</div>';
    pagination.innerHTML = '';
    return;
  }
  const filtered = currentSources().filter(item => {
    const text = item.title.toLowerCase();
    return !sourceQuery || text.includes(sourceQuery);
  });
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">조건에 맞는 자료가 없습니다</div>';
    pagination.innerHTML = '';
    return;
  }
  if (selectedMailType === 'content') {
    const totalPages = Math.max(1, Math.ceil(filtered.length / sourcePageSize));
    sourcePage = Math.min(Math.max(1, sourcePage), totalPages);
    const start = (sourcePage - 1) * sourcePageSize;
    const pageRows = filtered.slice(start, start + sourcePageSize);
    list.innerHTML = `
      <div class="source-table-head">
        <div class="source-head-cell"></div>
        <div class="source-head-cell">콘텐츠</div>
        <div class="source-head-cell">제작사명</div>
        <div class="source-head-cell">제작연도</div>
        <div class="source-head-cell">업로드일</div>
      </div>
      ${pageRows.map(item => `
        <div class="source-row ${draftSourceIds.has(item.id) ? 'selected' : ''}" onclick="selectSource(${item.id})">
          <div class="source-cell source-check-cell"><span class="source-check" aria-hidden="true"><i class="ti ti-check"></i></span></div>
          <div class="source-cell source-content-cell">${sourcePosterHtml(item)}<div class="source-title">${escapeHtml(item.title)}</div></div>
          <div class="source-cell"><span class="source-meta">${escapeHtml(item.company)}</span></div>
          <div class="source-cell"><span class="source-meta">${escapeHtml(item.year)}</span></div>
          <div class="source-cell"><span class="source-meta">${escapeHtml(item.uploadedAt)}</span></div>
        </div>
      `).join('')}
    `;
    renderSourcePagination(filtered.length, totalPages);
    return;
  }
  pagination.innerHTML = '';
  list.innerHTML = filtered.map(item => `
    <div class="source-row ${draftSourceIds.has(item.id) ? 'selected' : ''}" onclick="selectSource(${item.id})">
      <div class="source-cell"><div class="source-mark">${escapeHtml(item.mark)}</div></div>
      <div class="source-cell">
        <div class="source-title">${escapeHtml(item.title)}</div>
        <div class="source-sub">${escapeHtml(item.company)}</div>
      </div>
      <div class="source-cell"><span class="source-meta">${escapeHtml(item.format)}</span></div>
      <div class="source-cell"><span class="source-meta">${escapeHtml(item.status)}</span></div>
    </div>
  `).join('');
}

function sourcePosterHtml(item) {
  const fallback = escapeHtml(item.mark);
  const image = item.image
    ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)} 포스터">`
    : fallback;
  return `<div class="source-poster ${escapeHtml(item.poster || 'p1')}">${image}</div>`;
}

function renderSourcePagination(total, totalPages) {
  const pagination = document.getElementById('source-pagination');
  pagination.innerHTML = `
    ${Array.from({ length: totalPages }, (_, index) => {
      const page = index + 1;
      return `<button class="page-btn ${sourcePage === page ? 'active' : ''}" type="button" onclick="setSourcePage(${page})">${page}</button>`;
    }).join('')}
  `;
}

function setSourcePage(page) {
  const total = currentSources().filter(item => {
    const text = item.title.toLowerCase();
    return !sourceQuery || text.includes(sourceQuery);
  }).length;
  const totalPages = Math.max(1, Math.ceil(total / sourcePageSize));
  sourcePage = Math.min(Math.max(1, page), totalPages);
  renderSources();
}

function renderPlatforms() {
  const table = document.getElementById('platform-table');
  const pagination = document.getElementById('platform-pagination');
  if (!hasSelectedSources()) {
    table.innerHTML = '<div class="empty-state">먼저 발송할 자료를 선택해주세요</div>';
    if (pagination) pagination.innerHTML = '';
    return;
  }
  const rows = visiblePlatforms();
  const totalPages = Math.max(1, Math.ceil(rows.length / platformPageSize));
  platformPage = Math.min(Math.max(1, platformPage), totalPages);
  const start = (platformPage - 1) * platformPageSize;
  const pageRows = rows.slice(start, start + platformPageSize);
  table.innerHTML = `
    <div class="platform-table-scroll">
      <div class="platform-head">
        <div class="platform-cell"></div>
        <div class="platform-cell">플랫폼사명</div>
        <div class="platform-cell">지역</div>
      </div>
      ${pageRows.length ? pageRows.map(platform => {
        const isChecked = checkedPlatforms.has(platform.id);
        return `
          <div class="platform-row ${isChecked ? 'checked' : ''}" onclick="togglePlatform(${platform.id})">
            <div class="platform-cell"><div class="platform-check"><i class="ti ti-check"></i></div></div>
            <div class="platform-cell"><div class="platform-name">${escapeHtml(platform.name)}</div></div>
            <div class="platform-cell"><span class="plain-text">${escapeHtml(platform.region)}</span></div>
          </div>
        `;
      }).join('') : '<div class="empty-state">조건에 맞는 플랫폼사가 없습니다</div>'}
    </div>
  `;
  renderPlatformPagination(rows.length, totalPages);
}

function renderPlatformPagination(total, totalPages) {
  const pagination = document.getElementById('platform-pagination');
  if (!pagination) return;
  pagination.innerHTML = total ? `
    ${Array.from({ length: totalPages }, (_, index) => {
      const page = index + 1;
      return `<button class="page-btn ${platformPage === page ? 'active' : ''}" type="button" onclick="setPlatformPage(${page})">${page}</button>`;
    }).join('')}
  ` : '';
}

function setPlatformPage(page) {
  const totalPages = Math.max(1, Math.ceil(visiblePlatforms().length / platformPageSize));
  platformPage = Math.min(Math.max(1, page), totalPages);
  renderPlatforms();
}

function getPlatformSentDate(platform) {
  const titles = selectedSources().map(source => source.title);
  if (!titles.length) return '';
  const item = history.find(row =>
    row.type === selectedMailType &&
    titles.some(title => row.target === title || row.target.startsWith(`${title} 외 `)) &&
    row.platforms.includes(platform.name)
  );
  return item ? item.date.split(' ')[0] : '';
}

function renderPreview() {
  const sources = selectedSources();
  const source = sources[0];
  const type = mailTypes[selectedMailType];
  const selectedPlatforms = [...checkedPlatforms]
    .map(id => platforms.find(platform => platform.id === id))
    .filter(Boolean);
  const selectedPlatformNames = selectedPlatforms.map(platform => platform.name);
  const canSend = Boolean(sources.length && selectedPlatformNames.length);
  const recipientName = selectedPlatforms.length
    ? `${selectedPlatforms[0].manager}${selectedPlatforms.length > 1 ? ` 외 ${selectedPlatforms.length - 1}명` : ''}`
    : '';
  const sourceSummary = selectedSourceSummary();
  const previewSource = source ? { ...source, title: sourceSummary } : null;
  document.getElementById('preview-body').innerHTML = previewSource && type ? `
    <div class="email-template-card">
      <h1 class="email-template-title">새로운 콘텐츠를 소개합니다</h1>
      <p class="email-template-copy">
        안녕하세요 <strong>사용자</strong>님,<br>
        새로운 콘텐츠 <strong>콘텐츠제목</strong>이 Shortflow에 등록되었습니다.<br>
        아래 버튼을 눌러 콘텐츠를 확인해보세요.
      </p>
      <a class="email-template-link" href="#">콘텐츠 확인하기 →</a>
      <div class="email-template-foot">
        <p class="email-template-note">본 메일은 발신전용이며, 문의사항은 Shortflow 서비스를 통해 접수해주세요.</p>
        <p class="email-template-brand">Shortflow</p>
      </div>
    </div>
  ` : '<div class="empty-state">메일 유형과 발송 대상을 선택하면 템플릿 미리보기를 확인할 수 있습니다</div>';
  document.getElementById('send-btn').disabled = !canSend;
  renderStepper();
  renderComposeStep();
}

function sendMail() {
  const sources = selectedSources();
  if (!sources.length || !checkedPlatforms.size) return;
  const selected = [...checkedPlatforms]
    .map(id => platforms.find(platform => platform.id === id))
    .filter(Boolean);
  openMailConfirm({
    title: '메일을 발송할까요?',
    message: `"${selectedSourceSummary()}"\n선택한 ${selected.length}개 플랫폼사에 메일이 발송됩니다.`,
    confirmLabel: '발송',
    extraHtml: `
      <div class="mail-confirm-list">
        ${selected.map(platform => `<div class="mail-confirm-list-row">${escapeHtml(platform.name)}</div>`).join('')}
      </div>
    `,
    onConfirm: performSendMail,
  });
}

function openMailConfirm({ title, message, confirmLabel = '발송', extraHtml = '', showIcon = true, onConfirm }) {
  document.getElementById('mail-confirm-title').textContent = title || '메일을 발송할까요?';
  document.getElementById('mail-confirm-message').textContent = message || '';
  document.getElementById('mail-confirm-extra').innerHTML = extraHtml || '';
  document.getElementById('mail-confirm-submit').textContent = confirmLabel;
  document.querySelector('.mail-confirm-icon')?.classList.toggle('hidden', !showIcon);
  mailConfirmHandler = typeof onConfirm === 'function' ? onConfirm : null;
  document.getElementById('mail-confirm-modal')?.classList.add('show');
}

function closeMailConfirm(event) {
  event?.stopPropagation?.();
  mailConfirmHandler = null;
  document.getElementById('mail-confirm-extra').innerHTML = '';
  document.getElementById('mail-confirm-submit').textContent = '발송';
  document.querySelector('.mail-confirm-icon')?.classList.remove('hidden');
  document.getElementById('mail-confirm-modal')?.classList.remove('show');
}

function submitMailConfirm() {
  const handler = mailConfirmHandler;
  mailConfirmHandler = null;
  document.getElementById('mail-confirm-extra').innerHTML = '';
  document.getElementById('mail-confirm-submit').textContent = '발송';
  document.querySelector('.mail-confirm-icon')?.classList.remove('hidden');
  document.getElementById('mail-confirm-modal')?.classList.remove('show');
  if (typeof handler === 'function') handler();
}

function performSendMail() {
  const sources = selectedSources();
  const source = sources[0];
  if (!source || !checkedPlatforms.size) return;
  const type = mailTypes[selectedMailType];
  const selected = [...checkedPlatforms]
    .map(id => platforms.find(platform => platform.id === id))
    .filter(Boolean);
  const sourceSummary = selectedSourceSummary();
  const previewSource = { ...source, title: sourceSummary };
  const now = new Date();
  const pad = value => String(value).padStart(2, '0');
  const date = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const newHistoryId = Date.now();
  history.unshift({
    id: newHistoryId,
    date,
    sender: '김관리자',
    type: selectedMailType,
    target: sourceSummary,
    company: sources.length > 1 ? `${sources.length}개 콘텐츠` : source.company,
    contents: sources.map(item => ({
      id: item.id,
      title: item.title,
      url: sourceUrl(item),
    })),
    platforms: selected.map(platform => platform.name),
    success: selected.length,
    failed: 0,
    subject: type.subject(previewSource),
  });
  sources.forEach(item => {
    if (!sentHistory[selectedMailType][item.id]) sentHistory[selectedMailType][item.id] = [];
    selected.forEach(platform => {
      if (!sentHistory[selectedMailType][item.id].includes(platform.id)) {
        sentHistory[selectedMailType][item.id].push(platform.id);
      }
    });
  });
  selectedSourceId = null;
  selectedSourceIds.clear();
  draftSourceIds.clear();
  checkedPlatforms.clear();
  selectedHistoryId = newHistoryId;
  historyQuery = '';
  historyTypeFilter = '';
  historyPage = 1;
  document.getElementById('send-success').textContent = `${selected.length}개 플랫폼사에 메일을 발송했습니다.`;
  document.getElementById('send-success').classList.add('show');
  renderAll();
}

function filteredHistoryRows() {
  return history.filter(item => {
    const typeMatches = !historyTypeFilter || item.type === historyTypeFilter;
    const searchable = [historyTargetLabel(item), ...(historyContentNames(item)), ...(item.platforms || [])].join(' ').toLowerCase();
    const keywordMatches = !historyQuery || searchable.includes(historyQuery);
    return typeMatches && keywordMatches;
  });
}

function historyContentNames(item) {
  if (Array.isArray(item.contents) && item.contents.length) {
    return item.contents.map(content => content.title).filter(Boolean);
  }
  if (Array.isArray(item.contentTitles) && item.contentTitles.length) return item.contentTitles;
  return item.target ? [item.target] : [];
}

function historyTargetLabel(item) {
  const names = historyContentNames(item);
  if (!names.length) return item.target || '';
  return names.length > 1 ? `${names[0]} 외 ${names.length - 1}개` : names[0];
}

function historyListTypeLabel(type) {
  return type === 'collaboration' ? '기획안' : '콘텐츠';
}

function renderHistory() {
  const table = document.getElementById('history-table');
  const searchInput = document.getElementById('history-search');
  const typeFilter = document.getElementById('history-type-filter');
  if (searchInput && searchInput.value !== historyQuery) searchInput.value = historyQuery;
  if (typeFilter && typeFilter.value !== historyTypeFilter) typeFilter.value = historyTypeFilter;
  const rows = filteredHistoryRows();
  const totalPages = Math.max(1, Math.ceil(rows.length / historyPageSize));
  historyPage = Math.min(Math.max(1, historyPage), totalPages);
  const start = (historyPage - 1) * historyPageSize;
  const pageRows = rows.slice(start, start + historyPageSize);
  table.innerHTML = `
    <div class="history-list-head">
      <span>No</span>
      <span>유형</span>
      <span>제목</span>
      <span>시간</span>
      <span></span>
    </div>
    ${pageRows.length ? pageRows.map((item, index) => {
      const isOpen = selectedHistoryId === item.id;
      const targetLabel = historyTargetLabel(item);
      return `
      <div class="history-row ${isOpen ? 'open' : ''}" onclick="showHistoryDetail(${item.id})">
        <span class="history-no">${rows.length - start - index}</span>
        <span class="history-kind">${historyListTypeLabel(item.type)}</span>
        <div class="history-main">
          <div class="history-target">${escapeHtml(targetLabel)}</div>
          <div class="history-brief">
            <span class="history-date">${escapeHtml(item.date)}</span>
          </div>
        </div>
        <i class="ti ti-chevron-down history-toggle"></i>
      </div>
      ${isOpen ? renderHistoryInlineDetail(item) : ''}
    `;
    }).join('') : '<div class="history-empty">검색 결과가 없습니다</div>'}
  `;
  renderHistoryPagination(totalPages);
}

function renderHistoryPagination(totalPages) {
  const pagination = document.getElementById('history-pagination');
  pagination.innerHTML = `
    ${Array.from({ length: totalPages }, (_, index) => {
      const page = index + 1;
      return `<button class="page-btn ${historyPage === page ? 'active' : ''}" type="button" onclick="setHistoryPage(${page})">${page}</button>`;
    }).join('')}
  `;
}

function setHistoryPage(page) {
  const totalPages = Math.max(1, Math.ceil(filteredHistoryRows().length / historyPageSize));
  historyPage = Math.min(Math.max(1, page), totalPages);
  selectedHistoryId = null;
  renderHistory();
}

function renderHistoryInlineDetail(item) {
  const contentNames = historyContentNames(item);
  const platformNames = item.platforms || [];
  const contentListHtml = contentNames.length
    ? contentNames.map(name => `<div class="mail-confirm-list-row">${escapeHtml(name)}</div>`).join('')
    : '<div class="mail-confirm-list-row">발송한 콘텐츠가 없습니다</div>';
  const platformListHtml = platformNames.length
    ? platformNames.map(name => `<span class="history-platform-badge">${escapeHtml(name)}</span>`).join('')
    : '<span class="history-platform-badge">발송한 플랫폼사가 없습니다</span>';
  return `
    <div class="history-inline-detail">
      <div class="history-inline-grid">
        <div class="detail-body">
          <div class="review-row"><span class="review-key">메일 유형</span><span class="review-val">${mailTypes[item.type].label}</span></div>
          <div class="review-row"><span class="review-key">콘텐츠명</span><span class="review-val"><div class="mail-confirm-list history-detail-list">${contentListHtml}</div></span></div>
          <div class="review-row"><span class="review-key">관리자</span><span class="review-val">${escapeHtml(item.sender)}</span></div>
          <div class="review-row"><span class="review-key">발송 일시</span><span class="review-val">${escapeHtml(item.date)}</span></div>
          <div class="review-row"><span class="review-key">발송 플랫폼</span><span class="review-val"><div class="history-platform-badges">${platformListHtml}</div></span></div>
        </div>
      </div>
    </div>
  `;
}

function showHistoryDetail(id) {
  selectedHistoryId = selectedHistoryId === id ? null : id;
  renderHistory();
}

function hideHistoryDetail() {
  selectedHistoryId = null;
  renderHistory();
}

function renderAll() {
  renderView();
  renderTypeButtons();
  renderStepper();
  renderComposeStep();
  renderSources();
  renderPlatforms();
  renderPreview();
  renderHistory();
}

renderAll();
</script>
</body>
</html>
