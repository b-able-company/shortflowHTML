<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제작협업 상세 | 제작사 입장 뷰</title>
  <link rel="stylesheet" href="dashboard-common.css">
  <script src="dashboard-nav.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --orange: #e85d2c;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f8f9fb;
      --surface: #ffffff;
    }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: "Geist", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .collab-detail-main {
      padding: 24px 0 72px;
    }
    .detail-shell {
      display: grid;
      gap: 22px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      gap: 6px;
      color: #747b88;
      font-size: 13px;
      font-weight: 500;
    }
    .hero {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .reference-media {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      min-height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #f3f4f6;
      border: 1px solid var(--line);
    }
    .reference-media img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .reference-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding: 34px;
      background: linear-gradient(145deg, #1d2435 0%, #44384a 48%, #d99976 100%);
      color: #fff;
      font-size: 40px;
      line-height: 1.08;
      letter-spacing: -1px;
      font-weight: 650;
      word-break: keep-all;
    }
    .reference-media::after {
      display: none;
    }
    .media-label {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(17,24,39,0.76);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(12px);
    }
    .play-button {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      transform: translate(-50%, -50%);
      width: 62px;
      height: 62px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: #111827;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      cursor: pointer;
    }
    .play-button svg {
      width: 24px;
      height: 24px;
      margin-left: 3px;
      fill: currentColor;
    }
    .media-caption {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 20px;
      z-index: 2;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      text-shadow: 0 2px 8px rgba(0,0,0,0.36);
    }
    .summary-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-height: 450px;
    }
    .stage-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 30px;
      padding: 8px 13px 6px;
      border: 0;
      border-radius: 999px;
      background: rgba(245,245,247,0.92);
      color: #3f4652;
      font-size: 12px;
      font-weight: 560;
      line-height: 1.1;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7);
    }
    .stage-badge::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 50%;
      left: calc(100% + 10px);
      z-index: 8;
      width: max-content;
      max-width: 240px;
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(17,24,39,0.94);
      color: #fff;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.45;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transform: translate(-3px, -50%);
      transition: opacity 140ms ease, transform 140ms ease;
      box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    }
    .stage-badge:hover::after,
    .stage-badge:focus-visible::after {
      opacity: 1;
      transform: translate(0, -50%);
    }
    .stage-badge.is-plan,
    .stage-badge.is-synopsis,
    .stage-badge.is-script,
    .stage-badge.is-casting,
    .stage-badge.is-pilot,
    .stage-badge.is-ready {
      background: rgba(12,12,12,0.82);
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .detail-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.24;
      letter-spacing: -0.5px;
      font-weight: 700;
    }
    .detail-producer {
      margin-top: 9px;
      color: #4b5563;
      font-size: 14px;
      font-weight: 600;
    }
    .genre-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }
    .genre-chip {
      min-height: 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px 5px;
      border-radius: 999px;
      border: 1px solid rgba(17,24,39,0.07);
      color: #4f5561;
      font-size: 12.5px;
      font-weight: 540;
      line-height: 1.1;
      background: rgba(248,249,251,0.92);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.78);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .meta-item {
      padding: 13px 14px;
      border-radius: 9px;
      background: #fafafa;
      border: 1px solid #eeeeee;
    }
    .meta-label {
      color: #7b8190;
      font-size: 11.5px;
      font-weight: 500;
      margin-bottom: 5px;
    }
    .meta-value {
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
    }
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
      padding-top: 24px;
    }
    .action-button {
      position: relative;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #dfe3e8;
      background: #fff;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }
    .action-button[aria-disabled="true"] {
      cursor: default;
    }
    .action-button[aria-disabled="true"]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      z-index: 10;
      width: max-content;
      max-width: 220px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(29, 28, 28, 0.94);
      color: #fff;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.45;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 3px);
      transition: opacity 140ms ease, transform 140ms ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }
    .action-button[aria-disabled="true"]:hover::after,
    .action-button[aria-disabled="true"]:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .action-button.primary {
      border-color: #1D1C1C;
      background: #1D1C1C;
      color: #fff;
    }
    .action-button.is-active svg {
      fill: #ff3f4d;
      stroke: #ff3f4d;
    }
    .section-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(390px, 0.58fr);
      gap: 24px;
      align-items: stretch;
    }
    .info-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 24px;
    }
    .section-grid .info-card {
      min-height: 238px;
    }
    .info-card h2 {
      margin: 0 0 14px;
      font-size: 16px;
      letter-spacing: -0.2px;
    }
    .proposal-workflow-card {
      scroll-margin-top: 92px;
    }
    .proposal-workflow-head {
      margin-bottom: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }
    .proposal-workflow-head h2 {
      margin: 0;
    }
    .proposal-workflow-meta {
      color: #7b8190;
      font-size: 12px;
      font-weight: 520;
      white-space: nowrap;
    }
    .proposal-workflow-list {
      position: relative;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0;
    }
    .proposal-workflow-item {
      position: relative;
      min-height: 67px;
      padding: 0 0 0 28px;
    }
    .proposal-workflow-item::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      bottom: -4px;
      width: 1px;
      background: #d8dbe0;
    }
    .proposal-workflow-item:last-child::before {
      display: none;
    }
    .proposal-workflow-dot {
      position: absolute;
      top: 4px;
      left: 0;
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 999px;
      background: #c9ccd1;
      box-shadow: none;
    }
    .proposal-workflow-item:first-child .proposal-workflow-dot {
      background: #f05a28;
      animation: proposalWorkflowPulse 1.35s ease-in-out infinite;
    }
    @keyframes proposalWorkflowPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(240, 90, 40, 0.36);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(240, 90, 40, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(240, 90, 40, 0);
      }
    }
    .proposal-workflow-title {
      color: #181818;
      display: -webkit-box;
      overflow: hidden;
      font-size: 13px;
      font-weight: 560;
      line-height: 1.3;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .proposal-workflow-desc {
      display: none;
    }
    .proposal-workflow-date {
      margin-top: 4px;
      color: #8a8e96;
      display: block;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }
    .proposal-workflow-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20060;
      padding: 24px;
      background: rgba(17,24,39,0.38);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .proposal-workflow-modal-backdrop.show {
      display: flex;
    }
    .proposal-workflow-modal {
      width: min(480px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15,23,42,0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .proposal-workflow-modal-head {
      min-height: 62px;
      padding: 16px 18px 14px 22px;
      border-bottom: 1px solid #f0eee9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .proposal-workflow-modal-title {
      margin: 0;
      color: #181818;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 32px;
    }
    .proposal-workflow-modal-sub {
      display: none;
    }
    .proposal-workflow-modal-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #737780;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .proposal-workflow-modal-close:hover {
      background: #f7f7f5;
      color: #181818;
    }
    .proposal-workflow-modal-close svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
    }
    .proposal-workflow-modal-body {
      padding: 20px 22px 22px;
      overflow-y: auto;
    }
    .proposal-workflow-event-type {
      display: none;
    }
    .synopsis {
      margin: 0;
      color: #3f4652;
      font-size: 14.5px;
      line-height: 1.75;
      word-break: keep-all;
    }
    .casting-copy {
      margin: 0;
      color: #3f4652;
      font-size: 14.5px;
      line-height: 1.75;
      word-break: keep-all;
    }
    .synopsis + .synopsis,
    .casting-copy + .casting-copy {
      margin-top: 12px;
    }
    .media-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .media-card {
      min-width: 0;
    }
    .media-thumb {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      padding: 0;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #e5e7eb;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }
    .media-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 180ms ease;
    }
    .media-thumb:hover img {
      transform: scale(1.025);
    }
    .media-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.42) 100%);
      pointer-events: none;
    }
    .media-type {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 1;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(17,24,39,0.76);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .media-play {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: #111827;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.14);
    }
    .media-play svg {
      width: 16px;
      height: 16px;
      margin-left: 2px;
      fill: currentColor;
    }
    .media-name {
      font-size: 13px;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-viewer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 54px 44px 36px;
      background: rgba(0, 0, 0, 0.74);
      backdrop-filter: blur(6px);
    }
    .media-viewer-backdrop.is-open {
      display: flex;
    }
    .media-viewer-panel {
      width: fit-content;
      max-width: calc(100vw - 88px);
      max-height: calc(100vh - 90px);
      display: inline-grid;
      gap: 10px;
    }
    .media-viewer-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: #fff;
    }
    .media-viewer-title {
      min-width: 0;
      display: block;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.32);
    }
    .media-viewer-type {
      display: none;
    }
    .media-viewer-close {
      position: fixed;
      top: 26px;
      right: 26px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .media-viewer-close:hover {
      background: rgba(255,255,255,0.12);
    }
    .media-viewer-close svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.4;
    }
    .media-viewer-body {
      position: relative;
      width: fit-content;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: transparent;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    }
    .media-viewer-body img {
      width: auto;
      height: auto;
      max-width: calc(100vw - 88px);
      max-height: calc(100vh - 132px);
      display: block;
      object-fit: contain;
      background: transparent;
    }
    .media-viewer-play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: #111827;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 32px rgba(0,0,0,0.22);
      pointer-events: none;
    }
    .media-viewer-play.is-visible {
      display: inline-flex;
    }
    .media-viewer-play svg {
      width: 22px;
      height: 22px;
      margin-left: 3px;
      fill: currentColor;
    }
    .inquiry-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15,17,21,0.42);
    }
    .inquiry-modal-backdrop.is-open {
      display: flex;
    }
    .inquiry-modal {
      width: min(520px, 100%);
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0,0,0,0.24);
      overflow: hidden;
    }
    .inquiry-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px 12px;
    }
    .inquiry-modal-title {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: -0.2px;
    }
    .inquiry-modal-copy {
      margin: 0 0 14px;
      color: #3f4652;
      font-size: 13px;
      line-height: 1.55;
    }
    .inquiry-modal-close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #777d88;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .inquiry-modal-close:hover {
      background: transparent;
      color: #111827;
    }
    .inquiry-modal-close svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.1;
    }
    .inquiry-form {
      padding: 0 22px 20px;
    }
    .inquiry-textarea {
      width: 100%;
      min-height: 132px;
      resize: vertical;
      border: 1px solid #e2e5ea;
      border-radius: 7px;
      padding: 12px 13px;
      background: #fff;
      color: #111827;
      font: inherit;
      font-size: 13px;
      line-height: 1.55;
      outline: none;
      transition: border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }
    .inquiry-textarea:focus {
      border-color: #8d94a0;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(31,65,255,0.08);
    }
    .inquiry-textarea::placeholder {
      color: #9aa1ad;
    }
    .inquiry-complete {
      display: none;
      margin: 0 0 14px;
      padding: 13px 14px;
      border-radius: 8px;
      background: #f5f7f6;
      color: #263a31;
      font-size: 13px;
      line-height: 1.55;
    }
    .inquiry-modal.is-submitted .inquiry-modal-copy,
    .inquiry-modal.is-submitted .inquiry-textarea {
      display: none;
    }
    .inquiry-modal.is-submitted .inquiry-complete {
      display: block;
    }
    .inquiry-actions {
      display: block;
      margin-top: 12px;
    }
    .inquiry-action {
      width: 100%;
      height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 7px;
      background: #1D1C1C;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.16s ease;
    }
    .inquiry-action:hover {
      background: #1D1C1C;
      transform: translateY(-1px);
    }
    .inquiry-modal.is-submitted .inquiry-action {
      display: none;
    }
    .producer-intro {
      margin: 0;
      color: #4b5563;
      font-size: 14.5px;
      line-height: 1.75;
      word-break: keep-all;
    }
    .producer-intro + .producer-intro {
      margin-top: 12px;
    }
    .producer-profile {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 424px;

          { title: '퇴사했더니 황제가 됐다', year: '2024', image: 'images/posters/resigned-emperor.png', fallback: 'images/posters/퇴사했더니황제.png' },
          { title: '살인범과 룸메이트가 되었다', year: '2024', image: 'images/posters/murderer-roommate.png', fallback: 'images/posters/살인범과룸메이트.png' }

    const proposalWorkflowClose = document.getElementById('proposalWorkflowClose');
    const PRODUCTION_INQUIRY_STORAGE_KEY = 'shortflow-production-inquiries';
    let interested = false;

    const STAGE_DEFINITIONS = {
      '기획': '기획안(로그라인·소재·타깃) 보유',
      '시놉 확정': '확정 시놉시스·기획서 완성',
      '대본 확보': '대본 완성(전회차 또는 파일럿분)',
      '캐스팅 확정': '주연 캐스팅 확정',
      '파일럿 완료': '파일럿/티저 영상 완성',
      '제작 준비완료': '예산·스태프·일정 확정, 자금만 확보되면 촬영 개시'
    };

    function stageClass(stage) {
      if (stage === '기획') return 'is-plan';
      if (stage === '시놉 확정') return 'is-synopsis';
      if (stage === '대본 확보') return 'is-script';
      if (stage === '캐스팅 확정') return 'is-casting';
      if (stage === '파일럿 완료') return 'is-pilot';
      if (stage === '제작 준비완료') return 'is-ready';

    function stageDefinition(stage) {

    }

    const workflowEventMeta = {
      PRODUCTION_CONTENT_SUBMITTED: {
        message: ({ company }) => `${company}이 기획안 등록을 신청했어요.`,
        trigger: 'CP사가 기획안 제출'
      },
      PRODUCTION_CONTENT_APPROVED: {
        message: () => '관리자가 기획안 등록을 승인했어요.',
        trigger: '어드민 승인'
      },
      PRODUCTION_CONTENT_REJECTED: {
        message: () => '관리자가 기획안 등록을 거절했어요.',
        trigger: '어드민 거절'
      },
      PRODUCTION_REVISION_REQUESTED: {
        message: () => '기획안 수정을 신청했어요.',
        trigger: 'CP사가 수정요청'
      },
      PRODUCTION_REVISION_APPROVED: {
        message: () => '관리자가 수정 신청을 승인했어요.',
        trigger: '어드민 승인'
      },
      PRODUCTION_REVISION_REJECTED: {
        message: () => '관리자가 수정 신청을 거절했어요.',
        trigger: '어드민 거절'
      },
      PRODUCTION_REVISION_CANCELLED: {
        message: () => '제작사가 수정 신청을 취소했어요.',
        trigger: 'CP사가 취소'
      },
      PRODUCTION_MATERIALS_SUBMITTED: {
        message: () => '기획안 자료 업로드를 완료했습니다.',
        trigger: '구글드라이브 자료 업로드'
      },
      PRODUCTION_PROPOSAL_SENT: {
        message: ({ recipient }) => `기획안을 ${recipient}에 제안 메일을 발송했습니다.`,
        trigger: '어드민이 플랫폼사에 제안 메일 발송'
      }
    };

    function workflowEventMessage(event) {
      const meta = workflowEventMeta[event.type];
      if (!meta) return event.type;
      return meta.message({
        company: item.producer || '제작사',
        recipient: event.recipient || '플랫폼사'
      });
    }

    function workflowTimelineMarkup() {
      return `
        <ol class="proposal-workflow-list">
          ${(item.workflowEvents || []).map(event => {
            const meta = workflowEventMeta[event.type] || { trigger: '' };
            return `
              <li class="proposal-workflow-item">
                <span class="proposal-workflow-dot" aria-hidden="true"></span>
                <span class="proposal-workflow-event-type">${event.type}</span>
                <strong class="proposal-workflow-title">${workflowEventMessage(event)}</strong>
                <p class="proposal-workflow-desc">${meta.trigger}</p>
                <span class="proposal-workflow-date">${event.date}</span>
              </li>
            `;
          }).join('')}
        </ol>
      `;
    }

    function openWorkflowModal() {
      proposalWorkflowTitle.textContent = item.title;
      proposalWorkflowSub.textContent = '';
      proposalWorkflowBody.innerHTML = workflowTimelineMarkup();
      proposalWorkflowModal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeWorkflowModal() {
      proposalWorkflowModal.classList.remove('show');
      document.body.style.overflow = '';
    }

    function posterMarkup(work) {
      return work.image
        ? `<img src="${work.image}" alt="${work.title} 포스터"${fallbackAttr(work.fallback)}>`
        : '';
    }

    function paragraphMarkup(text, className) {
      const paragraphs = text
        .split(/(?<=\.)\s+/)
        .reduce((groups, sentence, index) => {
          const groupIndex = index < 2 ? 0 : 1;
          groups[groupIndex] = groups[groupIndex] ? `${groups[groupIndex]} ${sentence}` : sentence;
          return groups;
        }, [])
        .filter(Boolean);

      return paragraphs.map((paragraph) => `<p class="${className}">${paragraph}</p>`).join('');
    }

    function fallbackAttr(fallback) {
      return fallback
        ? ` data-fallback-src="${fallback.normalize('NFC')}" data-fallback-src-alt="${fallback.normalize('NFD')}" data-fallback-step="0" onerror="handleImageFallback(this)"`
        : '';
    }

    function handleImageFallback(image) {
      const step = Number(image.dataset.fallbackStep || '0');
      const fallback = step === 0 ? image.dataset.fallbackSrc : image.dataset.fallbackSrcAlt;
      image.dataset.fallbackStep = String(step + 1);
      if (fallback && image.src !== fallback) {
        image.src = fallback;
        return;
      }
      image.onerror = null;
    }

    function mediaMarkup(entry) {
      return entry.image
        ? `<img src="${entry.image}" alt="${entry.title} 레퍼런스 이미지"${fallbackAttr(entry.fallback)}>`
        : `<div class="reference-fallback">${entry.title}</div>`;
    }

    function relatedMedia(entry) {
      return [
        { type: '영상', title: '레드카펫 복귀 티저', image: 'images/media/topstar-still-1.png', fallback: 'images/media/톱스타스틸컷1.png', playable: true },

    function openMediaViewer(media) {
      mediaViewerType.textContent = media.type;
      mediaViewerTitle.textContent = media.title;
      mediaViewerImage.src = media.image;
      mediaViewerImage.alt = media.title;
      mediaViewerImage.dataset.fallbackSrc = media.fallback ? media.fallback.normalize('NFC') : '';
      mediaViewerImage.dataset.fallbackSrcAlt = media.fallback ? media.fallback.normalize('NFD') : '';
      mediaViewerImage.dataset.fallbackStep = '0';
      mediaViewerImage.onerror = () => handleImageFallback(mediaViewerImage);
      mediaViewerPlay.classList.toggle('is-visible', media.playable);

    function closeMediaViewer() {

      document.body.style.overflow = '';

      mediaViewerImage.src = '';
      mediaViewerImage.dataset.fallbackSrc = '';
      mediaViewerImage.dataset.fallbackSrcAlt = '';
      mediaViewerImage.dataset.fallbackStep = '';
    }

    function openInquiryModal() {

      inquiryModal.classList.remove('is-open');
      inquiryModalPanel.classList.remove('is-submitted');
      document.body.style.overflow = '';
    }

    function formatInquiryDateParts(date) {
      const pad = (value) => String(value).padStart(2, '0');
      return {
        date: `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())}`,
        time: `${pad(date.getHours())}:${pad(date.getMinutes())}`,
      };
    }

    function saveProductionInquiry(message) {
      const now = new Date();
      const timestamp = now.getTime();
      const dateParts = formatInquiryDateParts(now);
      let savedItems = [];

      try {
        savedItems = JSON.parse(localStorage.getItem(PRODUCTION_INQUIRY_STORAGE_KEY) || '[]');
        if (!Array.isArray(savedItems)) savedItems = [];
      } catch (error) {
        savedItems = [];
      }

      const inquiry = {
        id: `pc-${timestamp}`,
        inquiryType: '제작협업',
        title: `${item.title} 제작 문의`,
        contentTitle: item.title,
        producerName: item.producer,
        date: dateParts.date,
        time: dateParts.time,
        statusLabel: '전송됨',
        full: message,
      };

      localStorage.setItem(PRODUCTION_INQUIRY_STORAGE_KEY, JSON.stringify([inquiry, ...savedItems].slice(0, 20)));
    }

    function installManagementRemote() {
      if (document.querySelector('.my-content-actionbar')) return;

      const actionbar = document.createElement('div');
      actionbar.className = 'my-content-actionbar';

      const title = document.createElement('div');
      title.className = 'my-content-remote-title';
      title.textContent = 'MY CONTENT';

      const status = document.createElement('div');
      status.className = 'my-content-remote-status';
      status.textContent = '관리 도구';

      const editButton = document.createElement('button');
      editButton.className = 'my-content-floating-btn my-content-edit-btn';
      editButton.type = 'button';
      editButton.textContent = '수정하기';
      editButton.addEventListener('click', () => {
        alert('기획안 수정 화면으로 이동합니다.');
      });

      const reviewButton = document.createElement('button');
      reviewButton.className = 'my-content-floating-btn my-content-review-btn';
      reviewButton.type = 'button';
      reviewButton.textContent = '검토 요청';
      reviewButton.addEventListener('click', () => {
        alert('검토 요청을 보냈습니다.');
      });

      const workflowButton = document.createElement('button');
      workflowButton.className = 'my-content-floating-btn my-content-workflow-btn';
      workflowButton.type = 'button';
      workflowButton.textContent = '워크플로우';
      workflowButton.addEventListener('click', () => {
        openWorkflowModal();
      });

      actionbar.appendChild(title);
      actionbar.appendChild(status);
      actionbar.appendChild(editButton);
      actionbar.appendChild(reviewButton);
      actionbar.appendChild(workflowButton);
      actionbar.style.visibility = 'hidden';
      document.body.appendChild(actionbar);

      const positionActionbar = () => {
        const rootRect = root.getBoundingClientRect();
        const backControl = root.querySelector('.back-link');
        const backRect = backControl ? backControl.getBoundingClientRect() : rootRect;
        const gap = 14;
        const panelWidth = actionbar.offsetWidth || 112;
        const outsideLeft = rootRect.right + gap;
        const insideLeft = rootRect.right - panelWidth - gap;
        const hasOutsideRoom = outsideLeft + panelWidth <= window.innerWidth - 12;

        actionbar.style.top = `${Math.max(64, backRect.top)}px`;
        actionbar.style.left = `${Math.max(12, hasOutsideRoom ? outsideLeft : insideLeft)}px`;
      };

      requestAnimationFrame(() => {
        positionActionbar();
        actionbar.style.visibility = 'visible';
      });
      window.addEventListener('resize', positionActionbar);
      window.addEventListener('scroll', positionActionbar, { passive: true });
    }

    function render() {
      const mediaItems = relatedMedia(item);
      document.title = `${item.title} | 제작협업 상세`;
      root.innerHTML = `
        <section class="hero">
          <div class="reference-media">
            ${mediaMarkup(item)}
          </div>
          <aside class="summary-card">
            <span class="stage-badge ${stageClass(item.stage)}" data-tooltip="${stageDefinition(item.stage)}" title="${stageDefinition(item.stage)}">${item.stage}</span>
            <h1 class="detail-title">${item.title}</h1>
            <div class="detail-producer">${item.producer}</div>
            <div class="genre-row">
              ${item.genres.map((genre) => `<span class="genre-chip">${genre}</span>`).join('')}
            </div>
            <div class="meta-grid">
              <div class="meta-item">
                <div class="meta-label">예정 부작수</div>
                <div class="meta-value">${item.episodes}</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">편당 러닝타임</div>
                <div class="meta-value">${item.runtime}</div>
              </div>
            </div>
            <div class="action-row">
              <button class="action-button primary" type="button" id="inquiryButton" aria-disabled="true" data-tooltip="미리보기 모드에서는 사용할 수 없습니다." title="미리보기 모드에서는 사용할 수 없습니다.">제작 문의하기</button>
              <button class="action-button ${interested ? 'is-active' : ''}" type="button" id="interestButton" aria-disabled="true" data-tooltip="미리보기 모드에서는 사용할 수 없습니다." title="미리보기 모드에서는 사용할 수 없습니다.">
                ${heartIcon(interested)}
                즐겨찾기
              </button>
            </div>
          </aside>
        </section>
        <section class="section-grid">
          <div class="info-card">
            <h2>시놉시스</h2>
            ${paragraphMarkup(item.synopsis, 'synopsis')}
          </div>
          <div class="info-card">
            <h2>캐스팅 정보</h2>
            ${paragraphMarkup(item.casting, 'casting-copy')}
          </div>
        </section>
        <section class="info-card">
          <h2>레퍼런스 이미지/영상</h2>
          <div class="media-list">
            ${mediaItems.map((media, index) => `
              <div class="media-card">
                <button class="media-thumb" type="button" data-media-index="${index}" aria-label="${media.title} 크게 보기">
                  <img src="${media.image}" alt="${media.title}"${fallbackAttr(media.fallback)}>
                  <span class="media-type">${media.type}</span>
                  ${media.playable ? `
                    <span class="media-play" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </span>
                  ` : ''}
                </button>
                <div class="media-name">${media.title}</div>
              </div>
            `).join('')}
          </div>
        </section>
        <section class="info-card">
          <div class="producer-profile">
            <div class="producer-intro-column">
              <h2 class="producer-column-title">제작사 소개</h2>
              ${paragraphMarkup(item.producerIntro, 'producer-intro')}
            </div>
            <div class="producer-works-column">
              <div class="works-list">
                ${item.works.map((work) => `
                  <div class="work-card">
                    <div class="work-poster ${work.image ? '' : 'is-empty'}">${posterMarkup(work)}</div>
                    <div class="work-name">
                      <span class="work-title-text">${work.title}</span>
                      <span class="work-year-inline">${work.year}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </section>
      `;

      document.querySelectorAll('[data-media-index]').forEach((button) => {
        button.addEventListener('click', () => {
          openMediaViewer(mediaItems[Number(button.dataset.mediaIndex)]);
        });
      });
      installManagementRemote();
    }

    mediaViewerClose.addEventListener('click', closeMediaViewer);
    mediaViewer.addEventListener('click', (event) => {
      if (event.target === mediaViewer) closeMediaViewer();
    });
    inquiryModalClose.addEventListener('click', closeInquiryModal);
    inquiryModal.addEventListener('click', (event) => {
      if (event.target === inquiryModal) closeInquiryModal();
    });
    proposalWorkflowClose.addEventListener('click', closeWorkflowModal);
    proposalWorkflowModal.addEventListener('click', (event) => {
      if (event.target === proposalWorkflowModal) closeWorkflowModal();
    });
    inquiryForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!inquiryMessage.value.trim()) {
        inquiryMessage.value = '';
        inquiryMessage.reportValidity();
        return;
      }
      saveProductionInquiry(inquiryMessage.value.trim());
      inquiryModalPanel.classList.add('is-submitted');
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (proposalWorkflowModal.classList.contains('show')) {
        closeWorkflowModal();
        return;
      }
      if (inquiryModal.classList.contains('is-open')) {
        closeInquiryModal();
        return;
      }
      if (mediaViewer.classList.contains('is-open')) {
        closeMediaViewer();
      }
    });

    render();
  </script>
</body>
</html>
