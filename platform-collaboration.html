<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제작협업 | 플랫폼 입장 뷰</title>
  <link rel="stylesheet" href="dashboard-common.css">
  <script src="dashboard-nav.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --orange: #e85d2c;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #ffffff;
    }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: "Geist", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .platform-collaboration-main {
      padding: 24px 0 32px;
    }
    .filter-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .search-row {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px 0 28px;
      border-bottom: 1px solid #edf0f3;
    }
    .search {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #798192;
    }
    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      font-size: 14px;
    }
    .search input::placeholder { color: #7c8495; }
    .divider { width: 1px; height: 22px; background: #d9dde4; }
    .tool-btn {
      width: 92px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .tool-btn.is-active {
      color: var(--orange);
      border-color: #ffb49a;
      background: #fff8f5;
    }
    .filter-body {
      padding: 16px 16px 16px 28px;
    }
    .filter-panel.is-collapsed .search-row {
      border-bottom-color: transparent;
    }
    .filter-panel.is-collapsed .filter-body {
      display: none;
    }
    .filter-line {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 14.5px;
    }
    .filter-line:last-child { margin-bottom: 0; }
    .filter-label {
      padding-top: 6px;
      font-size: 14px;
      font-weight: 400;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 8px;
    }
    .chip {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #dfe3e8;
      border-radius: 6px;
      background: #fff;
      color: #111827;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .chip.active {
      border-color: var(--orange);
      background: var(--orange);
      color: #fff;
    }
    .list-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 30px 4px 12px;
    }
    .count {
      color: #5f6673;
      font-size: 14px;
      font-weight: 400;
    }
    .sort {
      display: flex;
      gap: 22px;
      color: #7d8391;
      font-size: 14px;
      font-weight: 500;
    }
    .sort button {
      border: 0;
      background: transparent;
      padding: 0;
      color: inherit;
      cursor: pointer;
      font-weight: inherit;
    }
    .sort button.active { color: var(--orange); }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 225px));
      justify-content: space-between;
      gap: 30px 4px;
    }
    .card { min-width: 0; position: relative; }
    .poster {
      position: relative;
      width: 96%;
      margin: 0 auto;
      height: auto;
      aspect-ratio: 2 / 3;
      flex: none;
      border-radius: 4px;
      overflow: hidden;
      background: #d1d5db;
      box-shadow: 0 1px 2px rgba(17,24,39,0.08);
    }
    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.02) 38%, rgba(0,0,0,0.58) 100%);
      pointer-events: none;
    }
    .poster.has-image::after {
      background: linear-gradient(180deg, rgba(0,0,0,0) 48%, rgba(0,0,0,0.5) 100%);
    }
    .poster > a {
      display: block;
      width: 100%;
      height: 100%;
    }
    .poster-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stage-badge {
      position: absolute;
      top: 13px;
      left: 13px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 8px 13px 6px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      color: #fff;
      font-size: 12px;
      font-weight: 560;
      line-height: 1.1;
      letter-spacing: 0;
      backdrop-filter: blur(18px) saturate(150%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .stage-badge.is-planning {
      background: rgba(255,255,255,0.22);
    }
    .stage-badge.is-casting {
      background: rgba(12,12,12,0.88);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .stage-badge.is-pilot {
      background: rgba(18,101,66,0.92);
      box-shadow: 0 8px 24px rgba(3,54,33,0.22), inset 0 1px 0 rgba(255,255,255,0.16);
    }
    .poster-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 8px;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .poster:hover .poster-actions,
    .poster:focus-within .poster-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .poster-action {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 18px;
      background: rgba(17,24,39,0.82);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .poster-action:hover {
      background: rgba(17,24,39,0.96);
    }
    .fav.active svg { fill: #ff3f4d; stroke: #ff3f4d; }
    @media (hover: none) {
      .poster-actions {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
    }
    .poster-producer {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 1;
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title {
      width: 96%;
      margin: 10px auto 0;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .genres {
      width: 96%;
      margin: 3px auto 0;
      color: #6b7280;
      font-size: 13px;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      display: none;
      min-height: 160px;
      align-items: center;
      justify-content: center;
      color: #7d8391;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .empty.is-visible { display: flex; }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 34px;
      margin-top: 96px;
      margin-bottom: 72px;
    }
    .page-btn {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .page-btn:hover:not(:disabled) {
      background: #f1f0ec;
      color: var(--ink);
    }
    .page-btn.active {
      background: rgba(26, 26, 24, 0.09);
      color: var(--ink);
    }
    .page-btn:disabled {
      color: #b8bec8;
      cursor: default;
    }
    .p1 { background: radial-gradient(circle at 60% 18%, #f5d0d3 0 16%, transparent 17%), linear-gradient(145deg, #1d2435 0%, #624553 46%, #d7aaa2 100%); }
    .p2 { background: radial-gradient(circle at 40% 18%, #f9c6a5 0 14%, transparent 15%), linear-gradient(150deg, #121827 0%, #2a2030 42%, #86533d 100%); }
    .p3 { background: radial-gradient(circle at 62% 24%, #d7ecff 0 20%, transparent 21%), linear-gradient(150deg, #f8efe7 0%, #bcd8f4 50%, #fff7d6 100%); }
    .p4 { background: radial-gradient(circle at 55% 8%, #d8e7ff 0 8%, transparent 9%), linear-gradient(180deg, #0c1322 0%, #20364a 48%, #b38b5a 100%); }
    .p5 { background: linear-gradient(135deg, #fff1a9 0%, #ffd4e2 45%, #8ed5ff 100%); }
    .p6 { background: linear-gradient(160deg, #101820 0%, #27384a 44%, #c09a75 100%); }
    .p7 { background: radial-gradient(circle at 40% 36%, #fff8db 0 16%, transparent 17%), linear-gradient(145deg, #3a261f 0%, #a76848 52%, #f2d3ac 100%); }
    .p8 { background: linear-gradient(180deg, #c7d2dc 0%, #353f36 58%, #111827 100%); }
    .p9 { background: linear-gradient(135deg, #331b2c 0%, #753a52 54%, #e0a4a4 100%); }
    .p10 { background: linear-gradient(150deg, #101827 0%, #314a5e 48%, #e4c8b4 100%); }
    .p11 { background: linear-gradient(160deg, #eef2ff 0%, #b8c6e6 42%, #745f8d 100%); }
    .p12 { background: linear-gradient(150deg, #151a24 0%, #44384a 45%, #d99976 100%); }
    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 222px)); }
    }
    @media (max-width: 720px) {
      .filter-line { grid-template-columns: 1fr; gap: 8px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; }
      .pagination { margin-top: 80px; margin-bottom: 56px; gap: 4px; }
      .platform-collaboration-main { padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <div data-shortflow-nav="platform-collab"></div>

  <main class="main platform-collaboration-main">
    <section class="filter-panel">
      <div class="search-row">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="search" type="search" placeholder="콘텐츠명 또는 제작사명 검색">
        </label>
        <div class="divider"></div>
        <button class="tool-btn is-active" type="button" id="filterToggle" aria-expanded="true" aria-controls="filters">
          필터
        </button>
        <button class="tool-btn" type="button" id="favoriteOnly">
          즐겨찾기
        </button>
      </div>
      <div class="filter-body" id="filters">
        <div class="filter-line" data-filter="stage">
          <div class="filter-label">진행상황</div>
          <div class="chips">
            <button class="chip active" data-value="전체">전체</button>
            <button class="chip" data-value="기획중">기획중</button>
            <button class="chip" data-value="캐스팅중">캐스팅중</button>
            <button class="chip" data-value="파일럿 촬영 완료">파일럿 촬영 완료</button>
          </div>
        </div>
        <div class="filter-line" data-filter="genre">
          <div class="filter-label">장르</div>
          <div class="chips">
            <button class="chip active" data-value="전체">전체</button>
            <button class="chip" data-value="로맨스">로맨스</button>
            <button class="chip" data-value="치정">치정</button>
            <button class="chip" data-value="복수">복수</button>
            <button class="chip" data-value="청춘">청춘</button>
            <button class="chip" data-value="가족">가족</button>
            <button class="chip" data-value="사극">사극</button>
            <button class="chip" data-value="코미디">코미디</button>
            <button class="chip" data-value="학원물">학원물</button>
            <button class="chip" data-value="액션">액션</button>
            <button class="chip" data-value="타임슬립">타임슬립</button>
            <button class="chip" data-value="SF">SF</button>
            <button class="chip" data-value="BL/GL">BL/GL</button>
            <button class="chip" data-value="스릴러">스릴러</button>
            <button class="chip" data-value="공포">공포</button>
            <button class="chip" data-value="여성향">여성향</button>
            <button class="chip" data-value="남성향">남성향</button>
            <button class="chip" data-value="판타지">판타지</button>
            <button class="chip" data-value="순정">순정</button>
            <button class="chip" data-value="멜로">멜로</button>
            <button class="chip" data-value="미스터리">미스터리</button>
            <button class="chip" data-value="기타">기타</button>
          </div>
        </div>
      </div>
    </section>

    <div class="list-meta">
      <div class="count" id="count">총 0개</div>
      <div class="sort">
        <button class="active" type="button" data-sort="registered">등록순</button>
        <button type="button" data-sort="latest">최신순</button>
      </div>
    </div>

    <section class="grid" id="grid" aria-label="제작협업 콘텐츠 목록"></section>
    <div class="empty" id="emptyState">조건에 맞는 제작협업 콘텐츠가 없어요.</div>
    <nav class="pagination" id="pagination" aria-label="제작협업 콘텐츠 페이지"></nav>
  </main>

  <script>
    const collaborations = [
      { title: '대표님, 계약 연애는 처음이라서요', producer: 'Studio Lune', genres: ['로맨스', '여성향'], stage: '기획중', favorite: true, poster: 'p1', image: 'images/ceo-ex-boyfriend.png', href: '#', registeredAt: '2026-07-02' },
      { title: '재벌집 막내 비서: 프리퀄', producer: 'Mellow Frame', genres: ['로맨스', '가족'], stage: '캐스팅중', favorite: false, poster: 'p2', image: 'images/chaebol-secretary.png', href: '#', registeredAt: '2026-06-28' },
      { title: '죽었다가 회귀한 톱스타', producer: 'Orbit Pictures', genres: ['타임슬립', '액션'], stage: '파일럿 촬영 완료', favorite: true, poster: 'p3', image: 'images/return-topstar-poster.png', href: '#', registeredAt: '2026-06-24' },
      { title: '우리 집에 킬러가 산다', producer: 'Black Room', genres: ['스릴러', '코미디'], stage: '기획중', favorite: false, poster: 'p4', image: 'images/killer-at-home.png', href: '#', registeredAt: '2026-06-18' },
      { title: '오늘부터 악녀 대행합니다', producer: 'Peach Lab', genres: ['로맨스', '코미디'], stage: '캐스팅중', favorite: false, poster: 'p5', image: 'images/villainess-agent.png', href: '#', registeredAt: '2026-06-12' },
      { title: '남편이 AI입니다: 시즌 제로', producer: 'Neon Script', genres: ['로맨스', 'SF'], stage: '파일럿 촬영 완료', favorite: true, poster: 'p6', image: 'images/ai-husband.png', href: '#', registeredAt: '2026-06-05' },
      { title: '퇴사했더니 황제가 됐다', producer: 'History Pop', genres: ['판타지', '사극'], stage: '기획중', favorite: false, poster: 'p7', image: 'images/resigned-emperor.png', href: '#', registeredAt: '2026-05-30' },
      { title: '살인범과 룸메이트가 되었다', producer: 'Tension House', genres: ['스릴러', '미스터리'], stage: '캐스팅중', favorite: true, poster: 'p8', image: 'images/murderer-roommate.png', href: '#', registeredAt: '2026-05-25' },
      { title: '비밀 계정의 주인', producer: 'Deep Pink Studio', genres: ['복수', '스릴러'], stage: '기획중', favorite: false, poster: 'p9', image: 'images/topstar-still-1.png', href: '#', registeredAt: '2026-05-18' },
      { title: '계약 종료 3일 전', producer: 'Blue Hour', genres: ['로맨스', '멜로'], stage: '파일럿 촬영 완료', favorite: false, poster: 'p10', image: 'images/topstar-still-2.png', href: '#', registeredAt: '2026-05-10' },
      { title: '달빛 아래 편의점', producer: 'Daybreak Works', genres: ['청춘', 'SF'], stage: '캐스팅중', favorite: false, poster: 'p11', image: 'images/topstar-still-3.png', href: '#', registeredAt: '2026-05-04' },
      { title: '그녀의 두 번째 엔딩', producer: 'Ending Note', genres: ['로맨스', '타임슬립'], stage: '기획중', favorite: true, poster: 'p12', image: 'images/return-topstar-poster.png', href: '#', registeredAt: '2026-04-28' },
      { title: '새벽 두 시의 고백', producer: 'Moonlit Studio', genres: ['로맨스', '청춘'], stage: '기획중', favorite: false, poster: 'p1', image: 'images/ceo-ex-boyfriend.png', href: '#', registeredAt: '2026-04-21' },
      { title: '상속녀의 가짜 약혼자', producer: 'Velvet Room', genres: ['로맨스', '가족'], stage: '캐스팅중', favorite: false, poster: 'p2', image: 'images/chaebol-secretary.png', href: '#', registeredAt: '2026-04-16' },
      { title: '이번 생은 조연입니다', producer: 'Loop Lab', genres: ['타임슬립', '코미디'], stage: '파일럿 촬영 완료', favorite: false, poster: 'p3', image: 'images/villainess-agent.png', href: '#', registeredAt: '2026-04-09' },
      { title: '대표님의 비밀 계약서', producer: 'Paper Moon', genres: ['로맨스', '복수'], stage: '기획중', favorite: false, poster: 'p4', image: 'images/killer-at-home.png', href: '#', registeredAt: '2026-04-02' },
      { title: '나를 죽인 배우를 찾습니다', producer: 'Frame Zero', genres: ['스릴러', '미스터리'], stage: '캐스팅중', favorite: false, poster: 'p5', image: 'images/murderer-roommate.png', href: '#', registeredAt: '2026-03-26' }
    ];

    const state = {
      stage: [],
      genre: [],
      favoriteOnly: false,
      sort: 'registered',
      query: '',
      page: 1,
      pageSize: 15
    };

    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const search = document.getElementById('search');
    const pagination = document.getElementById('pagination');
    const emptyState = document.getElementById('emptyState');
    const filterPanel = document.querySelector('.filter-panel');
    const filterToggle = document.getElementById('filterToggle');

    function iconHeart(filled) {
      return `<svg width="19" height="19" viewBox="0 0 24 24" fill="${filled ? '#ff3f4d' : 'none'}" stroke="${filled ? '#ff3f4d' : '#fff'}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>`;
    }

    function stageClass(stage) {
      if (stage === '기획중') return 'is-planning';
      if (stage === '캐스팅중') return 'is-casting';
      return 'is-pilot';
    }

    function detailHref(item) {
      return 'platform-collaboration-detail.html';
    }

    function render() {
      const query = state.query.toLowerCase();
      let items = collaborations.filter((item) => {
        if (state.stage.length && !state.stage.includes(item.stage)) return false;
        if (state.genre.length && !state.genre.some((genre) => item.genres.includes(genre))) return false;
        if (state.favoriteOnly && !item.favorite) return false;
        if (query) {
          const haystack = `${item.title} ${item.producer}`.toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });
      if (state.sort === 'latest') {
        items = items.slice().sort((a, b) => new Date(b.registeredAt) - new Date(a.registeredAt));
      }

      const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
      state.page = Math.min(state.page, totalPages);
      const start = (state.page - 1) * state.pageSize;
      const pageItems = items.slice(start, start + state.pageSize);

      count.textContent = `총 ${items.length}개`;
      emptyState.classList.toggle('is-visible', pageItems.length === 0);
      grid.style.display = pageItems.length ? 'grid' : 'none';
      grid.innerHTML = pageItems.map((item) => `
        <article class="card">
          <div class="poster ${item.poster} ${item.image ? 'has-image' : ''}">
            <a href="${detailHref(item)}">
              ${item.image
                ? `<img class="poster-image" src="${item.image}" alt="${item.title} 포스터">`
                : ''}
            </a>
            <span class="stage-badge ${stageClass(item.stage)}">${item.stage}</span>
            <div class="poster-producer">${item.producer}</div>
            <div class="poster-actions">
              <button class="poster-action fav ${item.favorite ? 'active' : ''}" type="button" data-title="${item.title}" aria-label="${item.title} 즐겨찾기" aria-pressed="${Boolean(item.favorite)}">
                ${iconHeart(item.favorite)}
              </button>
            </div>
          </div>
          <a href="${detailHref(item)}">
            <div class="title">${item.title}</div>
            <div class="genres">${item.genres.join(', ')}</div>
          </a>
        </article>
      `).join('');
      renderPagination(totalPages, items.length);
    }

    function renderPagination(totalPages, itemCount) {
      if (totalPages <= 1 || itemCount === 0) {
        pagination.innerHTML = '';
        return;
      }
      const pages = Array.from({ length: totalPages }, (_, index) => index + 1).map((page) => `
        <button class="page-btn ${page === state.page ? 'active' : ''}" type="button" data-page="${page}" aria-label="${page}페이지" ${page === state.page ? 'aria-current="page"' : ''}>${page}</button>
      `).join('');
      pagination.innerHTML = `
        <button class="page-btn" type="button" data-page="${state.page - 1}" aria-label="이전 페이지" ${state.page === 1 ? 'disabled' : ''}>‹</button>
        ${pages}
        <button class="page-btn" type="button" data-page="${state.page + 1}" aria-label="다음 페이지" ${state.page === totalPages ? 'disabled' : ''}>›</button>
      `;
    }

    function resetPage() {
      state.page = 1;
    }

    document.getElementById('filters').addEventListener('click', (event) => {
      const chip = event.target.closest('.chip');
      if (!chip) return;
      const group = chip.closest('.filter-line');
      const filterKey = group.dataset.filter;
      const value = chip.dataset.value;

      if (value === '전체') {
        state[filterKey] = [];
      } else {
        const selected = state[filterKey];
        state[filterKey] = selected.includes(value)
          ? selected.filter((item) => item !== value)
          : [...selected, value];
      }

      const activeValues = state[filterKey];
      group.querySelectorAll('.chip').forEach((item) => {
        const active = item.dataset.value === '전체'
          ? activeValues.length === 0
          : activeValues.includes(item.dataset.value);
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', String(active));
      });
      resetPage();
      render();
    });

    filterToggle.addEventListener('click', () => {
      const isCollapsed = filterPanel.classList.toggle('is-collapsed');
      filterToggle.setAttribute('aria-expanded', String(!isCollapsed));
      filterToggle.classList.toggle('is-active', !isCollapsed);
    });

    document.querySelector('.sort').addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-sort]');
      if (!btn) return;
      state.sort = btn.dataset.sort;
      document.querySelectorAll('.sort button').forEach((item) => item.classList.toggle('active', item === btn));
      resetPage();
      render();
    });

    document.getElementById('favoriteOnly').addEventListener('click', (event) => {
      state.favoriteOnly = !state.favoriteOnly;
      event.currentTarget.classList.toggle('is-active', state.favoriteOnly);
      resetPage();
      render();
    });

    search.addEventListener('input', (event) => {
      state.query = event.target.value.trim();
      resetPage();
      render();
    });

    pagination.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-page]');
      if (!btn || btn.disabled) return;
      state.page = Number(btn.dataset.page);
      render();
      document.querySelector('.list-meta').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    grid.addEventListener('click', (event) => {
      const btn = event.target.closest('.poster-action');
      if (!btn) return;
      event.preventDefault();
      const item = collaborations.find((content) => content.title === btn.dataset.title);
      if (!item) return;
      item.favorite = !item.favorite;
      render();
    });

    render();
  </script>
</body>
</html>
