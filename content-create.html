<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 등록 | shortflow</title>
  <link rel="stylesheet" href="dashboard-common.css">
  <script src="dashboard-nav.js"></script>
  <style>
    :root {
      --create-orange: #e85d2c;
      --create-ink: #151515;
      --create-muted: #686b73;
      --create-faint: #a2a6ae;
      --create-line: #e7e5df;
      --create-line-strong: #d7d4cc;
      --create-soft: #fafaf7;
      --create-green: #258650;
    }

    body {
      background: #fff;
      color: var(--create-ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .create-main {
      padding-top: 18px;
      padding-bottom: 72px;
    }

    .create-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .create-title h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0;
    }

    .create-title p {
      margin: 7px 0 0;
      color: var(--create-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .create-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .create-btn,
    .create-link {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 13px;
      border: 1px solid var(--create-line);
      border-radius: 8px;
      background: #fff;
      color: var(--create-ink);
      font-size: 12.5px;
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
    }

    .create-btn.primary {
      border-color: var(--create-orange);
      background: var(--create-orange);
      color: #fff;
    }

    .create-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .create-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .step-nav {
      position: sticky;
      top: 92px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--create-line);
      border-radius: 12px;
      background: #fff;
    }

    .step-tab {
      width: 100%;
      min-height: 54px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--create-muted);
      text-align: left;
    }

    .step-tab.active {
      border-color: rgba(232,93,44,0.34);
      background: #fff7f3;
      color: var(--create-orange);
    }

    .step-no {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #f3f4f6;
      color: #7b8088;
      font-size: 12px;
      font-weight: 800;
    }

    .step-tab.active .step-no {
      background: var(--create-orange);
      color: #fff;
    }

    .step-copy strong,
    .step-copy span {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .step-copy strong {
      color: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .step-copy span {
      margin-top: 3px;
      color: var(--create-faint);
      font-size: 11px;
      line-height: 1.35;
    }

    .form-panel {
      display: none;
      border: 1px solid var(--create-line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }

    .form-panel.active {
      display: block;
    }

    .section-block {
      padding: 22px 24px 24px;
      border-bottom: 1px solid var(--create-line);
    }

    .section-block:last-child {
      border-bottom: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .section-head span {
      color: var(--create-muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 16px;
    }

    .form-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label,
    .field-title {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px;
      color: var(--create-ink);
      font-size: 12px;
      font-weight: 800;
    }

    .required {
      color: var(--create-orange);
      font-weight: 900;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--create-line);
      border-radius: 8px;
      background: #fff;
      color: var(--create-ink);
      font-size: 13px;
    }

    .field input,
    .field select {
      height: 38px;
      padding: 0 11px;
    }

    .field textarea {
      min-height: 84px;
      resize: vertical;
      padding: 10px 11px;
      line-height: 1.55;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(232,93,44,0.6);
      box-shadow: 0 0 0 3px rgba(232,93,44,0.08);
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip input,
    .toggle-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice-chip span {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid var(--create-line);
      border-radius: 8px;
      background: #fff;
      color: #60656f;
      font-size: 12.5px;
      font-weight: 750;
      white-space: nowrap;
    }

    .choice-chip input:checked + span {
      border-color: rgba(232,93,44,0.45);
      background: #fff7f3;
      color: var(--create-orange);
    }

    .toggle-row {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-track {
      width: 42px;
      height: 24px;
      position: relative;
      border-radius: 999px;
      background: #d9dde4;
      transition: background 0.16s ease;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(17,24,39,0.18);
      transition: transform 0.16s ease;
    }

    .toggle-row input:checked + .toggle-track {
      background: var(--create-orange);
    }

    .toggle-row input:checked + .toggle-track::after {
      transform: translateX(18px);
    }

    .toggle-text {
      color: var(--create-muted);
      font-size: 12.5px;
      font-weight: 750;
    }

    .repeat-list {
      display: grid;
      gap: 8px;
    }

    .repeat-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--create-line);
      border-radius: 8px;
      background: #fff;
      color: #717681;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }

    .language-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .language-tab {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--create-line);
      border-radius: 8px;
      background: #fff;
      color: #6f737c;
      font-size: 12px;
      font-weight: 800;
    }

    .language-tab.active {
      border-color: rgba(232,93,44,0.4);
      background: #fff7f3;
      color: var(--create-orange);
    }

    .language-panel {
      display: none;
    }

    .language-panel.active {
      display: block;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .upload-field {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--create-line);
      border-radius: 10px;
      background: #fff;
    }

    .upload-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .upload-top strong {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 850;
    }

    .upload-limit {
      color: var(--create-faint);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .upload-box {
      min-height: 112px;
      display: grid;
      place-items: center;
      padding: 14px;
      border: 1px dashed #cfd3da;
      border-radius: 8px;
      background: var(--create-soft);
      color: var(--create-muted);
      text-align: center;
    }

    .upload-box input {
      width: 100%;
      max-width: 260px;
      color: var(--create-muted);
      font-size: 12px;
    }

    .upload-box svg {
      width: 22px;
      height: 22px;
      margin-bottom: 8px;
      color: var(--create-orange);
      stroke-width: 2;
    }

    .upload-hint {
      margin-top: 8px;
      color: var(--create-faint);
      font-size: 11px;
      line-height: 1.4;
    }

    .form-footer {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      padding: 12px 0 0;
      background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%);
    }

    .form-footer-left,
    .form-footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 980px) {
      .create-layout {
        grid-template-columns: 1fr;
      }

      .step-nav {
        position: static;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .create-head,
      .form-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .create-actions,
      .form-footer-left,
      .form-footer-right {
        justify-content: flex-end;
      }

      .form-grid,
      .form-grid.three,
      .upload-grid,
      .step-nav {
        grid-template-columns: 1fr;
      }

      .section-block {
        padding: 18px 16px 20px;
      }
    }
  </style>
</head>
<body>
  <div data-shortflow-nav="my-content"></div>

  <main class="main create-main">
    <div class="create-head">
      <div class="create-title">
        <h1>콘텐츠 등록</h1>
      </div>
      <div class="create-actions">
        <a class="create-link" href="contentlist-prod.html">목록</a>
        <button class="create-btn" type="button">임시저장</button>
      </div>
    </div>

    <form class="create-layout" id="contentCreateForm" novalidate>
      <aside class="step-nav" aria-label="콘텐츠 등록 단계">
        <button class="step-tab active" type="button" data-step-target="1">
          <span class="step-no">1</span>
          <span class="step-copy"><strong>기본 정보</strong><span>분류 · 조건 · 언어별 소개</span></span>
        </button>
        <button class="step-tab" type="button" data-step-target="2">
          <span class="step-no">2</span>
          <span class="step-copy"><strong>미디어 자료</strong><span>이미지 · 영상 · 문서</span></span>
        </button>
        <button class="step-tab" type="button" data-step-target="3">
          <span class="step-no">3</span>
          <span class="step-copy"><strong>상세 정보</strong><span>시청 정보 · 제작진</span></span>
        </button>
      </aside>

      <div>
        <section class="form-panel active" data-step-panel="1">
          <div class="section-block">
            <div class="section-head">
              <h2>콘텐츠 분류</h2>
              <span>STEP 1</span>
            </div>
            <div class="form-grid">
              <div class="field full">
                <div class="field-title">미디어 카테고리 <span class="required">*</span></div>
                <div class="chip-group">
                  <label class="choice-chip"><input type="radio" name="mediaCategory" value="drama" checked required><span>드라마</span></label>
                  <label class="choice-chip"><input type="radio" name="mediaCategory" value="animation" required><span>애니메이션</span></label>
                </div>
              </div>
              <div class="field full">
                <div class="field-title">장르 <span class="required">*</span></div>
                <div class="chip-group">
                  <label class="choice-chip"><input type="checkbox" name="genre" value="romance" checked><span>로맨스</span></label>
                  <label class="choice-chip"><input type="checkbox" name="genre" value="action"><span>액션</span></label>
                  <label class="choice-chip"><input type="checkbox" name="genre" value="thriller"><span>스릴러</span></label>
                  <label class="choice-chip"><input type="checkbox" name="genre" value="comedy"><span>코미디</span></label>
                  <label class="choice-chip"><input type="checkbox" name="genre" value="fantasy"><span>판타지</span></label>
                  <label class="choice-chip"><input type="checkbox" name="genre" value="revenge"><span>복수</span></label>
                </div>
              </div>
              <div class="field">
                <label for="contentLanguage">콘텐츠 언어 <span class="required">*</span></label>
                <select id="contentLanguage" required>
                  <option>한국어</option>
                  <option>영어</option>
                  <option>중국어</option>
                  <option>일본어</option>
                  <option>스페인어</option>
                </select>
              </div>
            </div>
          </div>

          <div class="section-block">
            <div class="section-head">
              <h2>콘텐츠 기본 정보</h2>
              <span>필수 정보</span>
            </div>
            <div class="form-grid three">
              <div class="field">
                <label for="originalTitle">원제 <span class="required">*</span></label>
                <input id="originalTitle" type="text" required placeholder="원본 언어 타이틀">
              </div>
              <div class="field">
                <label for="productionYear">제작 연도 <span class="required">*</span></label>
                <input id="productionYear" type="number" required placeholder="2024">
              </div>
              <div class="field">
                <label for="episodeCount">총 회차 수 <span class="required">*</span></label>
                <input id="episodeCount" type="number" required placeholder="60">
              </div>
              <div class="field">
                <label for="runtimePerEpisode">회차당 러닝타임 <span class="required">*</span></label>
                <input id="runtimePerEpisode" type="text" required placeholder="3분~5분">
              </div>
              <div class="field">
                <label for="totalRuntime">총 러닝타임(분) <span class="required">*</span></label>
                <input id="totalRuntime" type="number" required placeholder="240">
              </div>
              <div class="field">
                <label for="productionStatus">제작 상태 <span class="required">*</span></label>
                <select id="productionStatus" required>
                  <option>기획중</option>
                  <option>제작중</option>
                  <option>심의중</option>
                  <option selected>제작완료</option>
                </select>
              </div>
            </div>
          </div>

          <div class="section-block">
            <div class="section-head">
              <h2>유통 조건</h2>
              <span>라이선스 기준</span>
            </div>
            <div class="form-grid">
              <div class="field">
                <div class="field-title">독점 여부 <span class="required">*</span></div>
                <label class="toggle-row">
                  <input type="checkbox" name="exclusiveAvailable" checked>
                  <span class="toggle-track"></span>
                  <span class="toggle-text">독점 가능</span>
                </label>
              </div>
              <div class="field">
                <label for="productionType">제작 유형 <span class="required">*</span></label>
                <select id="productionType" required>
                  <option>단독제작</option>
                  <option>공동제작</option>
                  <option>대행</option>
                </select>
              </div>
              <div class="field">
                <label for="licenseType">라이선스 형태 <span class="required">*</span></label>
                <select id="licenseType" required>
                  <option>독점</option>
                  <option selected>비독점</option>
                  <option>둘 다 가능</option>
                </select>
              </div>
              <div class="field">
                <label for="licenseRegion">라이선스 지역 <span class="required">*</span></label>
                <input id="licenseRegion" type="text" required placeholder="전 세계, 아시아 등">
              </div>
              <div class="field full">
                <div class="field-title">기출시 이력 <span class="required">*</span></div>
                <div class="repeat-list" id="releaseHistoryList">
                  <div class="repeat-row">
                    <input type="text" name="releaseHistory" required placeholder="없음 또는 플랫폼/지역/일자">
                    <button class="icon-btn" type="button" data-add-release aria-label="기출시 이력 추가">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="section-block">
            <div class="section-head">
              <h2>다국어 콘텐츠 정보</h2>
              <div class="language-tabs" data-language-tabs="content">
                <button class="language-tab active" type="button" data-language="ko">한국어</button>
                <button class="language-tab" type="button" data-language="en">영어</button>
                <button class="language-tab" type="button" data-language="zh">중국어</button>
              </div>
            </div>

            <div class="language-panel active" data-language-panel="content" data-language="ko">
              <div class="form-grid">
                <div class="field">
                  <label>타이틀 <span class="required">*</span></label>
                  <input type="text" required placeholder="한국어 타이틀">
                </div>
                <div class="field">
                  <label>출시일 <span class="required">*</span></label>
                  <input type="text" required placeholder="2024년 2분기">
                </div>
                <div class="field full">
                  <label>로그라인 <span class="required">*</span></label>
                  <textarea required placeholder="한 줄 줄거리"></textarea>
                </div>
                <div class="field full">
                  <label>시놉시스 <span class="required">*</span></label>
                  <textarea required placeholder="줄거리 요약"></textarea>
                </div>
                <div class="field full">
                  <label>캐릭터 소개 <span class="required">*</span></label>
                  <textarea required placeholder="주요 캐릭터 소개"></textarea>
                </div>
              </div>
            </div>

            <div class="language-panel" data-language-panel="content" data-language="en">
              <div class="form-grid">
                <div class="field">
                  <label>타이틀 <span class="required">*</span></label>
                  <input type="text" required placeholder="English title">
                </div>
                <div class="field">
                  <label>출시일 <span class="required">*</span></label>
                  <input type="text" required placeholder="Q2 2024">
                </div>
                <div class="field full">
                  <label>로그라인 <span class="required">*</span></label>
                  <textarea required placeholder="One-line story"></textarea>
                </div>
                <div class="field full">
                  <label>시놉시스 <span class="required">*</span></label>
                  <textarea required placeholder="Synopsis"></textarea>
                </div>
                <div class="field full">
                  <label>캐릭터 소개 <span class="required">*</span></label>
                  <textarea required placeholder="Character introductions"></textarea>
                </div>
              </div>
            </div>

            <div class="language-panel" data-language-panel="content" data-language="zh">
              <div class="form-grid">
                <div class="field">
                  <label>타이틀 <span class="required">*</span></label>
                  <input type="text" required placeholder="中文标题">
                </div>
                <div class="field">
                  <label>출시일 <span class="required">*</span></label>
                  <input type="text" required placeholder="2024年第2季度">
                </div>
                <div class="field full">
                  <label>로그라인 <span class="required">*</span></label>
                  <textarea required placeholder="一句话剧情"></textarea>
                </div>
                <div class="field full">
                  <label>시놉시스 <span class="required">*</span></label>
                  <textarea required placeholder="剧情概要"></textarea>
                </div>
                <div class="field full">
                  <label>캐릭터 소개 <span class="required">*</span></label>
                  <textarea required placeholder="角色介绍"></textarea>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="form-panel" data-step-panel="2">
          <div class="section-block">
            <div class="section-head">
              <h2>미디어 자료</h2>
              <span>STEP 2</span>
            </div>
            <div class="upload-grid">
              <div class="upload-field">
                <div class="upload-top">
                  <strong>대표 이미지 <span class="required">*</span></strong>
                  <span class="upload-limit">단일 파일</span>
                </div>
                <label class="upload-box">
                  <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <input type="file" accept="image/*" required>
                  </span>
                </label>
                <div class="upload-hint">썸네일용 메인 이미지</div>
              </div>

              <div class="upload-field">
                <div class="upload-top">
                  <strong>콘텐츠 이미지</strong>
                  <span class="upload-limit">최대 10장</span>
                </div>
                <label class="upload-box">
                  <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <input type="file" accept="image/*" multiple>
                  </span>
                </label>
                <div class="upload-hint">스틸컷 등</div>
              </div>

              <div class="upload-field">
                <div class="upload-top">
                  <strong>티저 영상 <span class="required">*</span></strong>
                  <span class="upload-limit">최대 10개</span>
                </div>
                <label class="upload-box">
                  <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <input type="file" accept="video/*" multiple required>
                  </span>
                </label>
              </div>

              <div class="upload-field">
                <div class="upload-top">
                  <strong>무료 회차 <span class="required">*</span></strong>
                  <span class="upload-limit">최대 10개</span>
                </div>
                <label class="upload-box">
                  <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <input type="file" accept="video/*" multiple required>
                  </span>
                </label>
              </div>

              <div class="upload-field">
                <div class="upload-top">
                  <strong>기획안 문서</strong>
                  <span class="upload-limit">PDF 등</span>
                </div>
                <label class="upload-box">
                  <span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx">
                  </span>
                </label>
              </div>
            </div>
          </div>
        </section>

        <section class="form-panel" data-step-panel="3">
          <div class="section-block">
            <div class="section-head">
              <h2>시청 정보</h2>
              <span>STEP 3</span>
            </div>
            <div class="form-grid three">
              <div class="field">
                <label for="paidStartEpisode">유료 시청 권장 시작 회차 <span class="required">*</span></label>
                <input id="paidStartEpisode" type="number" required placeholder="3">
              </div>
              <div class="field">
                <label for="rating">영상 등급 <span class="required">*</span></label>
                <select id="rating" required>
                  <option>전체</option>
                  <option>12세</option>
                  <option>15세</option>
                  <option>청불</option>
                </select>
              </div>
              <div class="field">
                <label for="contentType">콘텐츠 유형 <span class="required">*</span></label>
                <select id="contentType" required>
                  <option>오리지널</option>
                  <option>리메이크</option>
                </select>
              </div>
            </div>
          </div>

          <div class="section-block">
            <div class="section-head">
              <h2>제작진</h2>
              <div class="language-tabs" data-language-tabs="crew">
                <button class="language-tab active" type="button" data-language="ko">한국어</button>
                <button class="language-tab" type="button" data-language="en">영어</button>
                <button class="language-tab" type="button" data-language="zh">중국어</button>
              </div>
            </div>

            <div class="language-panel active" data-language-panel="crew" data-language="ko">
              <div class="form-grid">
                <div class="field">
                  <label>감독 <span class="required">*</span></label>
                  <input type="text" required>
                </div>
                <div class="field">
                  <label>작가 <span class="required">*</span></label>
                  <input type="text" required>
                </div>
                <div class="field full">
                  <label>출연 배우 <span class="required">*</span></label>
                  <textarea required placeholder="배우명을 줄바꿈 또는 쉼표로 구분"></textarea>
                </div>
              </div>
            </div>

            <div class="language-panel" data-language-panel="crew" data-language="en">
              <div class="form-grid">
                <div class="field">
                  <label>감독 <span class="required">*</span></label>
                  <input type="text" required>
                </div>
                <div class="field">
                  <label>작가 <span class="required">*</span></label>
                  <input type="text" required>
                </div>
                <div class="field full">
                  <label>출연 배우 <span class="required">*</span></label>
                  <textarea required placeholder="Actor names"></textarea>
                </div>
              </div>
            </div>

            <div class="language-panel" data-language-panel="crew" data-language="zh">
              <div class="form-grid">
                <div class="field">
                  <label>감독 <span class="required">*</span></label>
                  <input type="text" required>
                </div>
                <div class="field">
                  <label>작가 <span class="required">*</span></label>
                  <input type="text" required>
                </div>
                <div class="field full">
                  <label>출연 배우 <span class="required">*</span></label>
                  <textarea required placeholder="演员名单"></textarea>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="form-footer">
          <div class="form-footer-left">
            <button class="create-btn" type="button" data-prev-step disabled>이전</button>
          </div>
          <div class="form-footer-right">
            <button class="create-btn" type="button">임시저장</button>
            <button class="create-btn primary" type="button" data-next-step>다음</button>
            <button class="create-btn primary" type="submit" data-submit hidden>등록 신청</button>
          </div>
        </div>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('contentCreateForm');
    const stepTabs = Array.from(document.querySelectorAll('[data-step-target]'));
    const stepPanels = Array.from(document.querySelectorAll('[data-step-panel]'));
    const prevButton = document.querySelector('[data-prev-step]');
    const nextButton = document.querySelector('[data-next-step]');
    const submitButton = document.querySelector('[data-submit]');
    let currentStep = 1;

    function setStep(step) {
      currentStep = Math.min(3, Math.max(1, step));
      stepTabs.forEach(tab => {
        tab.classList.toggle('active', Number(tab.dataset.stepTarget) === currentStep);
      });
      stepPanels.forEach(panel => {
        panel.classList.toggle('active', Number(panel.dataset.stepPanel) === currentStep);
      });
      prevButton.disabled = currentStep === 1;
      nextButton.hidden = currentStep === 3;
      submitButton.hidden = currentStep !== 3;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    stepTabs.forEach(tab => {
      tab.addEventListener('click', () => setStep(Number(tab.dataset.stepTarget)));
    });

    prevButton.addEventListener('click', () => setStep(currentStep - 1));
    nextButton.addEventListener('click', () => setStep(currentStep + 1));

    document.querySelectorAll('[data-language-tabs]').forEach(group => {
      group.addEventListener('click', event => {
        const button = event.target.closest('[data-language]');
        if (!button) return;
        const scope = group.dataset.languageTabs;
        const language = button.dataset.language;
        document.querySelectorAll(`[data-language-tabs="${scope}"] .language-tab`).forEach(tab => {
          tab.classList.toggle('active', tab === button);
        });
        document.querySelectorAll(`[data-language-panel="${scope}"]`).forEach(panel => {
          panel.classList.toggle('active', panel.dataset.language === language);
        });
      });
    });

    document.querySelector('[data-add-release]').addEventListener('click', () => {
      const list = document.getElementById('releaseHistoryList');
      const row = document.createElement('div');
      row.className = 'repeat-row';
      row.innerHTML = `
        <input type="text" name="releaseHistory" placeholder="플랫폼/지역/일자">
        <button class="icon-btn" type="button" data-remove-release aria-label="기출시 이력 삭제">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
      `;
      list.appendChild(row);
    });

    document.getElementById('releaseHistoryList').addEventListener('click', event => {
      const button = event.target.closest('[data-remove-release]');
      if (button) button.closest('.repeat-row').remove();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      alert('콘텐츠 등록 신청 화면입니다.');
    });
  </script>
</body>
</html>
